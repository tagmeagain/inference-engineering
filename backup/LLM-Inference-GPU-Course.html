/* ============================================================
   PART 1 — How LLM Inference Works (topics 1–4)
   ============================================================ */
part({
  num: 1, title: "How LLM Inference Works",
  blurb: "What the model actually does when it answers: one forward pass per new token, with prefill first and decode after.",
  story: "LLM inference → <b>prefill + decode</b> → these two phases do very different kinds of work. Everything later builds on this split.",
});

/* ---------- Topic 1 ---------- */
topic({
  num: 1, title: "What is LLM inference?",
  question: "What is the model doing when it answers me?",
  render: () => `
    ${say(
      "<b>Training</b> teaches a model: it shows the model data, measures how wrong it was, and nudges the weights. This repeats millions of times.",
      "<b>Inference</b> uses the finished model. The weights are frozen. The model reads your text and predicts <b>one next token</b>. Then it adds that token to the text and predicts again."
    )}
    ${see("How is inference different from training?", `
      <div class="grid2">
        <div class="loop-box"><h4>Training <span class="pill memory">weights change</span></h4>
          ${flow([{ t: "Data batch" }, { t: "Model", c: "compute" }, { t: "Loss" }, { t: "Update weights", c: "memory" }, { t: "↺ repeat" }], { id: "t1-train" })}
          <p class="c-muted" style="font-size:.85rem">Forward pass + backward pass + weight update.</p></div>
        <div class="loop-box"><h4>Inference <span class="pill ok">weights frozen</span></h4>
          ${flow([{ t: "Prompt" }, { t: "Model", c: "compute" }, { t: "Next token", c: "kv" }, { t: "Add to text" }, { t: "↺ repeat" }], { id: "t1-inf" })}
          <p class="c-muted" style="font-size:.85rem">Forward pass only. No loss, no update.</p></div>
      </div>`)}
    ${see("Can I watch generation happen one token at a time?", `
      <div class="tokens" id="t1-text"></div>
      <div class="grid2" style="align-items:center">
        <div class="model-box" id="t1-model">Model (frozen weights)</div>
        <div class="stat-row">
          <div class="stat"><span class="v" id="t1-passes">0</span><span class="k">forward passes run</span></div>
          <div class="stat"><span class="v" id="t1-new">0</span><span class="k">new tokens written</span></div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn primary" id="t1-step">Run one forward pass</button>
        <button type="button" class="btn" id="t1-auto">▶ Auto-play</button>
        <button type="button" class="btn" id="t1-reset">Reset</button>
      </div>
      <p class="c-muted" style="font-size:.85rem" id="t1-msg">Each click reads all the text so far and writes <b>one</b> token.</p>`)}
    ${ex(`<p>Prompt: <span class="tok prompt">Why</span> <span class="tok prompt"> is</span> <span class="tok prompt"> the</span> <span class="tok prompt"> sky</span></p>
      <div class="calc">pass 1 → " blue"<br>pass 2 → " during"<br>pass 3 → " the"<br>… a 200-token answer needs about 200 passes through the model.</div>`)}
    ${tech(`
      <ul>
        <li><b>Forward pass:</b> running inputs through every layer of the network, from input to output, using the weights. Inference only does forward passes.</li>
        <li><b>Next-token prediction:</b> the output of a forward pass is a score for every token in the vocabulary. One token is picked from those scores.</li>
        <li><b>Autoregressive generation:</b> each new token is added to the input, so the output of one step becomes part of the input to the next step.</li>
      </ul>
      <div class="scroll-x"><table class="cmp-table">
        <tr><th></th><th>Training</th><th>Inference</th></tr>
        <tr><td>Goal</td><td>Learn good weights</td><td>Use the weights to answer</td></tr>
        <tr><td>Passes</td><td>Forward + backward</td><td>Forward only</td></tr>
        <tr><td>Weights</td><td>Updated every step</td><td>Read-only</td></tr>
        <tr><td>Extra memory</td><td>Gradients, optimizer states</td><td>KV cache (you'll meet this soon)</td></tr>
        <tr><td>What users feel</td><td>Hours or weeks of training time</td><td>Latency per request and per token</td></tr>
      </table></div>`)}
    ${inf(`<p>Because an answer is produced token by token, the GPU runs the model <b>again and again</b>, once per new token. How fast each of those passes runs decides how fast text appears on screen.</p>`)}
    ${check({
      q: "During inference, what happens to the model weights?",
      opts: ["They are updated after every token", "They stay frozen and are only read", "They are updated after each full response", "They are deleted after the prompt is read"],
      a: 1, why: "Inference never changes the weights. It only reads them, again and again, for every token. That repeated reading will matter a lot when we get to GPU memory.",
    })}`,
  mount(root, ctx) {
    let ti = 0, ii = 0;
    ctx.every(900, () => { setFlow($("#t1-train", root), ti % 5); setFlow($("#t1-inf", root), ii % 5); ti++; ii++; });
    const prompt = ["Why", " is", " the", " sky"];
    const gen = [" blue", " during", " the", " day", "?", " Sunlight", " scatters", " off", " air", " molecules", "."];
    let out = [], busy = false, auto = null;
    const text = $("#t1-text", root), model = $("#t1-model", root);
    const draw = (fresh) => {
      text.innerHTML = prompt.map(t => `<span class="tok prompt">${t}</span>`).join("") +
        out.map((t, i) => `<span class="tok gen ${fresh && i === out.length - 1 ? "new" : ""}">${t}</span>`).join("");
      $("#t1-passes", root).textContent = out.length;
      $("#t1-new", root).textContent = out.length;
    };
    const step = () => {
      if (busy) return;
      if (out.length >= gen.length) { $("#t1-msg", root).innerHTML = "Done: the model produced an end of sentence. Press Reset to run again."; stopAuto(); return; }
      busy = true;
      $$(".tok", text).forEach(t => t.classList.add("lit"));
      model.classList.add("busy"); model.textContent = "Forward pass: reading all tokens so far…";
      ctx.after(550, () => {
        model.classList.remove("busy"); model.textContent = "Model (frozen weights)";
        out.push(gen[out.length]); draw(true); busy = false;
        $("#t1-msg", root).innerHTML = `Pass ${out.length} read <b>${prompt.length + out.length - 1}</b> tokens and wrote <b>1</b> new token: <code>${JSON.stringify(out[out.length - 1])}</code>.`;
      });
    };
    const stopAuto = () => { if (auto) { ctx.stop(auto); auto = null; $("#t1-auto", root).textContent = "▶ Auto-play"; } };
    $("#t1-step", root).onclick = step;
    $("#t1-auto", root).onclick = () => {
      if (auto) return stopAuto();
      $("#t1-auto", root).textContent = "❚❚ Pause"; step(); auto = ctx.every(900, step);
    };
    $("#t1-reset", root).onclick = () => { stopAuto(); out = []; draw(); $("#t1-msg", root).innerHTML = "Each click reads all the text so far and writes <b>one</b> token."; };
    draw();
  },
});

/* ---------- Topic 2 ---------- */
topic({
  num: 2, title: "What happens when you send a prompt?",
  question: "What steps turn my text into the next word?",
  render: () => `
    ${say("Computers can't do maths on words. So your text is cut into pieces (<b>tokens</b>), each piece becomes a number, each number becomes a list of numbers (a <b>vector</b>), and the model transforms those vectors layer by layer. At the end it scores every possible next token and picks one.")}
    ${see("What happens to the prompt “The cat sat” at each stage?", `
      <div class="pipeline-stages" id="t2-stages"></div>
      <div class="stage-panel" id="t2-panel"></div>
      <div class="btn-row">
        <button type="button" class="btn" id="t2-prev">← Stage</button>
        <button type="button" class="btn primary" id="t2-next">Next stage →</button>
        <button type="button" class="btn" id="t2-play">▶ Play all</button>
      </div>`, "Click each stage")}
    ${ex(`<div class="calc">"The cat sat" → 3 tokens → 3 IDs → 3 vectors → through every layer → scores for ~100k tokens → pick " on"<br>
      Then: "The cat sat on" → run again → " the" → …</div>`)}
    ${tech(`<ul>
      <li><b>Tokenizer:</b> splits text into sub-word pieces from a fixed vocabulary (often 32k–200k entries).</li>
      <li><b>Embedding lookup:</b> a big table (vocabulary × hidden size). Token ID <i>i</i> selects row <i>i</i>.</li>
      <li><b>Transformer layer:</b> attention (tokens exchange information) followed by an MLP (each token is processed on its own). Both are mostly matrix multiplications.</li>
      <li><b>Logits:</b> one raw score per vocabulary token. Softmax turns them into probabilities. <b>Sampling</b> (greedy, top-p, temperature) picks the token.</li>
    </ul>`)}
    ${inf(`<p>Almost all GPU time is spent inside the <b class="c-compute">Transformer layers</b>. Tokenization and sampling are cheap by comparison. The layers are where the weights are read and where the matrix maths happens.</p>`)}
    ${check({
      q: "What are logits?",
      opts: ["The token IDs of the prompt", "One score per possible next token", "The model weights for the last layer", "The cached attention values"],
      a: 1, why: "Logits are raw scores, one for every token in the vocabulary. Softmax turns them into probabilities, and a sampler picks the next token.",
    })}`,
  mount(root, ctx) {
    const stages = [
      { n: "Prompt", h: `<p>You type plain text.</p><div class="tokens"><span class="tok" style="font-size:1.1rem">The cat sat</span></div>` },
      { n: "Tokenization", h: `<p>The text is split into <b>tokens</b>: common words or pieces of words. Note the leading spaces: they are part of the token.</p>
          <div class="tokens"><span class="tok prompt">The</span><span class="tok prompt"> cat</span><span class="tok prompt"> sat</span></div>` },
      { n: "Token IDs", h: `<p>Each token is looked up in the vocabulary and replaced by its ID number.</p>
          <div class="tokens"><span class="tok prompt">The → 464</span><span class="tok prompt"> cat → 3797</span><span class="tok prompt"> sat → 3332</span></div>
          <p class="c-muted" style="font-size:.8rem">IDs shown are illustrative; every tokenizer has its own numbering.</p>` },
      { n: "Embeddings", h: `<p>Each ID picks a row from the embedding table, giving a <b>vector</b>: a list of numbers that stands for the token's meaning.</p>
          <div style="display:grid;gap:6px">
            <div>464 → <span class="vec"><span>0.12</span><span>-0.80</span><span>0.33</span><span>0.05</span><span>…</span></span></div>
            <div>3797 → <span class="vec"><span>0.91</span><span>0.14</span><span>-0.42</span><span>0.60</span><span>…</span></span></div>
            <div>3332 → <span class="vec"><span>-0.27</span><span>0.55</span><span>0.08</span><span>-0.71</span><span>…</span></span></div>
          </div><p class="c-muted" style="font-size:.8rem">Real models use thousands of numbers per token (for example 4,096 or 8,192), not 4.</p>` },
      { n: "Transformer layers", h: `<p>The vectors pass through a stack of identical layers. In each layer, <b>attention</b> lets tokens look at earlier tokens, and an <b>MLP</b> transforms each token. Both steps are big <b class="c-compute">matrix multiplications with the weights</b>.</p>
          <div class="layers" id="t2-layers">${"<i></i>".repeat(24)}</div><p class="c-muted" style="font-size:.8rem">A 70B-class model has about 80 of these layers.</p>` },
      { n: "Logits", h: `<p>The last token's final vector is turned into one score for every token in the vocabulary. Higher score means more likely next.</p>
          <div class="bars-h">${[[" on", 62], [" down", 18], [" in", 7], [" there", 5], [" quietly", 3]].map(([t, p], i) => `<div class="row ${i === 0 ? "pick" : ""}"><span class="mono">"${t}"</span><div><div class="b" style="width:${p}%"></div></div><span class="v">${p}%</span></div>`).join("")}</div>` },
      { n: "Next token", h: `<p>A sampler picks one token. With greedy decoding it takes the highest score.</p>
          <div class="tokens"><span class="tok prompt">The</span><span class="tok prompt"> cat</span><span class="tok prompt"> sat</span><span class="tok gen new"> on</span></div>` },
      { n: "Repeat", h: `<p>The new token is added to the text, and the model runs again to get the next one. This loop continues until a stop token or a length limit.</p>
          <div class="tokens"><span class="tok prompt">The</span><span class="tok prompt"> cat</span><span class="tok prompt"> sat</span><span class="tok gen"> on</span><span class="tok gen new"> the</span><span class="tok ghost"> mat</span><span class="tok ghost"> …</span></div>
          <p class="c-muted" style="font-size:.85rem">Coming up: the model does <i>not</i> need to redo all the old work each time. That is what the KV cache is for.</p>` },
    ];
    let cur = 0, seen = new Set([0]), layerTimer = null, play = null;
    const show = (i) => {
      cur = clamp(i, 0, stages.length - 1); seen.add(cur);
      $("#t2-stages", root).innerHTML = stages.map((s, j) =>
        (j ? `<span class="c-muted">→</span>` : "") + `<button type="button" class="stage-btn ${j === cur ? "on" : seen.has(j) ? "seen" : ""}" data-s="${j}">${s.n}</button>`).join("");
      $("#t2-panel", root).innerHTML = `<div class="mini-label">Stage ${cur + 1} of ${stages.length}</div><h4 style="font-size:1.1rem">${stages[cur].n}</h4>${stages[cur].h}`;
      if (layerTimer) ctx.stop(layerTimer);
      if (stages[cur].n === "Transformer layers") {
        let k = 0; const ls = $$("#t2-layers i", root);
        layerTimer = ctx.every(90, () => { ls.forEach((l, j) => l.classList.toggle("on", j <= k % (ls.length + 6))); k++; });
      }
      $("#t2-prev", root).disabled = cur === 0;
    };
    $("#t2-stages", root).onclick = e => { const b = e.target.closest(".stage-btn"); if (b) show(+b.dataset.s); };
    $("#t2-prev", root).onclick = () => show(cur - 1);
    $("#t2-next", root).onclick = () => show(cur + 1 >= stages.length ? 0 : cur + 1);
    $("#t2-play", root).onclick = () => {
      if (play) { ctx.stop(play); play = null; $("#t2-play", root).textContent = "▶ Play all"; return; }
      show(0); $("#t2-play", root).textContent = "❚❚ Pause";
      play = ctx.every(2600, () => { if (cur >= stages.length - 1) { ctx.stop(play); play = null; $("#t2-play", root).textContent = "▶ Play all"; } else show(cur + 1); });
    };
    show(0);
  },
});

/* ---------- Topic 3 ---------- */
topic({
  num: 3, title: "Prefill vs Decode",
  question: "Why does the answer start slowly, then flow word by word?",
  render: () => `
    ${say(
      "Every request has two phases.",
      "<b class='c-compute'>Prefill</b> = read the prompt you already wrote. All those tokens are known, so the GPU can process them <b>together, in parallel</b>, in one big pass.",
      "<b class='c-kv'>Decode</b> = write the answer. Token 5 cannot be computed before token 4 exists, so decode happens <b>one token per pass</b>, in sequence."
    )}
    ${see("How is the work different in the two phases?", `
      <div class="grid2">
        <div class="loop-box">
          <h4>Prefill <span class="pill compute">all prompt tokens at once</span></h4>
          <div class="tokens" id="t3-prompt"></div>
          <div class="model-box" id="t3-pmodel">GPU</div>
          <div class="stat"><span class="v" id="t3-prows">–</span><span class="k">tokens processed in this pass</span></div>
        </div>
        <div class="loop-box">
          <h4>Decode <span class="pill memory">one token per pass</span></h4>
          <div class="tokens" id="t3-out"><span class="c-muted" style="font-size:.85rem">waiting for prefill…</span></div>
          <div class="model-box" id="t3-dmodel">GPU</div>
          <div class="stat"><span class="v" id="t3-drows">–</span><span class="k">new tokens processed in this pass</span></div>
        </div>
      </div>
      <div>
        <div class="mini-label" style="margin-bottom:6px">Timeline (what the user experiences)</div>
        <div id="t3-timeline" style="display:flex;gap:3px;align-items:flex-end;height:64px;border-bottom:1.5px solid var(--line);padding-bottom:2px"></div>
        <div id="t3-marks" style="position:relative;height:36px;font-size:.78rem"></div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn primary" id="t3-play">▶ Send the prompt</button>
        ${seg("t3-len", [["short", "Short prompt (5 tokens)"], ["long", "Long prompt (2,000 tokens)"]], "long")}
      </div>
      <p class="c-muted" style="font-size:.85rem">Bar height = how many tokens a pass processes. Bar width = roughly how long it takes. ${illus("Conceptual timing")}</p>`)}
    ${ex(`<div class="calc">Prompt = 2,000 tokens, answer = 300 tokens<br>
      Prefill: <b>1 pass</b> over 2,000 tokens → first token appears (TTFT)<br>
      Decode: <b>about 300 passes</b>, 1 new token each → the rest of the answer streams in</div>`)}
    ${tech(`<ul>
      <li><b>TTFT (Time To First Token):</b> time from sending the request to seeing the first output token. Mostly prefill time, plus any time spent waiting in a queue.</li>
      <li><b>Inter-token latency (ITL)</b>, also called time per output token (TPOT): the gap between consecutive output tokens. Set by how long one decode pass takes.</li>
      <li>Total time for a response ≈ TTFT + (number of output tokens − 1) × ITL.</li>
    </ul>`)}
    ${inf(`<p>These phases put very different kinds of pressure on the GPU. Prefill is a lot of <b class="c-compute">computation</b> in one go. Decode is a small amount of computation that <b>repeats hundreds of times</b>, and each repeat still reads the whole model. Parts 2 and 3 explain why that difference matters so much.</p>`)}
    ${check({
      q: "A user says: “The answer takes a long time to START, but then streams quickly.” Which phase is most likely slow?",
      opts: ["Decode", "Prefill (or waiting before prefill)", "Tokenization", "Sampling"],
      a: 1, why: "Time to first token is mostly queueing plus prefill. Long prompts make prefill heavier. Fast streaming afterwards means decode is fine.",
    })}`,
  mount(root, ctx) {
    const prompt = ["Explain", " how", " neural", " networks", " work"];
    const out = [" Neural", " networks", " learn", " by", " adjusting", " weights"];
    let running = false;
    const drawPrompt = (lit) => $("#t3-prompt", root).innerHTML = prompt.map(t => `<span class="tok prompt ${lit ? "lit" : ""}">${t}</span>`).join("");
    drawPrompt(false);
    const run = () => {
      if (running) return; running = true;
      const long = segVal(root, "t3-len") === "long";
      const tl = $("#t3-timeline", root), marks = $("#t3-marks", root);
      tl.innerHTML = ""; marks.innerHTML = "";
      $("#t3-out", root).innerHTML = ""; $("#t3-drows", root).textContent = "–";
      const pW = long ? 150 : 34;
      drawPrompt(true);
      $("#t3-pmodel", root).classList.add("busy"); $("#t3-pmodel", root).textContent = "Prefill pass: all tokens in parallel";
      $("#t3-prows", root).textContent = long ? "2,000" : "5";
      const bar = document.createElement("div");
      Object.assign(bar.style, { width: "0px", height: "60px", background: "var(--compute)", borderRadius: "3px 3px 0 0", transition: `width ${long ? 1.4 : .5}s linear` });
      tl.appendChild(bar); requestAnimationFrame(() => bar.style.width = pW + "px");
      ctx.after(long ? 1450 : 550, () => {
        drawPrompt(false);
        $("#t3-pmodel", root).classList.remove("busy"); $("#t3-pmodel", root).textContent = "GPU";
        marks.innerHTML = `<div style="position:absolute;left:${pW - 2}px;top:0;border-left:2px solid var(--ink);height:14px"></div><div style="position:absolute;left:${Math.max(0, pW - 60)}px;top:14px;white-space:nowrap"><b>TTFT</b>: first token</div>`;
        let k = 0;
        const dstep = () => {
          if (k >= out.length) { running = false; return; }
          const dm = $("#t3-dmodel", root); dm.classList.add("busy"); dm.textContent = `Decode pass ${k + 1}`;
          $("#t3-drows", root).textContent = "1";
          const b = document.createElement("div");
          Object.assign(b.style, { width: "0px", height: "8px", background: "var(--memory)", borderRadius: "2px 2px 0 0", transition: "width .35s linear" });
          tl.appendChild(b); requestAnimationFrame(() => b.style.width = "22px");
          ctx.after(420, () => {
            dm.classList.remove("busy"); dm.textContent = "GPU";
            const o = $("#t3-out", root); o.insertAdjacentHTML("beforeend", `<span class="tok gen new">${out[k]}</span>`);
            if (k === 1) marks.insertAdjacentHTML("beforeend", `<div style="position:absolute;left:${pW + 30}px;top:14px;white-space:nowrap;color:var(--memory)">← gap between tokens = <b>ITL</b></div>`);
            k++; ctx.after(160, dstep);
          });
        };
        dstep();
      });
    };
    $("#t3-play", root).onclick = run;
    bindSeg(root, "t3-len", () => { });
  },
});

/* ---------- Topic 4 ---------- */
topic({
  num: 4, title: "KV Cache",
  question: "Why doesn't the model redo all the old work for every new token?",
  render: () => `
    ${say(
      "In attention, each token asks earlier tokens for information. Every token gives out two things: a <b>Key</b> (a label: “this is what I'm about”) and a <b>Value</b> (the information it passes on). The new token's <b>Query</b> says what it is looking for.",
      "When generating text, the Keys and Values of old tokens <b>never change</b>. So instead of recalculating them for every new token, we <b class='c-kv'>store them in GPU memory and reuse them</b>. That store is the <b class='c-kv'>KV cache</b>."
    )}
    ${see("What work gets repeated without a cache?", `
      <div class="btn-row">${seg("t4-mode", [["no", "Without KV cache"], ["yes", "With KV cache"]], "no")}
        <button type="button" class="btn primary" id="t4-step">Generate next token</button>
        <button type="button" class="btn" id="t4-auto">▶ Auto</button>
        <button type="button" class="btn" id="t4-reset">Reset</button></div>
      <div class="scroll-x"><div class="kv-grid" id="t4-grid" style="min-width:520px"></div></div>
      <div class="btn-row" style="gap:16px;font-size:.82rem">
        <span><span class="pill compute">■</span> K/V computed this pass</span>
        <span><span class="pill" style="background:var(--kv-soft);color:var(--kv)">■</span> K/V read from cache</span></div>
      <div class="stat-row">
        <div class="stat"><span class="v c-compute" id="t4-comp">0</span><span class="k">total K/V computations</span></div>
        <div class="stat"><span class="v c-kv" id="t4-stored">0</span><span class="k">K/V entries held in memory</span></div>
        <div class="stat"><span class="v" id="t4-other">–</span><span class="k">same run, other mode</span></div>
      </div>`)}
    ${see("How big does the KV cache get?", `
      <div class="controls">
        ${slider("t4-ctx", "Context length (tokens)", 0, 7, 1, 3)}
        ${slider("t4-batch", "Concurrent requests", 1, 64, 1, 1)}
      </div>
      <div class="stack" id="t4-stack"></div>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t4-per">–</span><span class="k">KV cache per token</span></div>
        <div class="stat"><span class="v c-kv" id="t4-total">–</span><span class="k">total KV cache</span></div>
        <div class="stat"><span class="v" id="t4-fit">–</span><span class="k">vs an 80 GB GPU</span></div>
      </div>
      <p class="c-muted" style="font-size:.82rem">70B-class model with grouped-query attention: 80 layers, 8 K/V heads, 128 numbers per head, FP16. The 80 GB bar ignores the weights (which alone would need about 140 GB). ${illus("Approximate")}</p>`, "See it grow")}
    ${ex(`<div class="calc">Generate 8 tokens:<br>
      without cache: 1+2+3+…+8 = <b>36</b> K/V computations<br>
      with cache: <b>8</b> computations, and 8 entries kept in memory<br>
      For 1,000 tokens: 500,500 vs 1,000.</div>`)}
    ${tech(`<ul>
      <li>For each token, each layer projects the hidden vector into Q, K and V: <code>Q = X·W<sub>q</sub></code>, <code>K = X·W<sub>k</sub></code>, <code>V = X·W<sub>v</sub></code>.</li>
      <li>Attention output = softmax(Q·Kᵀ / √d) · V. A new token needs K and V of <b>all earlier tokens</b> in every layer.</li>
      <li>Because of causal masking, earlier tokens' K and V don't depend on later tokens, so caching them is exact: it changes speed, not the answer.</li>
      <li>The cache grows by one entry per layer for every token processed (prompt tokens and generated tokens).</li>
    </ul>`)}
    ${fx(["KV cache bytes = 2 × layers × KV heads × head size × bytes per number × tokens × requests"], "The 2 is for storing both K and V.")}
    ${inf(`<p>Prefill writes the prompt's K/V into the cache. Each decode step adds one more entry and <b>reads the whole cache</b>. So long contexts and many users can make the KV cache as large as the model weights, and it all lives in GPU memory.</p>`)}
    ${key(`The KV cache <b>trades memory for computation</b>: store old Keys and Values once, and never recompute them.`)}
    ${check({
      q: "You double the context length of one request. Roughly what happens to its KV cache memory?",
      opts: ["Stays the same", "Doubles", "Quadruples", "Halves"],
      a: 1, why: "The cache holds one entry per token (per layer), so it grows linearly with context length: twice the tokens, twice the memory.",
    })}`,
  mount(root, ctx) {
    const N = 8, words = ["The", " cat", " sat", " on", " the", " mat", " and", " purred"];
    let n = 0, auto = null;
    const tri = (k) => k * (k + 1) / 2;
    const draw = () => {
      const mode = segVal(root, "t4-mode");
      const g = $("#t4-grid", root); g.style.setProperty("--n", N);
      let html = `<div class="r"><span></span>${words.map(w => `<span class="c empty" style="color:var(--ink)">${w}</span>`).join("")}</div>`;
      for (let r = 1; r <= N; r++) {
        html += `<div class="r"><span class="gl">${r <= n ? `pass ${r}` : ""}</span>`;
        for (let c = 1; c <= N; c++) {
          if (r > n || c > r) { html += `<span class="c empty"></span>`; continue; }
          const comp = mode === "no" || c === r;
          html += `<span class="c ${comp ? "comp" : "cache"}">${comp ? "K,V" : "↺"}</span>`;
        }
        html += `</div>`;
      }
      g.innerHTML = html;
      $("#t4-comp", root).textContent = mode === "no" ? tri(n) : n;
      $("#t4-stored", root).textContent = mode === "no" ? "0 (thrown away)" : n;
      $("#t4-other", root).textContent = mode === "no" ? `${n} computations with cache` : `${tri(n)} computations without`;
    };
    const step = () => { if (n >= N) { if (auto) { ctx.stop(auto); auto = null; $("#t4-auto", root).textContent = "▶ Auto"; } return; } n++; draw(); };
    $("#t4-step", root).onclick = step;
    $("#t4-reset", root).onclick = () => { n = 0; draw(); };
    $("#t4-auto", root).onclick = () => {
      if (auto) { ctx.stop(auto); auto = null; $("#t4-auto", root).textContent = "▶ Auto"; return; }
      if (n >= N) n = 0;
      $("#t4-auto", root).textContent = "❚❚ Pause"; auto = ctx.every(700, step);
    };
    bindSeg(root, "t4-mode", draw);
    draw();

    const ctxs = [512, 1024, 2048, 4096, 8192, 32768, 65536, 131072];
    const m = MODELS["70B"], per = kvBytesPerToken(m, 2);
    bindSliders(root, {
      "t4-ctx": v => ctxs[v].toLocaleString("en-US"),
      "t4-batch": v => v,
    }, v => {
      const total = per * ctxs[v["t4-ctx"]] * v["t4-batch"];
      const cap = DEMO.hbmGB * 1e9;
      $("#t4-per", root).textContent = gb(per);
      $("#t4-total", root).textContent = gb(total);
      const fits = total <= cap;
      $("#t4-fit", root).innerHTML = fits ? `<span class="c-ok">${Math.round(total / cap * 100)}% of 80 GB</span>` : `<span class="c-bad">${fmt(total / cap, 1)}× too big</span>`;
      const w = Math.min(100, total / cap * 100);
      $("#t4-stack", root).innerHTML = `<span class="s-kv" style="width:${w}%">${w > 12 ? "KV cache" : ""}</span><span class="s-free" style="width:${100 - w}%">${100 - w > 20 ? "rest of 80 GB" : ""}</span>`;
    });
  },
});

/* ---- src/part2.js ---- */
/* ============================================================
   PART 2 — How GPUs Execute LLMs (topics 5–9)
   ============================================================ */
part({
  num: 2, title: "How GPUs Execute LLMs",
  blurb: "What is physically inside the GPU, where the weights and KV cache sit, and how data reaches the circuits that do the maths.",
  story: "GPU executes matrix operations → <b>weights + KV cache live in GPU memory</b> → SMs run the work → Tensor Cores speed up matrix maths → the memory hierarchy decides how fast data reaches compute.",
});

/* Shared component descriptions (used by topics 5 and 7) */
const GPU_PARTS = {
  cpu: { name: "CPU", what: "The server's general-purpose processor.", where: "On the host motherboard, outside the GPU.", does: "Runs the serving program: receives requests, tokenizes text, schedules work, and sends commands to the GPU.", inf: "Orchestrates inference but does almost none of the heavy maths." },
  ram: { name: "CPU RAM", what: "The server's main system memory.", where: "On the host motherboard, next to the CPU.", does: "Holds programs and data for the CPU. Large, but far from the GPU.", inf: "Model files are read from disk into CPU RAM and then copied to the GPU once, at load time. Some systems offload spare KV cache here, at a speed cost." },
  disk: { name: "Disk / storage", what: "Long-term storage (SSD or network storage).", where: "Attached to the host server.", does: "Keeps model files when nothing is running.", inf: "Only used when loading the model. Far too slow to read weights from during generation." },
  pcie: { name: "PCIe link", what: "The standard connection between CPU and GPU.", where: "Between the host motherboard and the GPU card.", does: "Moves data between CPU RAM and GPU memory.", inf: "Used to load weights and send inputs and outputs. Much slower than the GPU's own memory path, so we avoid using it during every token." },
  board: { name: "GPU", what: "A processor built for doing the same maths on lots of data at the same time.", where: "A card or module plugged into the server, with its own chip and its own memory.", does: "Runs thousands of simple calculations in parallel.", inf: "Runs every Transformer layer: the matrix multiplications, attention, and all supporting maths for prefill and decode." },
  die: { name: "GPU chip (die)", what: "The silicon chip where the computation happens.", where: "At the centre of the GPU package, surrounded by HBM.", does: "Holds the Streaming Multiprocessors, their cores, and small fast on-chip memory.", inf: "Every FLOP of inference happens here. But the chip holds only a tiny amount of data at once." },
  hbm: { name: "HBM (High Bandwidth Memory)", what: "Stacks of memory chips built to move lots of data quickly.", where: "On the same package as the GPU chip, right beside it, connected by very short, wide wiring.", does: "Holds large amounts of data the GPU works on.", inf: "Holds the <b>model weights</b>, the <b>KV cache</b>, and <b>activations</b>. The biggest and slowest (still very fast) memory on the GPU." },
  sm: { name: "SM (Streaming Multiprocessor)", what: "A major execution unit of the GPU. A GPU has many of them.", where: "Inside the GPU chip, repeated side by side.", does: "Receives work, creates and schedules threads, and runs them on its cores using its local fast memory.", inf: "When a kernel (for example a matrix multiply for one layer) is launched, its threads are spread over the SMs, which run them in parallel." },
  cuda: { name: "CUDA cores", what: "The many small parallel processing cores in the GPU.", where: "Inside each SM.", does: "Run general-purpose arithmetic on many numbers at the same time.", inf: "Run the supporting operations: normalization (RMSNorm/LayerNorm), activation functions, softmax, residual additions, rotary position embeddings, sampling." },
  tensor: { name: "Tensor Cores", what: "Specialized circuits built for fast matrix multiplication, especially in low precision (FP16, BF16, FP8).", where: "Inside the GPU chip, alongside the general cores (shown here inside each SM).", does: "Perform high-throughput matrix operations: lots of multiply-and-add work.", inf: "Accelerate the big multiplications: X×W<sub>q</sub>, X×W<sub>k</sub>, X×W<sub>v</sub>, X×W<sub>o</sub>, and the MLP projections. These make up most of the FLOPs." },
  reg: { name: "Registers", what: "The tiniest, fastest storage: a few values held right inside the processing circuits.", where: "Inside the cores.", does: "Hold the exact numbers being worked on this instant, and the thread's own bookkeeping.", inf: "Hold the handful of values in the current multiply-add, such as one element of X, one element of W, and the running sum." },
  sram: { name: "SRAM / shared memory", what: "Small, very fast memory on the chip, shared by the threads working together in an SM.", where: "On the GPU chip, next to the cores.", does: "Stages blocks of data so many threads can reuse them without going back to HBM.", inf: "Fast kernels (for example tiled matrix multiply or FlashAttention) load chunks of weights or activations here, crunch them, then move on." },
  l2: { name: "L2 cache", what: "In this course's model: an intermediate memory level, larger and slower than on-chip SRAM.", where: "Between the compute units and HBM.", does: "Keeps recently or soon-needed data closer to compute than HBM.", inf: "Buffers data travelling between HBM and the cores. Real GPU designs differ here; treat it as the “middle layer” of the hierarchy." },
  nvlink: { name: "NVLink", what: "A high-speed link that connects GPUs directly to each other.", where: "On the edge of the GPU module, wired to other GPUs (or to NVSwitch chips).", does: "Moves data between GPUs much faster than PCIe.", inf: "Needed when one model is split across several GPUs, because the GPUs must exchange results at every layer." },
};
function partInfo(k) {
  const p = GPU_PARTS[k]; if (!p) return "";
  return `<h4 style="font-size:1.05rem">${p.name}</h4><div class="qa4">
    <div class="card"><span class="mini-label">What is it?</span><p>${p.what}</p></div>
    <div class="card"><span class="mini-label">Where is it?</span><p>${p.where}</p></div>
    <div class="card"><span class="mini-label">What does it do?</span><p>${p.does}</p></div>
    <div class="card"><span class="mini-label">Role in LLM inference</span><p>${p.inf}</p></div></div>`;
}
function wireDiagram(root, scope, onPick) {
  scope.addEventListener("click", e => {
    const el = e.target.closest("[data-part]"); if (!el || !scope.contains(el)) return;
    e.stopPropagation();
    const k = el.dataset.part;
    $$("[data-part]", scope).forEach(x => x.classList.toggle("sel", x.dataset.part === k));
    onPick(k);
  });
}

/* ---------- Topic 5 ---------- */
topic({
  num: 5, title: "Where do model weights live?",
  question: "Where are my model weights, physically?",
  render: () => `
    ${say(
      "A GPU is not just a chip. It is a chip <b>plus its own memory</b>, packed tightly together.",
      "Before any token is generated, the model's weights are copied from disk, through the CPU, into the <b class='c-memory'>GPU's memory (HBM)</b>. They stay there the whole time, because the chip needs them for every single token."
    )}
    ${see("What is inside a GPU? Click any part.", `
      <div id="t5-diag">${gpuDiagram()}</div>
      <div class="gpu-info" id="t5-info"><p class="c-muted">Click a component above: the CPU, the PCIe link, an HBM chip, an SM, the Tensor Cores, the registers, the SRAM, the L2 cache, or the NVLink connector on the right edge.</p></div>
      ${note("This is a teaching diagram, not a real floor plan. Real GPUs have many more cores and SMs, and the exact memory layout differs between designs.")}`)}
    ${see("How do the weights get onto the GPU?", `
      <div id="t5-load">${flow([{ t: "Model file on disk" }, { t: "CPU RAM" }, { t: "PCIe copy" }, { t: "GPU HBM", c: "memory" }], { id: "t5-flow" })}</div>
      <div class="btn-row"><button type="button" class="btn primary" id="t5-go">Load the model</button>
        <span class="c-muted" id="t5-msg" style="font-size:.88rem">This happens once, when the server starts.</span></div>
      <div>
        <div class="mini-label" style="margin-bottom:4px">What the HBM holds while serving</div>
        <div class="stack" id="t5-hbm"><span class="s-free" style="width:100%">empty</span></div>
      </div>`, "Watch it")}
    ${see("Does my model fit on one GPU?", `
      <div class="btn-row">${seg("t5-model", [["8", "8B"], ["13", "13B"], ["70", "70B"], ["405", "405B"]], "70")}
        <span class="c-muted" style="font-size:.85rem">parameters, in FP16 (2 bytes each)</span></div>
      <div class="stack" id="t5-fit"></div>
      <div id="t5-fitmsg" style="font-size:.95rem"></div>`, "Try it")}
    ${ex(`<div class="calc">70B model in FP16<br>70,000,000,000 parameters × 2 bytes = <b>140 GB</b> of weights<br>
      One 80 GB GPU → <span class="c-bad">does not fit</span> (and we still need room for the KV cache)</div>`)}
    ${tech(`<ul>
      <li><b>CPU RAM</b> (system memory) is large but connected to the GPU over PCIe, which is slow compared with the GPU's own memory.</li>
      <li><b>HBM</b> (High Bandwidth Memory) is stacked memory placed on the GPU package, next to the chip, with very wide, short connections. Capacity is tens to hundreds of GB.</li>
      <li>During serving, HBM holds: <b class="c-memory">weights</b> (fixed size), <b class="c-kv">KV cache</b> (grows with tokens and users), <b class="c-compute">activations / intermediate tensors</b> (temporary results inside each layer), plus framework workspace.</li>
      <li>Actual usage is a bit higher than parameters × bytes, because of runtime buffers and memory kept in reserve.</li>
    </ul>`)}
    ${fx(["Weight memory ≈ number of parameters × bytes per parameter"])}
    ${inf(`<p>Every forward pass reads the weights from HBM. They never go back to the CPU while serving. So <b>the size of HBM</b> decides whether a model fits, and <b>the speed of HBM</b> (coming in topic 9) decides how quickly those weights can be read.</p>`)}
    ${check({
      q: "Where do a model's weights live while it is generating tokens?",
      opts: ["On disk, read for every token", "In CPU RAM, copied over PCIe for every token", "In the GPU's HBM", "Inside the registers"],
      a: 2, why: "Weights are loaded once into GPU memory (HBM) and stay there. Disk and CPU RAM are far too slow to use for every token, and registers hold only a few values.",
    })}`,
  mount(root, ctx) {
    const diag = $("#t5-diag", root);
    wireDiagram(root, diag, k => $("#t5-info", root).innerHTML = partInfo(k));
    $("#t5-go", root).onclick = () => {
      const f = $("#t5-flow", root); let i = 0;
      $$(".hbm-chip .fill", diag).forEach(x => { x.style.height = "0"; x.style.background = "var(--memory)"; });
      $("#t5-hbm", root).innerHTML = `<span class="s-free" style="width:100%">empty</span>`;
      const msgs = ["Reading the model file from storage…", "Weights land in CPU RAM…", "Copying over PCIe to the GPU…", "Weights are now in HBM. Ready to serve."];
      const t = ctx.every(800, () => {
        setFlow(f, i); $("#t5-msg", root).textContent = msgs[i];
        if (i === 3) {
          ctx.stop(t);
          $$(".hbm-chip .fill", diag).forEach(x => x.style.height = "70%");
          ctx.after(600, () => $("#t5-hbm", root).innerHTML = `<span class="s-w" style="width:55%">Model weights (fixed)</span><span class="s-kv" style="width:25%">KV cache (grows)</span><span class="s-act" style="width:8%">Act.</span><span class="s-free" style="width:12%">free</span>`);
        }
        i++;
      });
    };
    const draw = (b) => {
      const w = +b * 2, cap = DEMO.hbmGB, scale = Math.max(w, cap) * 1.05;
      $("#t5-fit", root).innerHTML = `<span class="s-w" style="width:${w / scale * 100}%">${w} GB weights</span><span class="s-free" style="flex:1"></span><div class="cap-line" style="left:${cap / scale * 100}%" title="80 GB"></div>`;
      const n = Math.ceil(w / (cap * 0.9));
      $("#t5-fitmsg", root).innerHTML = w <= cap * 0.9
        ? `<span class="c-ok">Fits</span> on one 80 GB GPU, leaving ${cap - w} GB for KV cache and activations.`
        : `<span class="c-bad">Does not fit</span> on one 80 GB GPU (red line). Weights alone need at least <b>${n} GPUs</b>, or fewer bytes per parameter (Part 4).`;
    };
    bindSeg(root, "t5-model", draw); draw("70");
  },
});

/* ---------- Topic 6 ---------- */
topic({
  num: 6, title: "What happens when a Transformer operation runs?",
  question: "What happens to one matrix multiply, Y = X·W?",
  render: () => `
    ${say(
      "Almost everything in a Transformer is some version of <b>Y = X·W</b>: token vectors <b>X</b> multiplied by a weight matrix <b>W</b>.",
      "To multiply, the chip needs the numbers <b>right next to the circuits</b>. But the weights live in HBM, further away. So data first travels toward the compute, and only then is multiplied. <b>Moving data takes time too.</b>"
    )}
    ${see("How do X and W get from memory to the circuits that multiply them?", `
      ${note("Conceptual data-flow model. Real operations don't all take this exact path: which memory levels are used depends on the operation, the kernel and the GPU design. Use it to understand the hierarchy, not as a literal route.")}
      <div class="grid2" style="grid-template-columns:minmax(200px,260px) 1fr">
        ${flow([
          { t: "HBM<br><small>weights, KV, activations</small>", c: "memory" }, { t: "L2 cache", c: "memory" },
          { t: "SRAM / shared memory", c: "memory" }, { t: "Registers", c: "kv" },
          { t: "Tensor Cores", c: "compute" }, { t: "Matrix computation", c: "compute" }, { t: "Result Y" }], { id: "t6-flow", vertical: true })}
        <div style="display:grid;gap:12px;align-content:start">
          <div class="stage-panel" id="t6-panel" style="min-height:120px"></div>
          <div id="t6-mat" class="scroll-x"></div>
          <div class="stat-row">
            <div class="stat"><span class="v c-memory" id="t6-bytes">0 bytes</span><span class="k">data moved toward compute</span></div>
            <div class="stat"><span class="v c-compute" id="t6-flops">0</span><span class="k">FLOPs done (multiplies + adds)</span></div>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn" id="t6-back">← Step</button>
        <button type="button" class="btn primary" id="t6-next">Next step →</button>
        <button type="button" class="btn" id="t6-auto">▶ Play</button>
        <button type="button" class="btn" id="t6-reset">Reset</button>
      </div>`)}
    ${ex(`<div class="calc">X = [[1, 2], [3, 4]] (2 tokens, 2 numbers each)   W = [[0.5, −1], [2, 1]]<br>
      Y[0][0] = 1×0.5 + 2×2 = 4.5 → <b>2 multiplies + 1 add = 3 FLOPs</b><br>
      4 output numbers × 3 = <b>12 FLOPs</b>. Data moved: 8 numbers × 2 bytes = <b>16 bytes</b>.</div>`)}
    ${tech(`<ul>
      <li><b>HBM</b> stores the large data: full weight matrices and the KV cache.</li>
      <li><b>Caches</b> (L2, SRAM / shared memory) keep a working subset close to the cores so it can be reused without another trip to HBM.</li>
      <li><b>Registers</b> hold the exact operands of the arithmetic happening right now.</li>
      <li><b>Tensor Cores</b> run the multiply-accumulate loops of matrix multiplication at very high throughput, many in parallel.</li>
      <li>Fast kernels are written to <b>reduce data movement</b>: they split matrices into blocks that fit in fast memory (tiling), and fuse several operations so intermediate results never go back to HBM.</li>
    </ul>`)}
    ${inf(`<p>Scale the toy up: in a 70B-class model one projection matrix is 8,192 × 8,192 ≈ 67 million numbers (about <b class="c-memory">134 MB</b> in FP16). For a single token that projection needs about <b class="c-compute">134 million FLOPs</b>. A model has several such matrices in each of its ~80 layers, and they all have to be read for every generated token.</p>`)}
    ${key("Computation requires data, and <b>moving that data has a cost</b>. A GPU can only compute as fast as the numbers arrive.")}
    ${check({
      q: "In this model, where do the full weight matrices sit before an operation needs them?",
      opts: ["Registers", "SRAM / shared memory", "HBM", "Tensor Cores"],
      a: 2, why: "Full weight matrices are far too big for on-chip memory. They live in HBM, and only the part needed right now is brought closer to the cores.",
    })}`,
  mount(root, ctx) {
    const X = [[1, 2], [3, 4]], W = [[0.5, -1], [2, 1]];
    const Y = X.map(r => W[0].map((_, j) => r[0] * W[0][j] + r[1] * W[1][j]));
    const steps = [
      { h: "<b>HBM</b> holds the full weight matrix <b>W</b> and the token vectors <b>X</b>. It's large, but it is the furthest level from the compute.", bytes: 0 },
      { h: "<b>L2 cache</b>: the part of X and W needed soon is staged closer to the chip.", bytes: 16 },
      { h: "<b>SRAM / shared memory</b>: blocks of X and W are loaded into fast on-chip memory, so many threads can use them.", bytes: 16 },
      { h: "<b>Registers</b>: the exact numbers for this multiply (for example x=1 and w=0.5) are held right inside the circuit.", bytes: 16 },
      { h: "<b>Tensor Cores</b>: specialized circuits start many multiply-add operations in parallel.", bytes: 16 },
      { h: "<b>Matrix computation</b>: each output number = row of X · column of W. Watch the FLOP counter.", bytes: 16, compute: true },
      { h: "<b>Result Y</b> is ready. It becomes the input to the next operation (and K and V get written into the KV cache).", bytes: 16, done: true },
    ];
    let cur = 0, auto = null, cellT = null, cellsDone = 0;
    const mat = (M, cls = "", hi = -1, lbl = "") => `<div style="display:inline-grid;gap:4px;vertical-align:middle">
      <div class="mini-label" style="text-align:center">${lbl}</div>
      <div style="display:grid;grid-template-columns:repeat(2,44px);gap:3px">${M.flat().map((v, i) =>
        `<span class="tok ${i === hi ? "lit" : cls}" style="text-align:center;padding:4px 0">${v === null ? "?" : v}</span>`).join("")}</div></div>`;
    const drawMat = (showY, hiCell) => {
      const Yshow = Y.map((r, i) => r.map((v, j) => (i * 2 + j) < showY ? v : null));
      const hiRow = hiCell >= 0 ? Math.floor(hiCell / 2) : -1;
      $("#t6-mat", root).innerHTML = `<div style="display:flex;gap:10px;align-items:center;font-family:var(--f-mono);white-space:nowrap">
        ${mat(X, "prompt", -1, "X")}<span>×</span>${mat(W, "", -1, "W")}<span>=</span>${mat(Yshow, "gen", hiCell, "Y")}</div>
        ${hiCell >= 0 ? `<p class="mono" style="font-size:.85rem;margin-top:6px">Y[${hiRow}][${hiCell % 2}] = ${X[hiRow][0]}×${W[0][hiCell % 2]} + ${X[hiRow][1]}×${W[1][hiCell % 2]} = ${Y[hiRow][hiCell % 2]}</p>` : ""}`;
    };
    const show = (i) => {
      cur = clamp(i, 0, steps.length - 1);
      const s = steps[cur];
      setFlow($("#t6-flow", root), cur);
      $("#t6-panel", root).innerHTML = `<div class="mini-label">Step ${cur + 1} of ${steps.length}</div><p>${s.h}</p>`;
      $("#t6-bytes", root).textContent = `${s.bytes} bytes`;
      if (cellT) { ctx.stop(cellT); cellT = null; }
      if (s.compute) {
        cellsDone = 0; drawMat(0, 0); $("#t6-flops", root).textContent = "0";
        cellT = ctx.every(650, () => {
          cellsDone++;
          $("#t6-flops", root).textContent = cellsDone * 3;
          drawMat(cellsDone, cellsDone < 4 ? cellsDone : -1);
          if (cellsDone >= 4) { ctx.stop(cellT); cellT = null; }
        });
      } else {
        drawMat(s.done ? 4 : 0, -1);
        $("#t6-flops", root).textContent = s.done ? "12" : "0";
      }
      $("#t6-back", root).disabled = cur === 0;
    };
    const stopAuto = () => { if (auto) { ctx.stop(auto); auto = null; $("#t6-auto", root).textContent = "▶ Play"; } };
    $("#t6-next", root).onclick = () => show(cur + 1);
    $("#t6-back", root).onclick = () => show(cur - 1);
    $("#t6-reset", root).onclick = () => { stopAuto(); show(0); };
    $("#t6-auto", root).onclick = () => {
      if (auto) return stopAuto();
      if (cur >= steps.length - 1) show(0);
      $("#t6-auto", root).textContent = "❚❚ Pause";
      auto = ctx.every(2200, () => { if (cur >= steps.length - 1) stopAuto(); else show(cur + 1); });
    };
    show(0);
  },
});

/* ---------- Topic 7 ---------- */
topic({
  num: 7, title: "GPU anatomy, for inference",
  question: "What does each part of the GPU do for my model?",
  render: () => `
    ${say("A GPU gets its speed by splitting work into <b>many small identical jobs</b> and running them at the same time. A matrix multiply is perfect for this: every output number can be computed independently.")}
    ${see("Which part of the GPU does which job?", `
      <div class="btn-row" id="t7-pick">
        ${[["board", "GPU"], ["sm", "SMs"], ["cuda", "CUDA cores"], ["tensor", "Tensor Cores"], ["threads", "Threads"], ["warps", "Warps"]].map(([k, t], i) =>
          `<button type="button" class="btn ${i === 0 ? "on" : ""}" data-k="${k}">${t}</button>`).join("")}
      </div>
      <div id="t7-visual"></div>
      <div id="t7-info"></div>`, "Pick a component")}
    ${ex(`<div class="calc">One layer of a 70B-class model, one token:<br>
      X×W<sub>q</sub>, X×W<sub>k</sub>, X×W<sub>v</sub>, X×W<sub>o</sub>, MLP gate, MLP up, MLP down → <b>7 weight multiplies</b><br>
      × 80 layers = <b>560 big matrix multiplies</b> for every single token</div>`)}
    ${tech(`<ul>
      <li><b>Kernel:</b> a small GPU program (for example “multiply these two matrices”). Launching a kernel creates many <b>threads</b> that run the same code on different elements of the data.</li>
      <li><b>SM (Streaming Multiprocessor):</b> an execution unit that creates, schedules and runs those threads on its cores, using its registers and shared memory.</li>
      <li><b>Warp:</b> a group of threads that an SM schedules and runs together, all doing the same instruction on different data. In NVIDIA's classic design a warp was 32 threads; the size is a hardware detail. In CUDA code you'll see threads grouped into <i>blocks</i> instead.</li>
      <li><b>Tensor Cores</b> accelerate mixed-precision matrix multiply. Libraries such as cuBLAS and inference engines route the big projections to them.</li>
    </ul>`)}
    ${inf(`<p>When your model generates a token: the CPU launches kernels layer by layer → SMs split each kernel into threads and warps → <b class="c-compute">Tensor Cores</b> crunch the projections → <b>CUDA cores</b> handle norms, activations and softmax → results flow into the next layer. All of it needs data brought from <b class="c-memory">HBM</b>.</p>`)}
    ${check({
      q: "Which GPU component is specialized for the large matrix multiplications like X×W<sub>q</sub> and the MLP projections?",
      opts: ["Registers", "Tensor Cores", "PCIe", "CPU RAM"],
      a: 1, why: "Tensor Cores are circuits built for high-throughput matrix multiplication, which is where most of the FLOPs in a Transformer layer go.",
    })}`,
  mount(root, ctx) {
    let anim = null;
    const vis = $("#t7-visual", root), info = $("#t7-info", root);
    const stopAnim = () => { if (anim) { ctx.stop(anim); anim = null; } };
    const threadGrid = (groups) => {
      const rows = 4, cols = 16;
      return `<div class="scroll-x"><div style="display:grid;grid-template-columns:repeat(${cols},minmax(18px,1fr));gap:3px;min-width:420px" id="t7-threads">
        ${Array.from({ length: rows * cols }, (_, i) => `<span data-g="${groups ? Math.floor((i % cols) / 8) + rows * 0 + Math.floor(i / cols) * 2 : i}" style="aspect-ratio:1;border-radius:3px;background:var(--surface-3);display:grid;place-items:center;font-size:.55rem;font-family:var(--f-mono);transition:background .2s"></span>`).join("")}
      </div></div>`;
    };
    const views = {
      board: () => { vis.innerHTML = gpuDiagram(); $$("[data-part='board']", vis).forEach(x => x.classList.add("sel")); info.innerHTML = partInfo("board"); },
      sm: () => {
        vis.innerHTML = gpuDiagram(); info.innerHTML = partInfo("sm");
        const sms = $$(".sm", vis); let k = 0;
        anim = ctx.every(350, () => { sms.forEach((s, i) => s.style.boxShadow = i === k % sms.length ? "0 0 0 3px var(--accent)" : "none"); k++; });
      },
      cuda: () => {
        vis.innerHTML = gpuDiagram() + `<div class="tokens">${["RMSNorm", "SiLU / GELU", "softmax", "residual add", "rotary embedding", "sampling"].map(o => `<span class="tok">${o}</span>`).join("")}</div>`;
        info.innerHTML = partInfo("cuda");
        const cores = $$(".cores i", vis);
        anim = ctx.every(160, () => cores.forEach(c => c.classList.toggle("on", Math.random() < .45)));
      },
      tensor: () => {
        const ops = ["X × W<sub>q</sub>", "X × W<sub>k</sub>", "X × W<sub>v</sub>", "attention (Q·Kᵀ, then × V)", "X × W<sub>o</sub>", "MLP gate", "MLP up", "MLP down"];
        vis.innerHTML = gpuDiagram() + `<div class="grid2" style="grid-template-columns:1fr auto;align-items:center">
          <div class="tokens" id="t7-ops">${ops.map(o => `<span class="tok">${o}</span>`).join("")}</div>
          <div class="stat"><span class="v c-compute" id="t7-layer">layer 1 / 80</span><span class="k">one token's forward pass</span></div></div>`;
        info.innerHTML = partInfo("tensor");
        const tc = $$(".tcore", vis), opEls = $$("#t7-ops .tok", vis); let k = 0;
        anim = ctx.every(260, () => {
          const o = k % ops.length; opEls.forEach((e, i) => e.classList.toggle("lit", i === o));
          tc.forEach(t => t.classList.toggle("on", o !== 3 || Math.random() < .5));
          $("#t7-layer", vis).textContent = `layer ${Math.floor(k / ops.length) % 80 + 1} / 80`; k++;
        });
      },
      threads: () => {
        vis.innerHTML = `<p style="font-size:.9rem">Computing a 4 × 16 output matrix <b>Y = X·W</b>. Every cell is one <b>thread</b>, running the same tiny program: <code>y[i][j] = Σ x[i][k] · w[k][j]</code>. They all run at the same time.</p>` + threadGrid(false);
        info.innerHTML = `<h4 style="font-size:1.05rem">Threads</h4><div class="qa4">
          <div class="card"><span class="mini-label">What is it?</span><p>One tiny instance of a GPU program (kernel), working on one piece of the data.</p></div>
          <div class="card"><span class="mini-label">Where is it?</span><p>Created and run by the SMs, on their cores.</p></div>
          <div class="card"><span class="mini-label">What does it do?</span><p>Runs the same instructions as thousands of sibling threads, each on a different element.</p></div>
          <div class="card"><span class="mini-label">Role in LLM inference</span><p>A matrix multiply for a layer becomes a huge number of threads, one for each output element or block, so the whole layer is computed in parallel.</p></div></div>`;
        const cells = $$("#t7-threads span", vis); let on = false;
        anim = ctx.every(500, () => { on = !on; cells.forEach(c => { c.style.background = on ? "var(--compute)" : "var(--surface-3)"; }); });
      },
      warps: () => {
        vis.innerHTML = `<p style="font-size:.9rem">The SM does not schedule threads one by one. It runs them in <b>groups called warps</b> that execute the same instruction together. Here each colour is one warp of 8 threads (NVIDIA's classic design used 32).</p>` + threadGrid(true);
        info.innerHTML = `<h4 style="font-size:1.05rem">Warps</h4><div class="qa4">
          <div class="card"><span class="mini-label">What is it?</span><p>A group of threads that run together, like a row of weaving threads moving as one.</p></div>
          <div class="card"><span class="mini-label">Where is it?</span><p>Inside an SM's scheduler; it's a unit of execution, not a physical block.</p></div>
          <div class="card"><span class="mini-label">What does it do?</span><p>Lets the SM run many threads through the same instruction at once, cheaply.</p></div>
          <div class="card"><span class="mini-label">Role in LLM inference</span><p>The threads of each matrix-multiply kernel are run warp by warp across the SMs. You don't manage warps yourself; kernels and the driver do.</p></div></div>`;
        const cells = $$("#t7-threads span", vis);
        const colors = ["var(--compute)", "var(--memory)", "var(--kv)", "var(--accent)"];
        let k = 0;
        anim = ctx.every(420, () => {
          const active = k % 8;
          cells.forEach(c => { const g = +c.dataset.g; c.style.background = g === active ? colors[g % 4] : "var(--surface-3)"; });
          k++;
        });
      },
    };
    const pick = (k) => { stopAnim(); $$("#t7-pick .btn", root).forEach(b => b.classList.toggle("on", b.dataset.k === k)); views[k](); };
    $("#t7-pick", root).onclick = e => { const b = e.target.closest("button"); if (b) pick(b.dataset.k); };
    pick("board");
  },
});

/* ---------- Topic 8 ---------- */
topic({
  num: 8, title: "GPU memory hierarchy",
  question: "Why does the GPU have several kinds of memory?",
  render: () => `
    ${say(
      "Memory can be <b>big</b> or <b>fast</b>, but not both at once. Fast memory has to sit right next to the circuits, and there's very little room there.",
      "So the GPU uses <b>levels</b>: a tiny amount of extremely fast storage inside the circuits, a bit more fast memory on the chip, and a huge amount of slower memory beside it."
    )}
    ${see("How big and how fast is each level? Click a level.", `
      <div class="grid2" style="grid-template-columns:minmax(240px,1fr) minmax(260px,1.2fr);align-items:start">
        <div class="pyramid" id="t8-pyr"></div>
        <div id="t8-detail" class="stage-panel"></div>
      </div>
      <div class="scroll-x"><table class="cmp-table" id="t8-table"></table></div>
      ${note("Sizes and speeds are shown as relative orders of magnitude, not measured specs. Operations do <b>not</b> literally pass through every level in order: data moves from larger, slower memory toward smaller, faster memory near the cores when and where the kernel needs it.")}`)}
    ${see("Which levels does one decode step lean on?", `
      <div class="btn-row"><button type="button" class="btn primary" id="t8-play">▶ Walk through one decode step</button></div>
      <div class="stage-panel" id="t8-walk" style="min-height:70px"><p class="c-muted">Press play to follow a token through one layer.</p></div>`, "Watch it")}
    ${ex(`<div class="calc">70B-class model in FP16: 140 GB of weights → only HBM is big enough<br>
      One 8,192-number token vector: 16 KB → fits easily in on-chip SRAM<br>
      One multiply: two numbers → registers</div>`)}
    ${tech(`<ul>
      <li>Moving closer to the cores: capacity goes <b>down</b>, speed goes <b>up</b>, cost per byte goes <b>up</b>.</li>
      <li>HBM is “slow” only compared with on-chip memory. It is still much faster than CPU RAM reached over PCIe.</li>
      <li>Well-designed kernels keep hot data in fast memory as long as possible and avoid round trips to HBM (for example FlashAttention computes attention in blocks that fit in SRAM).</li>
    </ul>`)}
    ${inf(`<p>The data that dominates inference, the <b class="c-memory">weights</b> and the <b class="c-kv">KV cache</b>, is so large that it can only live in HBM. That makes the <b>HBM → compute</b> path the busiest road in LLM inference.</p>`)}
    ${check({
      q: "A 70B model's FP16 weights (about 140 GB) are needed for every token. Which level is large enough to hold them?",
      opts: ["Registers", "SRAM / shared memory", "L2 cache", "HBM"],
      a: 3, why: "Only HBM has tens to hundreds of GB. The faster levels are orders of magnitude smaller and only ever hold a small working piece.",
    })}`,
  mount(root, ctx) {
    const L = [
      { k: "Registers", size: "Tiny", sizeN: 1, speed: 100, color: "var(--kv)", width: 34, where: "Inside the processing circuits of each core.", stores: "The few values being computed this instant, plus thread bookkeeping.", when: "Every single multiply-add: the current weight element, input element and running sum.", sum: "Tiny + extremely fast" },
      { k: "SRAM / shared memory", size: "Small", sizeN: 2, speed: 85, color: "var(--accent)", width: 56, where: "On the GPU chip, beside the cores of an SM.", stores: "Blocks of data that a group of threads is working on together.", when: "Staging and reusing chunks of weights, activations or attention blocks inside fast kernels.", sum: "Small + very fast" },
      { k: "L2 cache", size: "Larger", sizeN: 3, speed: 55, color: "var(--memory)", width: 78, where: "Between on-chip memory and HBM (simplified level in this course).", stores: "Recently used or soon-needed data travelling between HBM and the cores.", when: "Buffering streams of weight and activation data headed to or from compute.", sum: "Larger + slower than on-chip" },
      { k: "HBM", size: "Huge", sizeN: 5, speed: 28, color: "#28409a", width: 100, where: "Beside the GPU chip, on the same package.", stores: "Model weights, KV cache, activations and other large data.", when: "Always: every forward pass reads weights from here, and every decode step reads (and appends to) the KV cache here.", sum: "Huge + much slower than on-chip" },
    ];
    const pyr = $("#t8-pyr", root);
    pyr.innerHTML = L.map((l, i) => `<div class="pyr-level" data-i="${i}" style="width:${l.width}%;background:${l.color}">${l.k}<small>${l.sum}</small></div>`).join("");
    const bar = (v, c) => `<div style="height:8px;border-radius:4px;background:var(--surface-3);width:120px"><div style="height:100%;width:${v}%;background:${c};border-radius:4px"></div></div>`;
    $("#t8-table", root).innerHTML = `<tr><th>Level</th><th>Relative size</th><th>Relative speed</th><th>What's stored</th></tr>` +
      L.map(l => `<tr><td><b>${l.k}</b></td><td>${bar(l.sizeN * 20, "var(--memory)")}<span class="c-muted" style="font-size:.78rem">${l.size}</span></td><td>${bar(l.speed, "var(--compute)")}</td><td>${l.stores}</td></tr>`).join("");
    const pick = (i) => {
      $$(".pyr-level", pyr).forEach((p, j) => p.classList.toggle("sel", i === j));
      const l = L[i];
      $("#t8-detail", root).innerHTML = `<h4 style="font-size:1.1rem">${l.k}</h4>
        <div class="stat-row"><div class="stat"><span class="v">${l.size}</span><span class="k">relative size</span></div><div class="stat"><span class="v">${["Extremely fast", "Very fast", "Fast", "Slower (still fast)"][i]}</span><span class="k">relative speed</span></div></div>
        <p><b>Where:</b> ${l.where}</p><p><b>Stores:</b> ${l.stores}</p><p><b>Used during inference:</b> ${l.when}</p>`;
    };
    pyr.onclick = e => { const p = e.target.closest(".pyr-level"); if (p) pick(+p.dataset.i); };
    pick(3);
    const walk = [
      [3, "The layer's weight matrices and this request's KV cache are in <b>HBM</b>."],
      [2, "The needed data streams toward the chip, buffered in the <b>L2 cache</b>."],
      [1, "Blocks of weights and the token's vector are staged in <b>SRAM / shared memory</b> for the threads."],
      [0, "Individual numbers sit in <b>registers</b> while Tensor Cores multiply and add."],
      [3, "New K and V for this token are written back into the KV cache in <b>HBM</b>. Then the next layer starts, and the trip repeats ×80 layers."],
    ];
    let t = null;
    $("#t8-play", root).onclick = () => {
      if (t) ctx.stop(t);
      let k = 0;
      const stepW = () => { if (k >= walk.length) { ctx.stop(t); t = null; return; } pick(walk[k][0]); $("#t8-walk", root).innerHTML = `<div class="mini-label">Step ${k + 1} of ${walk.length}</div><p>${walk[k][1]}</p>`; k++; };
      stepW(); t = ctx.every(2200, stepW);
    };
  },
});

    ${say(
