<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Inference &amp; GPUs</title>
<meta name="description" content="LLM inference and GPU concepts explained through examples and interactive diagrams.">
<style>/* ============================================================
   LLM Inference & GPU Architecture — session styles
   Colour carries meaning everywhere:
     --compute (orange)  = computation, Tensor Cores, FLOPs
     --memory  (blue)    = memory, HBM, data movement, bandwidth
     --kv      (purple)  = KV cache
     --accent  (teal)    = navigation
   ============================================================ */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f6;
  --surface-3: #e1e6ed;
  --ink: #141a24;
  --muted: #5d6675;
  --line: #d9dee6;
  --accent: #27406f;
  --accent-soft: #e8edf6;
  --compute: #df7414;
  --compute-soft: #fdeedf;
  --memory: #2f6bdc;
  --memory-soft: #e4edfc;
  --kv: #8753e6;
  --kv-soft: #f0e9fd;
  --ok: #1f8a4c;
  --ok-soft: #e3f4ea;
  --bad: #cf3a3a;
  --bad-soft: #fbe5e5;
  --warn: #9a6b00;
  --warn-soft: #fbf3dd;
  --shadow: 0 1px 2px rgba(20, 26, 36, .05), 0 4px 14px rgba(20, 26, 36, .05);
  --radius: 10px;
  --radius-sm: 6px;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.c-compute { color: var(--compute); font-weight: 600; }
.c-memory { color: var(--memory); font-weight: 600; }
.c-kv { color: var(--kv); font-weight: 600; }
.c-ok { color: var(--ok); font-weight: 600; }
.c-bad { color: var(--bad); font-weight: 600; }
.c-muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------------- App shell ---------------- */
.app { display: grid; grid-template-rows: auto 1fr; min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px 0;
}
.topbar-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
.brand .sub { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.overall { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .82rem; color: var(--muted); }
.overall-bar { width: 160px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.overall-bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font-size: .8rem; }
.icon-btn:hover { border-color: var(--accent); }

.parts { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: thin; }
.part-tab {
  flex: 1 0 128px; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 6px 10px 9px; border-radius: 8px 8px 0 0; color: var(--muted); position: relative;
}
.part-tab:hover { background: var(--surface-2); color: var(--ink); }
.part-tab .pn { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
.part-tab .pt { display: block; font-size: .82rem; font-weight: 600; line-height: 1.25; margin-top: 1px; }
.part-tab .pbar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.part-tab .pbar > i { display: block; height: 100%; background: var(--accent); }
.part-tab.active { background: var(--surface); color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }
.part-tab.done .pn::after { content: " ✓"; color: var(--ok); }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; }
.sidebar {
  border-right: 1px solid var(--line); padding: 18px 12px; background: var(--surface);
  position: sticky; top: 104px; align-self: start; height: calc(100vh - 104px); overflow-y: auto;
}
.sidebar .part-head { padding: 0 8px 12px; }
.sidebar .part-head .pn { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.sidebar .part-head h2 { font-size: 1.15rem; margin-top: 2px; }
.sidebar .part-head p { font-size: .82rem; color: var(--muted); margin-top: 6px; }
.topic-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.topic-link {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start;
  text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: .86rem; line-height: 1.3; color: var(--ink);
}
.topic-link:hover { background: var(--surface-2); }
.topic-link .tn {
  font-family: var(--f-mono); font-size: .7rem; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--muted); background: var(--surface);
}
.topic-link.visited .tn { border-color: var(--accent); color: var(--accent); }
.topic-link.done .tn { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.topic-link.active { background: var(--accent-soft); font-weight: 600; }
.sidebar .story { margin: 18px 8px 0; padding-top: 14px; border-top: 1px dashed var(--line); font-size: .78rem; color: var(--muted); }
.sidebar .story .story-h { color: var(--ink); display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-family: var(--f-mono); margin-bottom: 4px; }

.main { min-width: 0; padding: 26px 20px 110px; }
.stage { max-width: 1140px; margin: 0 auto; display: grid; gap: 18px; }
.topic-head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.topic-head h2 { font-size: clamp(1.7rem, 3vw, 2.35rem); font-weight: 700; line-height: 1.12; }
.question-chip {
  justify-self: start; display: inline-flex; gap: 8px; align-items: baseline; margin-top: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: .9rem;
}
.question-chip b { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

.footer-nav {
  position: fixed; left: 270px; right: 0; bottom: 0; z-index: 15;
  padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
}
.footer-inner { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.footer-inner .where { flex: 1; text-align: center; font-size: .82rem; color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 5px; margin-top: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
.dots i.done { background: var(--accent); }
.dots i.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------------- Buttons & controls ---------------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; font-size: .9rem;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: .8rem; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: .85rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }

.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; }
.ctl { display: grid; gap: 2px; }
.ctl label { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ctl label output { font-family: var(--f-mono); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 5px 8px; }

/* ---------------- Beats (teaching progression) ---------------- */
.beat { display: grid; gap: 10px; min-width: 0; }
.beat-body { min-width: 0; display: grid; gap: 10px; }
.lede { font-size: 1.12rem; line-height: 1.6; max-width: 72ch; }
.b-intuit { gap: 8px; }
.beat p { max-width: 74ch; }
.beat ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 74ch; }
.inf { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; display: grid; gap: 6px; }
.ex-h, .quiz-h { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.viz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0; }
.viz-q { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.viz-q::before { content: "?"; font-family: var(--f-mono); font-size: .75rem; width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--bg); transform: translateY(-2px); }
.scroll-x { overflow-x: auto; }

.example { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.calc { font-family: var(--f-mono); font-size: .92rem; line-height: 1.8; }
.calc .eq { color: var(--muted); }
details.tech { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.tech > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: .9rem; list-style: none; display: flex; gap: 8px; align-items: center; }
details.tech > summary::before { content: "+"; font-family: var(--f-mono); width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; background: var(--surface-2); }
details.tech[open] > summary::before { content: "−"; }
details.tech > div { padding: 0 14px 14px; display: grid; gap: 8px; }
.formula {
  font-family: var(--f-mono); font-size: 1.05rem; background: var(--surface); border: 1px dashed var(--line);
  border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 4px; overflow-x: auto;
}
.formula .fnote { font-family: var(--f-body); font-size: .82rem; color: var(--muted); }
.callout { border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: .92rem; align-items: start; }
.callout .tag { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; white-space: nowrap; margin-top: 2px; }
.callout.note { background: var(--warn-soft); }
.callout.note .tag { background: var(--warn); color: var(--surface); }
.callout.key { background: var(--accent-soft); font-size: 1.02rem; font-weight: 500; }
.callout.key .tag { background: var(--accent); color: var(--surface); }
.callout.big { background: var(--memory-soft); font-size: 1.1rem; font-weight: 600; font-family: var(--f-display); }
.callout.big .tag { background: var(--memory); color: #fff; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.card h4 { font-size: .98rem; }
.card p, .card li { font-size: .88rem; }
.card.flat { background: var(--surface-2); border-color: transparent; }
.mini-label { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.big-num { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--f-mono); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .75rem; color: var(--muted); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; font-family: var(--f-mono); }
.pill.compute { background: var(--compute-soft); color: var(--compute); }
.pill.memory { background: var(--memory-soft); color: var(--memory); }
.pill.mixed { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.illus { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 6px; justify-self: start; }

.cmp-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.cmp-table th, .cmp-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp-table th { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }

/* ---------------- Tokens ---------------- */
.tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tok {
  font-family: var(--f-mono); font-size: .88rem; padding: 3px 9px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--line); white-space: pre; transition: all .25s;
}
.tok.prompt { background: var(--accent-soft); border-color: var(--accent); }
.tok.gen { background: var(--compute-soft); border-color: var(--compute); }
.tok.new { animation: pop .45s ease-out; }
.tok.lit { background: var(--compute); color: #fff; border-color: var(--compute); }
.tok.ghost { opacity: .35; border-style: dashed; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

/* ---------------- Flow chains ---------------- */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow.vertical { flex-direction: column; align-items: stretch; }
.flow .node {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm);
  padding: 7px 12px; font-size: .88rem; font-weight: 500; transition: all .3s; text-align: center;
}
.flow .node.compute { border-color: var(--compute); }
.flow .node.memory { border-color: var(--memory); }
.flow .node.kv { border-color: var(--kv); }
.flow .node.active { background: var(--ink); color: var(--bg); border-color: var(--ink); transform: scale(1.04); }
.flow .node.active.compute { background: var(--compute); border-color: var(--compute); color: #fff; }
.flow .node.active.memory { background: var(--memory); border-color: var(--memory); color: #fff; }
.flow .node.active.kv { background: var(--kv); border-color: var(--kv); color: #fff; }
.flow .node.past { opacity: .75; }
.flow .arr { color: var(--muted); font-family: var(--f-mono); font-size: .9rem; }
.flow.vertical .arr { text-align: center; line-height: 1; }
.flow .arr.active { color: var(--ink); animation: nudge .6s infinite; }
@keyframes nudge { 50% { transform: translateX(3px); } }
.flow.vertical .arr.active { animation: nudgeY .6s infinite; }
@keyframes nudgeY { 50% { transform: translateY(3px); } }

/* ---------------- Meters & bars ---------------- */
.meter { display: grid; gap: 3px; }
.meter .mh { display: flex; justify-content: space-between; font-size: .8rem; gap: 8px; }
.meter .mh span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.meter .track { height: 12px; border-radius: 6px; background: var(--surface-3); overflow: hidden; position: relative; }
.meter .track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; transition: width .35s; }
.meter.compute .track > i { background: var(--compute); }
.meter.memory .track > i { background: var(--memory); }
.meter.kv .track > i { background: var(--kv); }
.meter.accent .track > i { background: var(--accent); }
.meter.ok .track > i { background: var(--ok); }
.meter.bad .track > i { background: var(--bad); }

.stack { display: flex; height: 34px; border-radius: 6px; overflow: hidden; background: var(--surface-3); position: relative; }
.stack > span { display: grid; place-items: center; font-size: .72rem; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; transition: width .35s; }
.stack .s-w { background: var(--memory); }
.stack .s-kv { background: var(--kv); }
.stack .s-act { background: var(--compute); }
.stack .s-free { background: transparent; color: var(--muted); }
.stack .cap-line { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bad); }

/* ---------------- Quiz ---------------- */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.quiz-q { font-weight: 600; font-size: 1.02rem; }
.quiz-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.quiz-opt {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm);
  padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; font-size: .92rem;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--kv); }
.quiz-opt:disabled { cursor: default; }
.quiz-letter { font-family: var(--f-mono); font-size: .75rem; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
.quiz-opt.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz-opt.right .quiz-letter { background: var(--ok); color: #fff; }
.quiz-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz-opt.wrong .quiz-letter { background: var(--bad); color: #fff; }
.quiz-why { font-size: .92rem; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); display: grid; gap: 6px; }
.quiz-why b.ok { color: var(--ok); }
.quiz-why b.no { color: var(--bad); }

/* ---------------- GPU diagram ---------------- */
.gpu-wrap { display: grid; grid-template-columns: minmax(150px, 190px) 50px minmax(0, 1fr); align-items: center; gap: 0; min-width: 640px; }
.host { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; }
.host .hl { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.part-box { border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 6px 8px; font-size: .78rem; font-weight: 600; cursor: pointer; background: var(--surface); transition: all .2s; text-align: center; }
.part-box:hover { border-color: var(--accent); }
.part-box.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.bus { height: 10px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); position: relative; cursor: pointer; }
.bus span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: .62rem; font-family: var(--f-mono); color: var(--muted); }
.bus.sel { background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 10px); }
.board { border: 2px solid var(--ink); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: var(--surface-2); position: relative; }
.board > .bl { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hbm-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.hbm-chip { background: var(--memory-soft); border: 1.5px solid var(--memory); border-radius: 5px; font-size: .7rem; font-weight: 600; color: var(--memory); padding: 6px 4px; text-align: center; cursor: pointer; position: relative; overflow: hidden; }

.hbm-chip span { position: relative; }
.die { border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); padding: 8px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }

.sm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.sm .sml { font-size: .6rem; font-family: var(--f-mono); color: var(--accent); font-weight: 600; }
.sm .cores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; cursor: pointer; }
.sm .cores i { aspect-ratio: 1; border-radius: 2px; background: var(--surface-3); transition: background .2s; }
.sm .cores i.on { background: var(--ink); }
.sm .tcore { font-size: .58rem; background: var(--compute-soft); color: var(--compute); border: 1px solid var(--compute); border-radius: 3px; text-align: center; font-weight: 700; cursor: pointer; transition: all .2s; }
.sm .tcore.on { background: var(--compute); color: #fff; }
.sm .mem-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.sm .reg, .sm .sram { font-size: .52rem; text-align: center; border-radius: 3px; padding: 1px 0; cursor: pointer; font-weight: 600; }
.sm .reg { background: var(--kv-soft); color: var(--kv); border: 1px solid var(--kv); }
.sm .sram { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.l2 { writing-mode: vertical-rl; transform: rotate(180deg); background: var(--memory-soft); border: 1.5px dashed var(--memory); color: var(--memory); border-radius: 5px; font-size: .64rem; font-weight: 700; padding: 6px 3px; text-align: center; cursor: pointer; }
.nvl { position: absolute; right: -10px; top: 40%; width: 18px; height: 60px; border-radius: 4px; background: var(--accent); cursor: pointer; }
.gpu-info { display: grid; gap: 8px; }
.qa4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.qa4 .card { background: var(--surface-2); border: 0; }

/* ---------------- Misc visual pieces ---------------- */
.loop-box { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; background: var(--surface); }
.loop-box h4 { font-size: .95rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.model-box { border: 2px solid var(--ink); border-radius: 10px; padding: 10px 14px; text-align: center; font-weight: 700; font-family: var(--f-display); position: relative; transition: all .2s; }
.model-box.busy { background: var(--compute); color: #fff; border-color: var(--compute); }
.pipeline-stages { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pipeline-stages .stage-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .85rem; }
.pipeline-stages .stage-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pipeline-stages .stage-btn.seen { border-color: var(--accent); }
.stage-panel { background: var(--surface-2); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; min-height: 170px; }
.vec { display: inline-grid; grid-auto-flow: column; gap: 2px; font-family: var(--f-mono); font-size: .72rem; }
.vec span { padding: 2px 4px; border-radius: 3px; background: var(--memory-soft); color: var(--memory); }
.bars-h { display: grid; gap: 4px; }
.bars-h .row { display: grid; grid-template-columns: 90px 1fr 52px; gap: 8px; align-items: center; font-size: .85rem; }
.bars-h .row .b { height: 16px; border-radius: 3px; background: var(--accent); transition: width .3s; }
.bars-h .row .v { font-family: var(--f-mono); font-size: .78rem; text-align: right; }
.bars-h .row.pick .b { background: var(--compute); }
.layers { display: flex; gap: 4px; flex-wrap: wrap; }
.layers i { width: 26px; height: 40px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--surface); transition: background .2s; }
.layers i.on { background: var(--compute); border-color: var(--compute); }

.kv-grid { display: grid; gap: 3px; font-family: var(--f-mono); font-size: .66rem; }
.kv-grid .r { display: grid; grid-template-columns: 66px repeat(var(--n), 1fr); gap: 3px; align-items: center; }
.kv-grid .c { height: 22px; border-radius: 3px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.kv-grid .c.comp { background: var(--compute); color: #fff; }
.kv-grid .c.cache { background: var(--kv); color: #fff; }
.kv-grid .c.empty { background: transparent; }

.pyramid { display: grid; gap: 4px; justify-items: center; }
.pyr-level { cursor: pointer; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .85rem; height: 50px; transition: transform .2s, filter .2s; clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%); text-align: center; line-height: 1.15; padding: 0 20px; }
.pyr-level small { display: block; font-weight: 500; font-size: .7rem; opacity: .9; }
.pyr-level:hover { filter: brightness(1.1); }
.pyr-level.sel { transform: scale(1.04); filter: drop-shadow(0 0 0 var(--ink)) brightness(1.1); }

.gantt { display: grid; gap: 3px; font-family: var(--f-mono); font-size: .66rem; }
.gantt .gr { display: grid; grid-template-columns: 74px repeat(var(--cols), minmax(14px, 1fr)); gap: 2px; align-items: center; }
.gantt .gc { height: 22px; border-radius: 3px; display: grid; place-items: center; color: #fff; font-weight: 600; transition: opacity .2s; }
.gantt .gc.idle { background: repeating-linear-gradient(45deg, var(--surface-3) 0 3px, transparent 3px 6px); color: var(--muted); }
.gantt .gc.hide { opacity: 0; }
.gantt .gl { color: var(--muted); }

.blocks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.blocks i { aspect-ratio: 1.6; border-radius: 3px; background: var(--surface-3); display: grid; place-items: center; font-style: normal; font-family: var(--f-mono); font-size: .62rem; color: #fff; font-weight: 700; transition: background .3s; }
.blocks i.reserved { background: repeating-linear-gradient(45deg, var(--surface-3) 0 3px, var(--bad-soft) 3px 6px); color: var(--bad); }

.arch-seq { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.gen-card { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; background: var(--surface); display: grid; gap: 4px; text-align: left; }
.gen-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.gen-card .gname { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; }
.lvl { display: inline-flex; gap: 2px; }
.lvl i { width: 9px; height: 9px; border-radius: 2px; background: var(--surface-3); }
.lvl.c i.on { background: var(--compute); } .lvl.m i.on { background: var(--memory); } .lvl.a i.on { background: var(--accent); } .lvl.k i.on { background: var(--kv); }

svg text { fill: var(--ink); font-family: var(--f-body); }
svg .muted { fill: var(--muted); }
.svg-block { width: 100%; height: auto; display: block; }

.chain-big { display: grid; gap: 4px; }
.chain-big .cstep { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line); transition: all .3s; }
.chain-big .cstep .ci { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.chain-big .cstep.lit { border-color: var(--accent); background: var(--accent-soft); }
.chain-big .cdown { text-align: center; color: var(--muted); font-size: .8rem; line-height: 1; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .sidebar .topic-list { grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; }
  .sidebar .story { display: none; }
  .footer-nav { left: 0; }
  .beat { grid-template-columns: 1fr; gap: 6px; }
  .beat-label { border-top: 0; padding-top: 0; }
  .brand .sub { display: none; }
  .overall-bar { width: 80px; }
  .main { padding-left: 16px; padding-right: 16px; }
  .topbar { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------------- Player controls ---------------- */
.player { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.player .btn { padding: 5px 11px; }
.player input[type="range"] { flex: 1; min-width: 140px; }
.player .pl-count { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); min-width: 64px; text-align: right; }
.caption { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 1rem; min-height: 50px; display: grid; gap: 2px; }
.caption .cap-step { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

/* ---------------- Inference player (topic 1) ---------------- */
.inf-top { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; align-items: start; }
.textbox { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; min-height: 52px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; background: var(--surface); }
.tok.proc { outline: 2px solid var(--compute); outline-offset: 1px; }
.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stage-view { border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; min-height: 230px; display: grid; gap: 12px; align-content: start; background: var(--surface); }
.stage-view h4 { font-size: 1.05rem; }
.embed { display: grid; gap: 4px; }
.embed .erow { display: grid; grid-template-columns: 90px repeat(8, 26px); gap: 3px; align-items: center; font-family: var(--f-mono); font-size: .8rem; }
.embed .erow i { height: 22px; border-radius: 3px; }
.layer-stack { display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; }
.layer-stack .lyr { width: 58px; border: 1.5px solid var(--line); border-radius: 6px; padding: 4px; display: grid; gap: 3px; font-size: .6rem; text-align: center; background: var(--surface); }
.layer-stack .lyr b { font-size: .66rem; }
.layer-stack .lyr span { border-radius: 3px; padding: 1px 0; }
.layer-stack .lyr .a { background: var(--kv-soft); color: var(--kv); }
.layer-stack .lyr .m { background: var(--compute-soft); color: var(--compute); }
.layer-run .lyr { animation: lrun 1.8s infinite; }
@keyframes lrun { 0%, 100% { background: var(--surface); border-color: var(--line); } 12% { background: var(--compute-soft); border-color: var(--compute); } 30% { background: var(--surface); border-color: var(--line); } }
.mem-side { display: grid; gap: 6px; }
.mem-chip { border-radius: 6px; padding: 6px 10px; font-size: .82rem; display: flex; justify-content: space-between; gap: 8px; }
.mem-chip.w { background: var(--memory-soft); color: var(--memory); }
.mem-chip.kvc { background: var(--kv-soft); color: var(--kv); }

/* ---------------- KV cache scene (topic 4) ---------------- */
.kvs { display: grid; grid-template-columns: 150px 180px 16px 92px 16px 124px 22px 300px 22px minmax(210px, 1fr); grid-template-rows: repeat(3, auto); gap: 14px 4px; align-items: center; min-width: 1180px; padding: 4px 4px 8px; }
.kvs .sym { text-align: center; font-weight: 700; color: var(--muted); font-size: 1.1rem; }
.kvs .col-title { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 3px; }
.kvs .part { transition: opacity .35s, box-shadow .35s; border-radius: 8px; padding: 4px; }
.kvs .dim { opacity: .28; }
.kvs .hl { box-shadow: 0 0 0 2.5px var(--accent); background: var(--surface); }
.vrow { display: flex; gap: 2px; align-items: center; }
.vrow .lbl { font-family: var(--f-mono); font-size: .7rem; width: 60px; flex: none; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.cell { width: 36px; height: 24px; display: grid; place-items: center; font-family: var(--f-mono); font-size: .68rem; border: 1px solid; border-radius: 3px; }
.cell.x { background: #eef1f5; border-color: #c9d1dc; color: var(--ink); }
.cell.q { background: #e2ebfd; border-color: #97b5ef; color: #1f4fa8; }
.cell.k { background: #fdf0de; border-color: #eec08a; color: #99530b; }
.cell.v { background: #efe7fd; border-color: #c6aaf3; color: #6433bf; }
.cell.o { background: #e7f0ea; border-color: #a9cdb6; color: #1f6b3f; }
.mat { display: grid; grid-template-columns: repeat(3, 26px); gap: 2px; }
.mat i { height: 20px; border-radius: 2px; border: 1px solid; font-style: normal; font-family: var(--f-mono); font-size: .58rem; display: grid; place-items: center; }
.mat.q i { background: #e2ebfd; border-color: #97b5ef; } .mat.k i { background: #fdf0de; border-color: #eec08a; } .mat.v i { background: #efe7fd; border-color: #c6aaf3; }
.cache-box { border: 1.5px dashed var(--line); border-radius: 8px; padding: 6px; display: grid; gap: 2px; }
.cache-box .vrow.new { animation: rowin .7s ease-out; background: var(--accent-soft); border-radius: 4px; }
.cache-box .vrow.recomp .cell { outline: 2px solid var(--compute); }
@keyframes rowin { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
.score { height: 10px; border-radius: 3px; background: var(--memory); margin-left: 6px; transition: width .4s; }
.wt { font-family: var(--f-mono); font-size: .68rem; margin-left: 6px; min-width: 34px; }
.tok-list { display: grid; gap: 4px; }
.tok-list .tk { font-family: var(--f-mono); font-size: .78rem; padding: 3px 6px; white-space: nowrap; align-items: center; border-radius: 4px; border: 1px solid var(--line); display: flex; justify-content: space-between; gap: 4px; }
.tok-list .tk.cur { border-color: var(--compute); background: var(--compute-soft); font-weight: 600; }
.tok-list .tk.cached { background: var(--kv-soft); border-color: #c6aaf3; }
.tok-list .tk.future { opacity: .35; border-style: dashed; }
.combine { border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; align-content: start; min-height: 100%; }

.gpu-build .bh { visibility: hidden; }
.gpu-build .bv { visibility: visible; }
#t5-diag .sel, .gpu-build .sel { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Quiet layout: content, section navigation, and the diagrams' own controls. */
:root {
 --f-display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
 --f-body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
 --bg: #f7f8fa;
}

.layout { grid-template-columns: 235px minmax(0,1fr); }

.stage { width: 100%; max-width: 1100px; min-width: 0; gap: 24px; }

.topic-head { padding: 0; margin: 0; }
.topic-head h2 { font-size: clamp(1.8rem, 2.7vw, 2.55rem); line-height: 1.18; }
.topic-question { color: var(--muted); font-size: 1.02rem; margin-top: 12px; }
.lede { max-width: 82ch; font-size: 1.06rem; line-height: 1.75; }
.b-intuit { display: grid; gap: 14px; }
.example .calc { font-family: var(--f-body); font-size: 1rem; line-height: 1.7; }

.viz { box-shadow: 0 1px 4px #19283a09; }
.session-nav { max-width: 1100px; margin: 36px auto 0; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 18px; }

a { color: #235da8; text-underline-offset: 3px; }
@media (max-width: 900px) {

 .grid2,.grid3,.grid2[style*="grid-template-columns"] { grid-template-columns: minmax(0,1fr) !important; }

}
@media (prefers-reduced-motion: reduce) {
 *,*::before,*::after { animation-duration: .001ms !important; transition: none !important; }
}
/* Static explanations: the whole example is visible without playing a sequence. */
.sv-sequence { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; }
.sv-pass { padding: 20px; border: 1px solid #d9e0ea; border-top: 4px solid var(--memory); border-radius: 12px; background: #f7faff; }
.sv-prefill { border-top-color: var(--compute); background: #fff9f2; }

.sv-token-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }

.sv-wait { background: var(--compute-soft); color: #87460e; }.sv-gap { background: var(--memory-soft); color: #254f97; }

.sv-mask td { background: #e5eeff; color: #245aab; }.sv-mask td.sv-masked { background: #f1f2f4; color: #8891a0; }
.sv-input { display: grid; gap: 8px; padding: 18px 22px; border-radius: 8px; background: #eef2f7; text-align: center; font-size: .95rem; }

<script>/* ============================================================
   Shared topic registry, navigation, explanation helpers,
   quizzes and shared visual components.
   Each part file calls part({...}) then topic({...}).
   A topic = { title, question, render(ctx) -> html, mount(root, ctx) }
   ============================================================ */
const SESSION_DATA = { parts: [], topics: [] };
function part(p) { SESSION_DATA.parts.push(Object.assign({ topics: [] }, p)); }
function topic(t) {
  t.partIndex = SESSION_DATA.parts.length - 1;
  if (t.num !== null) t.num = SESSION_DATA.topics.filter(x => x.num !== null).length + 1;
  t.index = SESSION_DATA.topics.length;
  SESSION_DATA.topics.push(t);
  SESSION_DATA.parts[t.partIndex].topics.push(t);
}

/* ---------- tiny DOM helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- number formatting ---------- */
function fmt(n, d = 1) {
  if (!isFinite(n)) return "∞";
  const a = Math.abs(n);
  if (a >= 100) return Math.round(n).toLocaleString("en-US");
  if (a >= 10) return n.toFixed(Math.max(0, d - 0)).replace(/\.0+$/, "");
  if (a >= 1) return n.toFixed(d).replace(/\.0+$/, "");
  if (a === 0) return "0";
  return n.toPrecision(2);
}
function words(n) {
  // 1.4e11 -> "140 billion"
  const units = [[1e18, "quintillion"], [1e15, "quadrillion"], [1e12, "trillion"], [1e9, "billion"], [1e6, "million"], [1e3, "thousand"]];
  for (const [v, w] of units) if (Math.abs(n) >= v) return `${fmt(n / v, 1)} ${w}`;
  return fmt(n, 1);
}
function gb(bytes) {
  const g = bytes / 1e9;
  if (g >= 1000) return `${fmt(g / 1000, 2)} TB`;
  if (g >= 1) return `${fmt(g, 1)} GB`;
  if (bytes >= 1e6) return `${fmt(bytes / 1e6, 1)} MB`;
  if (bytes >= 1e3) return `${fmt(bytes / 1e3, 1)} KB`;
  return `${fmt(bytes, 0)} bytes`;
}
function sci(n) {
  if (n === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(n)));
  const m = n / Math.pow(10, e);
  const sup = String(e).split("").map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)] || (c === "-" ? "⁻" : c)).join("");
  return `${m.toFixed(1)}×10${sup}`;
}

/* ---------- teaching beats (the progression) ---------- */
const beat = (body, cls = "") => `<section class="beat ${cls}">${body}</section>`;
const say = (...paras) => beat(paras.map(p => `<p class="lede">${p}</p>`).join(""), "b-intuit");
const see = (question, html) => beat(`<div class="viz"><div class="viz-q">${question}</div>${html}</div>`, "b-viz");
const ex = (html) => beat(`<div class="example"><div class="ex-h">Worked example</div>${html}</div>`, "b-ex");
const tech = (html, summary = "Exact definitions") =>
  beat(`<details class="tech"><summary>${summary}</summary><div>${html}</div></details>`, "b-tech");
const fx = (lines, note = "") =>
  beat(`<div class="formula">${[].concat(lines).map(l => `<div>${l}</div>`).join("")}${note ? `<div class="fnote">${note}</div>` : ""}</div>`, "b-fx");
const inf = (html) => beat(`<div class="inf">${html}</div>`, "b-inf");
const key = (html) => beat(`<div class="callout key"><span class="tag">Key idea</span><div>${html}</div></div>`, "b-key");
const note = (html, tag = "Simplified model") => `<div class="callout note"><span class="tag">${tag}</span><div>${html}</div></div>`;
const big = (html, tag = "Core idea") => `<div class="callout big"><span class="tag">${tag}</span><div>${html}</div></div>`;

function flow(items, opts = {}) {
  const arrow = opts.vertical ? "↓" : "→";
  return `<div class="flow ${opts.vertical ? "vertical" : ""}" ${opts.id ? `id="${opts.id}"` : ""}>` +
    items.map((it, i) => {
      const o = typeof it === "string" ? { t: it } : it;
      return (i ? `<span class="arr" data-a="${i}">${arrow}</span>` : "") +
        `<div class="node ${o.c || ""}" data-n="${i}">${o.t}</div>`;
    }).join("") + `</div>`;
}
function setFlow(root, idx) {
  if (!root) return;
  $$(".node", root).forEach(n => {
    const i = +n.dataset.n;
    n.classList.toggle("active", i === idx);
    n.classList.toggle("past", i < idx);
  });
  $$(".arr", root).forEach(a => a.classList.toggle("active", +a.dataset.a === idx));
}

const meter = (label, cls, id) =>
  `<div class="meter ${cls}"><div class="mh"><span>${label}</span><span id="${id}-v">0%</span></div><div class="track"><i id="${id}" style="width:0%"></i></div></div>`;
function setMeter(root, id, frac, text) {
  const bar = $("#" + id, root), v = $("#" + id + "-v", root);
  if (bar) bar.style.width = clamp(frac * 100, 0, 100) + "%";
  if (v) v.textContent = text !== undefined ? text : Math.round(clamp(frac, 0, 1) * 100) + "%";
}

function slider(id, label, min, max, step, value) {
  return `<div class="ctl"><label for="${id}"><span>${label}</span><output id="${id}-o"></output></label>

}
function seg(id, options, active) {
  return `<div class="seg" id="${id}" role="group">${options.map(([v, t]) =>
    `<button type="button" data-v="${v}" class="${String(v) === String(active) ? "on" : ""}">${t}</button>`).join("")}</div>`;
}
function bindSeg(root, id, cb) {
  const el = $("#" + id, root);
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $$("button", el).forEach(x => x.classList.toggle("on", x === b));

}
const segVal = (root, id) => $(`#${id} button.on`, root).dataset.v;

/* ---------- quizzes ---------- */
const QUIZ = {}; let quizSeq = 0;
function check(o) {
  const id = "q" + (quizSeq++);
  QUIZ[id] = o;
  return beat(`<div class="quiz" data-quiz="${id}">
    <div class="quiz-h">Think it through</div>

    <div class="quiz-opts">${o.opts.map((t, i) => `<button type="button" class="quiz-opt" data-i="${i}"><span class="quiz-letter">${"ABCD"[i]}</span><span>${t}</span></button>`).join("")}</div>
    <div class="quiz-why" hidden></div></div>`, "b-check");
}
document.addEventListener("click", e => {
  const retry = e.target.closest(".quiz-retry");
  if (retry) {
    const qz = retry.closest(".quiz");
    $$(".quiz-opt", qz).forEach(b => { b.disabled = false; b.classList.remove("right", "wrong"); });
    $(".quiz-why", qz).hidden = true;
    return;
  }
  const btn = e.target.closest(".quiz-opt"); if (!btn) return;
  const qz = btn.closest(".quiz"), o = QUIZ[qz.dataset.quiz], i = +btn.dataset.i;
  $$(".quiz-opt", qz).forEach(b => {
    b.disabled = true;
    if (+b.dataset.i === o.a) b.classList.add("right");
  });
  if (i !== o.a) btn.classList.add("wrong");
  const why = $(".quiz-why", qz);
  why.innerHTML = `<div>${i === o.a ? `<b class="ok">Correct.</b>` : `<b class="no">Not quite.</b> The answer is <b>${"ABCD"[o.a]}</b>.`} ${o.why}</div>
    <div><button type="button" class="btn small quiz-retry">Try again</button></div>`;
  why.hidden = false;
});

/* ---------- shared reference numbers (illustrative) ---------- */
/* An imaginary accelerator used across topics so numbers stay consistent.

const DEMO = {

  "70B": { name: "70B-class", N: 70e9,  L: 80,  d: 8192,  qHeads: 64,  kvHeads: 8, headDim: 128 },

const kvBytesPerToken = (m, bytes = 2, kvHeads = m.kvHeads) => 2 * m.L * kvHeads * m.headDim * bytes;

/* ============================================================
   App shell / navigation
   ============================================================ */
const state = { cur: 0 };
function loadState() {
  const m = location.hash.match(/^#t=(\d+)$/);
  if (m) state.cur = clamp(+m[1] - 1, 0, SESSION_DATA.topics.length - 1);
}

/* timers registered by a topic are cleared on navigation */
function makeCtx() {
  const timers = [], rafs = new Set();
  const ctx = {
    every(ms, fn) { const t = setInterval(fn, ms); timers.push(t); return t; },
    after(ms, fn) { const t = setTimeout(fn, ms); timers.push(t); return t; },
    stop(t) { clearInterval(t); clearTimeout(t); },
    loop(fn) {
      let alive = true, last = performance.now(), id;
      const schedule = () => { id = requestAnimationFrame(tick); rafs.add(id); };
      const tick = (now) => { rafs.delete(id); if (!alive || ctx.disposed) return; fn((now - last) / 1000, now); last = now; schedule(); };
      schedule();
      return () => { alive = false; cancelAnimationFrame(id); rafs.delete(id); };
    },
    dispose() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); rafs.forEach(cancelAnimationFrame); ctx.disposed = true; },
    go(i) { navigate(i); },
  };
  return ctx;
}
let currentCtx = null;

function renderShell() {
  document.getElementById("app").innerHTML = `
    <a class="skip-link" href="#main-content">Skip to explanation</a>
    <header class="topbar">
      <h1>LLM Inference &amp; GPUs</h1>
      <nav class="parts" id="parts" aria-label="Sections"></nav>
    </header>
    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Topics in this section"></aside>
      <main class="main" id="main-content" tabindex="-1">
        <div class="stage" id="stage"></div>
        <nav class="session-nav" aria-label="Previous and next topic">
          <button type="button" class="btn" id="prev">← Previous</button>
          <button type="button" class="btn primary" id="next">Next →</button>
        </nav>
      </main>
    </div>`;
  $("#prev").onclick = () => navigate(state.cur - 1);
  $("#next").onclick = () => navigate(state.cur + 1);
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, select, textarea")) return;
    if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); navigate(state.cur + 1); }
    if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); navigate(state.cur - 1); }
  });
  window.addEventListener("hashchange", () => {
    const m = location.hash.match(/^#t=(\d+)$/);
    if (m && +m[1] - 1 !== state.cur) navigate(+m[1] - 1);
  });
}

function renderNav() {
  const t = SESSION_DATA.topics[state.cur], p = SESSION_DATA.parts[t.partIndex];
  $("#parts").innerHTML = SESSION_DATA.parts.map((pp, i) => `
    <button type="button" class="part-tab ${i === t.partIndex ? "active" : ""}" data-p="${i}" ${i === t.partIndex ? 'aria-current="true"' : ''}>
      <span class="pt">${pp.title}</span>
    </button>`).join("");
  $$("#parts .part-tab").forEach(b => b.onclick = () => navigate(SESSION_DATA.parts[+b.dataset.p].topics[0].index));
  $("#sidebar").innerHTML = `<h2>${p.title}</h2>
    <ul class="topic-list">${p.topics.map(x => `<li><button type="button" class="topic-link ${x.index === state.cur ? "active" : ""}" data-t="${x.index}" ${x.index === state.cur ? 'aria-current="true"' : ''}>
      <span>${x.title}</span></button></li>`).join("")}</ul>`;
  $$("#sidebar .topic-link").forEach(b => b.onclick = () => navigate(+b.dataset.t));
  $("#prev").disabled = state.cur === 0;
  $("#next").disabled = state.cur === SESSION_DATA.topics.length - 1;
}

function navigate(i) {
  if (i < 0 || i >= SESSION_DATA.topics.length) return;
  if (currentCtx) currentCtx.dispose();
  for (const k of Object.keys(QUIZ)) delete QUIZ[k];
  state.cur = i;
  if (location.hash !== `#t=${i + 1}`) history.replaceState(null, "", `#t=${i + 1}`);
  const t = SESSION_DATA.topics[i];
  currentCtx = makeCtx();
  $("#stage").innerHTML = `<div class="topic-head"><h2>${t.title}</h2>
    ${t.question ? `<p class="topic-question">${t.question}</p>` : ""}</div>${t.render(currentCtx)}`;
  if (t.mount) t.mount($("#stage"), currentCtx);
  document.title = `${t.title} · LLM Inference & GPUs`;
  renderNav();
  window.scrollTo({ top: 0 });
}

function boot() {
  renderShell();
  loadState();
  navigate(state.cur);
}

/* bind range sliders: spec = { id: (value, allValues) => label } */
function bindSliders(root, spec, update) {
  const read = () => { const v = {}; for (const id in spec) v[id] = +$("#" + id, root).value; return v; };
  const run = () => {
    const v = read();
    for (const id in spec) { const o = $("#" + id + "-o", root); if (o) o.textContent = spec[id](v[id], v); }
    update(v);
  };
  for (const id in spec) $("#" + id, root).addEventListener("input", run);
  run();
  return run;
}

/* ---------- playable visualizations ----------
   player(id) renders controls; bindPlayer wires them to a frame renderer. */
function player(id) {
  return `<div class="player" id="${id}">
    <button type="button" class="btn" data-a="restart" title="Restart">⏮ Restart</button>
    <button type="button" class="btn" data-a="back">◀ Step</button>
    <button type="button" class="btn primary" data-a="play">▶ Play</button>
    <button type="button" class="btn" data-a="fwd">Step ▶</button>
    <input type="range" data-a="scrub" min="0" max="0" value="0" aria-label="Scrub timeline">
    <span class="pl-count"></span>
    <select data-a="speed" aria-label="Speed"><option value="1.7">Slow</option><option value="1" selected>Normal</option><option value="0.55">Fast</option></select>
  </div>`;
}
function bindPlayer(root, id, ctx, o) {
  const el = $("#" + id, root), q = a => $(`[data-a="${a}"]`, el);
  let i = 0, timer = null, frames = o.frames;
  const show = (k) => {
    i = clamp(k, 0, frames - 1);
    q("scrub").max = frames - 1; q("scrub").value = i;
    $(".pl-count", el).textContent = `${i + 1} / ${frames}`;
    q("back").disabled = i === 0; q("fwd").disabled = i === frames - 1;
    o.render(i);
  };
  const stop = () => { if (timer) { ctx.stop(timer); timer = null; } q("play").textContent = "▶ Play"; };
  const play = () => {
    if (i >= frames - 1) show(0);
    q("play").textContent = "❚❚ Pause";
    timer = ctx.every((o.interval || 1800) * +q("speed").value, () => { if (i >= frames - 1) stop(); else show(i + 1); });
  };
  q("play").onclick = () => timer ? stop() : play();
  q("fwd").onclick = () => { stop(); show(i + 1); };
  q("back").onclick = () => { stop(); show(i - 1); };
  q("restart").onclick = () => { stop(); show(0); };
  q("scrub").oninput = () => { stop(); show(+q("scrub").value); };
  q("speed").onchange = () => { if (timer) { stop(); play(); } };
  show(0);
  return { show, stop, get i() { return i; }, setFrames(n) { frames = n; show(Math.min(i, n - 1)); } };
}

part({

/* ---------- Topic 1 ---------- */
topic({
  num: 1, title: "What happens during LLM inference",
  question: "What exactly happens, step by step, when a model answers?",
  render: () => `
    ${say(
      "When you send a message to an LLM, the model does not write the whole answer in one go. It calculates scores for the <b>next token</b>, chooses one, adds it to the response, and repeats. A token can be a word, part of a word, punctuation, or whitespace.",
      "The first pass reads your prompt. After that, each pass processes the most recently generated token and reuses information saved from earlier tokens. The model weights stay fixed; the <b>request state</b> changes as the conversation grows.",
      "Follow “Why is the sky” below. Watch three things separately: the tokens going <b>into</b> the model, the token coming <b>out</b>, and the keys and values being saved for the next pass. That distinction explains most of what the GPU has to do."
    )}
    ${see("What happens between sending a prompt and getting the answer?", `
      ${player("t1-pl")}
      <div class="caption" id="t1-cap"></div>
      <div class="inf-top">
        <div style="display:grid;gap:6px"><div class="mini-label">Text so far (outlined = being processed in this pass)</div><div class="textbox" id="t1-text"></div></div>
        <div class="counters">
          <div class="stat"><span class="v" id="t1-phase">–</span><span class="k">phase</span></div>
          <div class="stat"><span class="v" id="t1-pass">0</span><span class="k">forward passes run</span></div>
          <div class="stat"><span class="v" id="t1-gen">0</span><span class="k">tokens generated</span></div>
          <div class="stat"><span class="v c-kv" id="t1-kv">0</span><span class="k">KV cache entries</span></div>
        </div>
      </div>
      <div class="scroll-x">${flow(["Text", "Tokens", "Token IDs", "Embeddings", { t: "Transformer layers (GPU)", c: "compute" }, "Next-token scores", "Pick a token", "Append &amp; repeat"], { id: "t1-flow" })}</div>
      <div class="stage-view" id="t1-view"></div>`)}
    ${see("How is this different from training?", `
      <div class="grid2">
        <div class="loop-box"><h4>Training <span class="pill memory">weights change</span></h4>
          ${flow([{ t: "Data batch" }, { t: "Model", c: "compute" }, { t: "Loss" }, { t: "Update weights", c: "memory" }, { t: "↺ repeat" }], { id: "t1-train" })}
          <p class="c-muted" style="font-size:.85rem">Forward pass + backward pass + weight update, millions of times.</p></div>
        <div class="loop-box"><h4>Inference <span class="pill ok">weights frozen</span></h4>
          ${flow([{ t: "Text so far" }, { t: "Model", c: "compute" }, { t: "Next token", c: "kv" }, { t: "Add to text" }, { t: "↺ repeat" }], { id: "t1-inf" })}
          <p class="c-muted" style="font-size:.85rem">Forward pass only: one pass per new token.</p></div>
      </div>`)}
    ${ex(`<div class="calc">Imagine the prompt is four tokens and the answer is “ blue because of scattering”, also four tokens in this illustration. <b>Pass 1</b> reads the prompt and predicts “ blue”. <b>Pass 2</b> processes “ blue” and predicts “ because”. Two more passes produce the remaining answer. Four output tokens therefore need <b>one prefill + three decode passes</b>, not four decode passes after prefill.</div>`)}
    ${tech(`<ul>
      <li><b>Forward pass:</b> running the input through every layer, from input to output, using the weights.</li>
      <li><b>Next-token prediction:</b> the last layer gives a score (logit) for every token in the vocabulary; a sampler picks one.</li>
      <li><b>Autoregressive generation:</b> each output token is appended and becomes part of the next input.</li>
      <li><b>Prefill</b> processes the prompt; <b>decode</b> produces one token per pass. Both are covered in detail in topic 3.</li>
    </ul>`)}
    ${inf(`<p>The GPU runs the model <b>again and again</b>, once per new token, and every pass reads the model's weights. How fast each pass runs decides how fast text appears.</p>`)}
    ${check({
      q: "During inference, what happens to the model weights?",
      opts: ["They are updated after every token", "They stay frozen and are only read", "They are updated after each full response", "They are deleted after the prompt is read"],
      a: 1, why: "Inference never changes the weights. It only reads them, for every token. That repeated reading will matter a lot when we get to GPU memory.",
    })}`,
  mount(root, ctx) {
    let li = 0;
    ctx.every(900, () => { setFlow($("#t1-train", root), li % 5); setFlow($("#t1-inf", root), li % 5); li++; });

    const P = ["Why", " is", " the", " sky"], G = [" blue", " because", " of", " scattering"];
    const IDS = { "Why": 5195, " is": 318, " the": 262, " sky": 6766, " blue": 4171, " because": 780, " of": 286, " scattering": 45765 };
    const CANDS = [
      [[" blue", 71], [" so", 9], [" red", 5], [" dark", 4], [" clear", 3]],
      [[" because", 48], ["?", 22], [" during", 12], [",", 8], [" in", 4]],
      [[" of", 62], [" sunlight", 20], [" the", 7], [" air", 5], [" light", 3]],
      [[" scattering", 55], [" Rayleigh", 25], [" air", 8], [" light", 6], [" dust", 2]],
    ];
    const frames = [];
    for (let s = 0; s <= 7; s++) frames.push({ p: 0, s });
    for (let p = 1; p < G.length; p++) [2, 3, 4, 5, 6, 7].forEach(s => frames.push({ p, s }));
    frames.push({ p: G.length, s: 8 });

    const esc = t => t.replace(/ /g, "␣");
    const vec = (t) => { let h = 7; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 10007; return Array.from({ length: 8 }, (_, i) => Math.sin(h * (i + 3) * 0.37)); };
    const cellColor = v => v >= 0 ? `rgba(47,107,220,${0.15 + Math.abs(v) * 0.75})` : `rgba(223,116,20,${0.15 + Math.abs(v) * 0.75})`;

    const render = (fi) => {
      const f = frames[fi], done = f.s === 8;
      const appended = done ? G.length : f.p + (f.s >= 7 ? 1 : 0);
      const all = P.concat(G.slice(0, appended));
      const procIdx = f.p === 0 ? [0, 1, 2, 3] : [P.length + f.p - 1];
      const procToks = procIdx.map(i => P.concat(G)[i]);
      const processing = !done && f.s >= 1 && f.s <= 4;
      $("#t1-text", root).innerHTML = all.map((t, i) =>
        `<span class="tok ${i < P.length ? "prompt" : "gen"} ${processing && procIdx.includes(i) ? "proc" : ""} ${f.s === 7 && i === all.length - 1 ? "new" : ""}">${t}</span>`).join("");
      $("#t1-phase", root).textContent = done ? "Done" : f.p === 0 ? "Prefill" : "Decode";
      $("#t1-pass", root).textContent = done ? G.length : f.p + (f.s >= 4 ? 1 : 0);
      $("#t1-gen", root).textContent = appended;
      $("#t1-kv", root).textContent = done ? P.length + G.length - 1 : f.s >= 4 ? P.length + f.p : (f.p === 0 ? 0 : P.length + f.p - 1);
      setFlow($("#t1-flow", root), done ? -1 : f.s);

      const passName = f.p === 0 ? "Prefill pass" : `Decode pass ${f.p}`;
      let cap = "", view = "";
      const cand = CANDS[Math.min(f.p, CANDS.length - 1)];
      switch (done ? 8 : f.s) {
        case 0:
          cap = "The prompt arrives as plain text. A computer can't do maths on letters, so it must be turned into numbers first.";
          view = `<h4>Plain text</h4><div class="tokens"><span class="tok" style="font-size:1.3rem;padding:6px 14px">Why is the sky</span></div>`;
          break;
        case 1:
          cap = "The tokenizer splits the text into tokens: whole words or pieces of words. In this illustrative tokenization, each space belongs to the token after it; real tokenizers vary.";
          view = `<h4>Tokens</h4><div class="tokens">${P.map(t => `<span class="tok prompt new" style="font-size:1.1rem">${esc(t)}</span>`).join("")}</div><p class="c-muted">4 tokens. (␣ marks a space.)</p>`;
          break;
        case 2:
          cap = f.p === 0 ? "Each token is looked up in the vocabulary and replaced by its ID number." : `${passName}: the newest token “${procToks[0].trim()}” is already a token, so it just needs its ID. The earlier tokens are not sent again.`;
          view = `<h4>Token IDs</h4><div class="tokens">${procToks.map(t => `<span class="tok ${f.p ? "gen" : "prompt"}" style="font-size:1rem">${esc(t)} → <b>${IDS[t]}</b></span>`).join("")}</div><p class="c-muted" style="font-size:.85rem">IDs are illustrative; every tokenizer numbers its vocabulary differently.</p>`;
          break;
        case 3:
          cap = "Each ID selects a row from the embedding table: a learned vector. Its entries are features the model can transform, not a readable definition of the token.";
          view = `<h4>Embeddings (${procToks.length} vector${procToks.length > 1 ? "s" : ""})</h4><div class="embed">${procToks.map(t => `<div class="erow"><span>${esc(t)}</span>${vec(t).map(v => `<i style="background:${cellColor(v)}" title="${v.toFixed(2)}"></i>`).join("")}</div>`).join("")}</div>
            <p class="c-muted" style="font-size:.85rem">8 numbers shown per token; a 70B-class model uses 8,192.</p>`;
          break;
        case 4:
          cap = f.p === 0
            ? "Prefill: all 4 prompt vectors go through every Transformer layer together, in parallel. Each layer reads its weights from GPU memory, and the Keys and Values of all 4 tokens are saved in the KV cache."
            : `${passName}: only the ONE new vector goes through the layers. The earlier tokens are not recomputed: attention reads their Keys and Values from the KV cache, and this token's K and V are added to it.`;
          view = `<h4>Transformer layers on the GPU</h4>
            <div class="grid2" style="grid-template-columns:minmax(0,1fr) 250px;align-items:start">
              <div style="display:grid;gap:8px">
                <div class="layer-stack layer-run">${[1, 2, 3, 4, 5, 6].map((n, i) => `<div class="lyr" style="animation-delay:${i * 0.25}s"><b>Layer ${n}</b><span class="a">attention</span><span class="m">MLP</span></div>`).join("")}<div class="lyr" style="border-style:dashed"><b>…</b><span>up to</span><b>80</b></div></div>
                <p style="font-size:.9rem">Processing <b>${procToks.length} token${procToks.length > 1 ? "s" : ""}</b> in this pass: ${procToks.map(t => `<code>${esc(t)}</code>`).join(" ")}</p>
              </div>
              <div class="mem-side"><div class="mini-label">GPU memory (HBM)</div>
                <div class="mem-chip w"><span>Model weights</span><b>read by every layer</b></div>
                <div class="mem-chip kvc"><span>KV cache</span><b>${f.p === 0 ? "write 4" : `read ${P.length + f.p - 1}, write 1`}</b></div>
              </div>
            </div>`;
          break;
        case 5:
          cap = "The last layer turns the final token's vector into a score for every token in the vocabulary (often 100,000+). Softmax turns the scores into probabilities.";
          view = `<h4>Next-token probabilities (top 5 of the whole vocabulary)</h4><div class="bars-h">${cand.map(([t, p]) => `<div class="row"><span class="mono">${esc(t)}</span><div><div class="b" style="width:${p}%"></div></div><span class="v">${p}%</span></div>`).join("")}</div>`;
          break;
        case 6:
          cap = `A sampler picks one token. Here we take the most likely one: “${cand[0][0].trim()}”.`;
          view = `<h4>Pick a token</h4><div class="bars-h">${cand.map(([t, p], i) => `<div class="row ${i === 0 ? "pick" : ""}"><span class="mono">${esc(t)}</span><div><div class="b" style="width:${p}%;opacity:${i === 0 ? 1 : .3}"></div></div><span class="v">${i === 0 ? "✓ " : ""}${p}%</span></div>`).join("")}</div>`;
          break;
        case 7:
          cap = f.p < G.length - 1
            ? `“${G[f.p].trim()}” is appended. ${passName} is finished. The new token is now the input for the next pass, and everything repeats.`
            : `“${G[f.p].trim()}” is appended. In a real run this continues until an end token or a length limit.`;
          view = `<h4>Append and repeat</h4><div class="tokens" style="font-size:1.1rem">${all.map((t, i) => `<span class="tok ${i < P.length ? "prompt" : "gen"} ${i === all.length - 1 ? "new" : ""}">${t}</span>`).join("")}</div>
            <p>${f.p < G.length - 1 ? `Next: <b>Decode pass ${f.p + 1}</b> takes only “${G[f.p].trim()}” as new input.` : "Generation continues the same way."}</p>`;
          break;
        default:
          cap = "Summary: one prefill pass read the whole prompt. Then each decode pass handled one new token and reused earlier work from the KV cache.";
          view = `<h4>What happened</h4><div class="scroll-x"><table class="cmp-table">
            <tr><th>Pass</th><th>Input tokens processed</th><th>Output token</th><th>KV cache after</th></tr>
            ${G.map((g, p) => `<tr><td>${p === 0 ? "Prefill" : `Decode ${p}`}</td><td class="mono">${p === 0 ? P.map(esc).join(" ") : esc(G[p - 1])}</td><td class="mono">${esc(g)}</td><td class="mono">${P.length + p} entries</td></tr>`).join("")}
          </table></div>`;
      }
      $("#t1-cap", root).innerHTML = `<span class="cap-step">${done ? "Finished" : `${passName} · step ${f.s + 1}`}</span><span>${cap}</span>`;
      $("#t1-view", root).innerHTML = view;
    };
    bindPlayer(root, "t1-pl", ctx, { frames: frames.length, render, interval: 2600 });
  },
});

/* ---------- Topic 2 ---------- */
topic({
  num: 2, title: "What happens when you send a prompt?",
  question: "What steps turn my text into the next word?",
  render: () => `
    ${say(
      "The GPU cannot multiply the letters in “The cat sat”. A <b>tokenizer</b> first converts the text into token IDs: integers identifying entries in a vocabulary. The IDs are labels, so a larger ID does not mean a more important token.",
      "An <b>embedding lookup</b> replaces each ID with a learned vector—a row of numbers. Transformer layers repeatedly change these vectors. Attention brings in information from relevant positions; the MLP transforms the features at each position. The layers have the same general structure but different weights.",
      "Finally, the last position produces one <b>logit</b>, or raw score, for each possible next token. These scores become probabilities for sampling, or we simply take the largest score for greedy decoding. Step through the example to see where text becomes numbers and where those numbers become a token again."
    )}
    ${see("What happens to the prompt “The cat sat” at each stage?", `
      <div class="pipeline-stages" id="t2-stages"></div>
      <div class="stage-panel" id="t2-panel"></div>
      <div class="btn-row">
        <button type="button" class="btn" id="t2-prev">← Stage</button>
        <button type="button" class="btn primary" id="t2-next">Next stage →</button>
        <button type="button" class="btn" id="t2-play">▶ Play all</button>
      </div>`, "Click each stage")}
    ${ex(`<div class="calc">For an illustrative three-token prompt and hidden size 4,096, the layer input has shape <b>3 × 4,096</b>: one row per position. A 4,096 × 4,096 weight matrix transforms all three rows. During the next cached decode pass, there is only <b>one new row</b>. The same weights are used in both cases; the amount of new input work is different.</div>`)}
    ${tech(`<ul>
      <li><b>Tokenizer:</b> splits text into sub-word pieces from a fixed vocabulary (often 32k–200k entries).</li>
      <li><b>Embedding lookup:</b> a big table (vocabulary × hidden size). Token ID <i>i</i> selects row <i>i</i>.</li>
      <li><b>Transformer layer:</b> attention (tokens exchange information) followed by an MLP (each token is processed on its own). Both are mostly matrix multiplications.</li>
      <li><b>Logits:</b> one raw score per vocabulary token. Softmax turns them into probabilities. <b>Sampling</b> (greedy, top-p, temperature) picks the token.</li>
    </ul>`)}
    ${inf(`<p>Almost all GPU time is spent inside the <b class="c-compute">Transformer layers</b>. Tokenization and sampling are cheap by comparison. The layers are where the weights are read and where the matrix maths happens.</p>`)}
    ${check({
      q: "What are logits?",
      opts: ["The token IDs of the prompt", "One score per possible next token", "The model weights for the last layer", "The cached attention values"],
      a: 1, why: "Logits are raw scores, one for every token in the vocabulary. Softmax turns them into probabilities, and a sampler picks the next token.",
    })}`,
  mount(root, ctx) {
    const stages = [
      { n: "Prompt", h: `<p>You type plain text.</p><div class="tokens"><span class="tok" style="font-size:1.1rem">The cat sat</span></div>` },
      { n: "Tokenization", h: `<p>The text is split into <b>tokens</b>: common words or pieces of words. In this example, the leading spaces are part of the tokens; boundaries depend on the tokenizer.</p>
          <div class="tokens"><span class="tok prompt">The</span><span class="tok prompt"> cat</span><span class="tok prompt"> sat</span></div>` },
      { n: "Token IDs", h: `<p>Each token is looked up in the vocabulary and replaced by its ID number.</p>
          <div class="tokens"><span class="tok prompt">The → 464</span><span class="tok prompt"> cat → 3797</span><span class="tok prompt"> sat → 3332</span></div>
          <p class="c-muted" style="font-size:.8rem">IDs shown are illustrative; every tokenizer has its own numbering.</p>` },
      { n: "Embeddings", h: `<p>Each ID picks a row from the embedding table, giving a <b>vector</b>: a learned list of numerical features. Later layers make that representation depend on the surrounding text.</p>
          <div style="display:grid;gap:6px">
            <div>464 → <span class="vec"><span>0.12</span><span>-0.80</span><span>0.33</span><span>0.05</span><span>…</span></span></div>
            <div>3797 → <span class="vec"><span>0.91</span><span>0.14</span><span>-0.42</span><span>0.60</span><span>…</span></span></div>
            <div>3332 → <span class="vec"><span>-0.27</span><span>0.55</span><span>0.08</span><span>-0.71</span><span>…</span></span></div>
          </div><p class="c-muted" style="font-size:.8rem">Real models use thousands of numbers per token (for example 4,096 or 8,192), not 4.</p>` },
      { n: "Transformer layers", h: `<p>The vectors pass through a stack of layers with the same general structure but different weights. In each layer, <b>attention</b> lets tokens look at earlier tokens, and an <b>MLP</b> transforms each token. Both steps are big <b class="c-compute">matrix multiplications with the weights</b>.</p>
          <div class="layers" id="t2-layers">${"<i></i>".repeat(24)}</div><p class="c-muted" style="font-size:.8rem">A 70B-class model has about 80 of these layers.</p>` },
      { n: "Logits → probabilities", h: `<p>The last position produces a raw score (logit) for each possible next token. Softmax turns those scores into probabilities. The bars below show <b>probabilities after softmax</b>, not raw logits.</p>
          <div class="bars-h">${[[" on", 62], [" down", 18], [" in", 7], [" there", 5], [" quietly", 3]].map(([t, p], i) => `<div class="row ${i === 0 ? "pick" : ""}"><span class="mono">"${t}"</span><div><div class="b" style="width:${p}%"></div></div><span class="v">${p}%</span></div>`).join("")}</div>` },
      { n: "Next token", h: `<p>A sampler picks one token. With greedy decoding it takes the highest score.</p>
          <div class="tokens"><span class="tok prompt">The</span><span class="tok prompt"> cat</span><span class="tok prompt"> sat</span><span class="tok gen new"> on</span></div>` },
      { n: "Repeat", h: `<p>The new token is added to the text, and the model runs again to get the next one. This loop continues until a stop token or a length limit.</p>
          <div class="tokens"><span class="tok prompt">The</span><span class="tok prompt"> cat</span><span class="tok prompt"> sat</span><span class="tok gen"> on</span><span class="tok gen new"> the</span><span class="tok ghost"> mat</span><span class="tok ghost"> …</span></div>
          <p class="c-muted" style="font-size:.85rem">Coming up: the model does <i>not</i> need to redo all the old work each time. That is what the KV cache is for.</p>` },
    ];
    let cur = 0, seen = new Set([0]), layerTimer = null, play = null;
    const show = (i) => {
      cur = clamp(i, 0, stages.length - 1); seen.add(cur);
      $("#t2-stages", root).innerHTML = stages.map((s, j) =>
        (j ? `<span class="c-muted">→</span>` : "") + `<button type="button" class="stage-btn ${j === cur ? "on" : seen.has(j) ? "seen" : ""}" data-s="${j}">${s.n}</button>`).join("");
      $("#t2-panel", root).innerHTML = `<div class="mini-label">Stage ${cur + 1} of ${stages.length}</div><h4 style="font-size:1.1rem">${stages[cur].n}</h4>${stages[cur].h}`;
      if (layerTimer) ctx.stop(layerTimer);
      if (stages[cur].n === "Transformer layers") {
        let k = 0; const ls = $$("#t2-layers i", root);
        layerTimer = ctx.every(90, () => { ls.forEach((l, j) => l.classList.toggle("on", j <= k % (ls.length + 6))); k++; });
      }
      $("#t2-prev", root).disabled = cur === 0;
    };
    $("#t2-stages", root).onclick = e => { const b = e.target.closest(".stage-btn"); if (b) show(+b.dataset.s); };
    $("#t2-prev", root).onclick = () => show(cur - 1);
    $("#t2-next", root).onclick = () => show(cur + 1 >= stages.length ? 0 : cur + 1);
    $("#t2-play", root).onclick = () => {
      if (play) { ctx.stop(play); play = null; $("#t2-play", root).textContent = "▶ Play all"; return; }
      show(0); $("#t2-play", root).textContent = "❚❚ Pause";
      play = ctx.every(2600, () => { if (cur >= stages.length - 1) { ctx.stop(play); play = null; $("#t2-play", root).textContent = "▶ Play all"; } else show(cur + 1); });
    };
    show(0);
  },
});

          <div class="sv-token-row"><span>the</span></div>
          <div class="sv-down">↓ <span>1 new input position</span></div>
          <div class="sv-model">Model + saved K/V</div>
          <div class="sv-down">↓ <span>predict &amp; select</span></div>
          <div class="sv-result">mat <small>third output token</small></div>
          <div class="sv-save">Append K/V for: the</div>
        </div>

      <div class="sv-caption">Read left → right. “the” cannot be predicted in this loop until “on” has been selected.</div>

    ${see("What you see on screen", `
      <div class="sv-timeline">
        <div class="sv-wait"><span>Request sent → first token</span><strong>600 ms</strong><span>queue + prefill + other overhead</span></div>
        <div class="sv-gap"><span>on → the</span><strong>40 ms</strong><span>decode gap</span></div>
        <div class="sv-gap"><span>the → mat</span><strong>40 ms</strong><span>decode gap</span></div>
      </div>
      <div class="sv-legend"><span><b>TTFT</b> = time to first token</span><span><b>ITL</b> = gap between consecutive tokens</span></div>

topic({

    ${tech(`<ul>
      <li><b>CPU RAM</b> (system memory) is large but connected to the GPU over PCIe, which is slow compared with the GPU's own memory.</li>

    ${fx(["Weight memory ≈ number of parameters × bytes per parameter"])}
    ${inf(`<p>Every forward pass reads the weights from HBM. They never go back to the CPU while serving. So <b>the size of HBM</b> decides whether a model fits, and <b>the speed of HBM</b> (coming in topic 11) decides how quickly those weights can be read.</p>`)}
