        `<span class="tok ${i === hi ? "lit" : cls}" style="text-align:center;padding:4px 0">${v === null ? "?" : v}</span>`).join("")}</div></div>`;
    const drawMat = (showY, hiCell) => {
      const Yshow = Y.map((r, i) => r.map((v, j) => (i * 2 + j) < showY ? v : null));
      const hiRow = hiCell >= 0 ? Math.floor(hiCell / 2) : -1;
      $("#t6-mat", root).innerHTML = `<div style="display:flex;gap:10px;align-items:center;font-family:var(--f-mono);white-space:nowrap">
        ${mat(X, "prompt", -1, "X")}<span>×</span>${mat(W, "", -1, "W")}<span>=</span>${mat(Yshow, "gen", hiCell, "Y")}</div>
        ${hiCell >= 0 ? `<p class="mono" style="font-size:.85rem;margin-top:6px">Y[${hiRow}][${hiCell % 2}] = ${X[hiRow][0]}×${W[0][hiCell % 2]} + ${X[hiRow][1]}×${W[1][hiCell % 2]} = ${Y[hiRow][hiCell % 2]}</p>` : ""}`;
    };
    const show = (i) => {
      cur = clamp(i, 0, steps.length - 1);
      const s = steps[cur];
      setFlow($("#t6-flow", root), cur);
      $("#t6-panel", root).innerHTML = s.h;
      $("#t6-bytes", root).textContent = `${s.bytes} bytes`;
      if (cellT) { ctx.stop(cellT); cellT = null; }
      if (s.compute) {
        cellsDone = 0; drawMat(0, 0); $("#t6-flops", root).textContent = "0";
        cellT = ctx.every(650, () => {
          cellsDone++;
          $("#t6-flops", root).textContent = cellsDone * 3;
          drawMat(cellsDone, cellsDone < 4 ? cellsDone : -1);
          if (cellsDone >= 4) { ctx.stop(cellT); cellT = null; }
        });
      } else {
        drawMat(s.done ? 4 : 0, -1);
        $("#t6-flops", root).textContent = s.done ? "12" : "0";
      }
    };
    bindPlayer(root, "t6-pl", ctx, { frames: steps.length, render: show, interval: 4200 });
  },
});

/* ---------- Topic 7 ---------- */
topic({
  num: 7, title: "The GPU at work on one token",
  question: "Which parts are busy when my model processes a token?",
  render: () => `
    ${say(
      "One generated token passes through every transformer layer. Within a layer, projections create queries, keys and values; attention combines information from the context; another projection and the MLP transform the result. This creates a sequence of GPU operations.",
      "The CPU launches kernels. Their threads are organized into blocks; blocks are assigned to SMs. Within a block, CUDA threads form <b>32-thread warps</b>. A thread is a unit of work, a warp is an execution grouping, and an SM is hardware that executes that work.",
      "Some operations use Tensor Cores, while others use general arithmetic units. Regardless of which unit performs the maths, the inputs must reach it. Switch between the views below to connect the logical work with the hardware that runs it."
    )}
    ${see("Which part of the GPU does which job?", `
      <div class="btn-row" id="t7-pick">
        ${[["board", "GPU"], ["sm", "SMs"], ["cuda", "CUDA cores"], ["tensor", "Tensor Cores"], ["threads", "Threads"], ["warps", "Warps"]].map(([k, t], i) =>
          `<button type="button" class="btn ${i === 0 ? "on" : ""}" data-k="${k}">${t}</button>`).join("")}
      </div>
      <div id="t7-visual"></div>
      <div id="t7-info"></div>`, "Pick a component")}
    ${ex(`<div class="calc">A 64-thread block contains <b>two 32-thread warps</b>, not 64 physical cores reserved for that block. An SM can keep multiple warps available and issue work from another when one is waiting. This helps hide delays, but it cannot manufacture more memory bandwidth when the memory interface is already saturated.</div>`)}
    ${tech(`<ul>
      <li><b>Kernel:</b> a small GPU program (for example “multiply these two matrices”). Launching a kernel creates many <b>threads</b> that run the same code on different elements of the data.</li>
      <li><b>SM (Streaming Multiprocessor):</b> an execution unit that creates, schedules and runs those threads on its cores, using its registers and shared memory.</li>
      <li><b>Warp:</b> a group of threads that an SM schedules and runs together, all doing the same instruction on different data. A CUDA warp contains 32 threads; inactive or divergent lanes may not perform useful work at every instruction. In CUDA code you'll see threads grouped into <i>blocks</i> instead.</li>
      <li><b>Tensor Cores</b> accelerate mixed-precision matrix multiply. Libraries such as cuBLAS and inference engines route the big projections to them.</li>
    </ul>`)}
    ${inf(`<p>When your model generates a token: the CPU launches kernels layer by layer → SMs split each kernel into threads and warps → <b class="c-compute">Tensor Cores</b> crunch the projections → <b>CUDA cores</b> handle norms, activations and softmax → results flow into the next layer. All of it needs data brought from <b class="c-memory">HBM</b>.</p>`)}
    ${check({
      q: "Which GPU component is specialized for the large matrix multiplications like X×W<sub>q</sub> and the MLP projections?",
      opts: ["Registers", "Tensor Cores", "PCIe", "CPU RAM"],
      a: 1, why: "Tensor Cores are circuits built for high-throughput matrix multiplication, which is where most of the FLOPs in a Transformer layer go.",
    })}`,
  mount(root, ctx) {

        ${Array.from({ length: rows * cols }, (_, i) => `<span data-g="${groups ? Math.floor(i / 32) : i}" style="aspect-ratio:1;border-radius:3px;background:var(--surface-3);display:grid;place-items:center;font-size:.55rem;font-family:var(--f-mono);transition:background .2s"></span>`).join("")}
      </div></div>`;
    };
    const views = {
      board: () => { vis.innerHTML = gpuDiagram(); $$("[data-part='board']", vis).forEach(x => x.classList.add("sel")); info.innerHTML = partInfo("board"); },
      sm: () => {
        vis.innerHTML = gpuDiagram(); info.innerHTML = partInfo("sm");
        const sms = $$(".sm", vis); let k = 0;
        anim = ctx.every(350, () => { sms.forEach((s, i) => s.style.boxShadow = i === k % sms.length ? "0 0 0 3px var(--accent)" : "none"); k++; });
      },
      cuda: () => {
        vis.innerHTML = gpuDiagram() + `<div class="tokens">${["RMSNorm", "SiLU / GELU", "softmax", "residual add", "rotary embedding", "sampling"].map(o => `<span class="tok">${o}</span>`).join("")}</div>`;
        info.innerHTML = partInfo("cuda");
        const cores = $$(".cores i", vis);
        anim = ctx.every(160, () => cores.forEach(c => c.classList.toggle("on", Math.random() < .45)));

      tensor: () => {

        vis.innerHTML = gpuDiagram() + `<div class="grid2" style="grid-template-columns:1fr auto;align-items:center">
          <div class="tokens" id="t7-ops">${ops.map(o => `<span class="tok">${o}</span>`).join("")}</div>
          <div class="stat"><span class="v c-compute" id="t7-layer">layer 1 / 80</span><span class="k">one token's forward pass</span></div></div>`;
        info.innerHTML = partInfo("tensor");
        const tc = $$(".tcore", vis), opEls = $$("#t7-ops .tok", vis); let k = 0;
        anim = ctx.every(260, () => {
          const o = k % ops.length; opEls.forEach((e, i) => e.classList.toggle("lit", i === o));
          tc.forEach(t => t.classList.toggle("on", o !== 3 || Math.random() < .5));
          $("#t7-layer", vis).textContent = `layer ${Math.floor(k / ops.length) % 80 + 1} / 80`; k++;
        });
      },
      threads: () => {
        vis.innerHTML = `<p style="font-size:.9rem">Computing a 4 × 16 output matrix <b>Y = X·W</b>. Every cell is one <b>thread</b>, running the same tiny program: <code>y[i][j] = Σ x[i][k] · w[k][j]</code>. This one-output-per-thread mapping is a scalar teaching example. Real kernels can process multiple elements per thread and execute in scheduled groups.</p>` + threadGrid(false);
        info.innerHTML = `<h4 style="font-size:1.05rem">Threads</h4><div class="qa4">
          <div class="card"><span class="mini-label">What is it?</span><p>One tiny instance of a GPU program (kernel), working on one piece of the data.</p></div>
          <div class="card"><span class="mini-label">Where is it?</span><p>Created and run by the SMs, on their cores.</p></div>
          <div class="card"><span class="mini-label">What does it do?</span><p>Runs the same instructions as thousands of sibling threads, each on a different element.</p></div>
          <div class="card"><span class="mini-label">Role in LLM inference</span><p>A matrix multiply for a layer becomes a huge number of threads, one for each output element or block, so the whole layer is computed in parallel.</p></div></div>`;
        const cells = $$("#t7-threads span", vis); let on = false;
        anim = ctx.every(500, () => { on = !on; cells.forEach(c => { c.style.background = on ? "var(--compute)" : "var(--surface-3)"; }); });
      },
      warps: () => {
        vis.innerHTML = `<p style="font-size:.9rem">The SM does not schedule threads one by one. It runs them in <b>groups called warps</b> that execute the same instruction together. Here each colour is one warp of 32 threads; the 64 displayed threads form two warps.</p>` + threadGrid(true);
        info.innerHTML = `<h4 style="font-size:1.05rem">Warps</h4><div class="qa4">
          <div class="card"><span class="mini-label">What is it?</span><p>A group of threads that run together, like a row of weaving threads moving as one.</p></div>
          <div class="card"><span class="mini-label">Where is it?</span><p>Inside an SM's scheduler; it's a unit of execution, not a physical block.</p></div>
          <div class="card"><span class="mini-label">What does it do?</span><p>Lets the SM run many threads through the same instruction at once, cheaply.</p></div>
          <div class="card"><span class="mini-label">Role in LLM inference</span><p>The threads of each matrix-multiply kernel are run warp by warp across the SMs. You don't manage warps yourself; kernels and the driver do.</p></div></div>`;
        const cells = $$("#t7-threads span", vis);
        const colors = ["var(--compute)", "var(--memory)", "var(--kv)", "var(--accent)"];
        let k = 0;
        anim = ctx.every(420, () => {
          const active = k % 2;
          cells.forEach(c => { const g = +c.dataset.g; c.style.background = g === active ? colors[g % 4] : "var(--surface-3)"; });
          k++;

    };
    const pick = (k) => { stopAnim(); $$("#t7-pick .btn", root).forEach(b => b.classList.toggle("on", b.dataset.k === k)); views[k](); };
    $("#t7-pick", root).onclick = e => { const b = e.target.closest("button"); if (b) pick(b.dataset.k); };

});

/* ---------- Topic 8 ---------- */
topic({
  num: 8, title: "GPU memory hierarchy",
  question: "Why does the GPU have several kinds of memory?",
  render: () => `
    ${say(
      "GPU memory is a hierarchy because no single type of storage is both enormous and extremely fast. <b>Registers</b> hold values used by individual threads. <b>Shared memory</b> holds data that cooperating threads in a block can reuse. <b>L2</b> caches data across SMs. Large device memory holds the bulk of the model and KV cache.",
      "The practical question is: <b>can a value be used again before it has to be fetched from device memory?</b> Tiled matrix multiplication loads a tile and uses it for several outputs. Fused operations may keep an intermediate on chip rather than writing it out and immediately reading it back.",
      "The hierarchy helps explain how two kernels performing the same mathematical operation can have different speeds. One may move far fewer bytes through the slowest part of the memory path."
    )}
    ${see("How big and how fast is each level? Click a level.", `
      <div class="grid2" style="grid-template-columns:minmax(240px,1fr) minmax(260px,1.2fr);align-items:start">
        <div class="pyramid" id="t8-pyr"></div>
        <div id="t8-detail" class="stage-panel"></div>
      </div>
      <div class="scroll-x"><table class="cmp-table" id="t8-table"></table></div>
      ${note("Sizes and speeds are shown as relative orders of magnitude, not measured specs. Operations do <b>not</b> literally pass through every level in order: data moves from larger, slower memory toward smaller, faster memory near the cores when and where the kernel needs it.")}`)}
    ${see("Which levels does one decode step lean on?", `
      <div class="btn-row"><button type="button" class="btn primary" id="t8-play">▶ Walk through one decode step</button></div>
      <div class="stage-panel" id="t8-walk" style="min-height:70px"><p class="c-muted">Press play to follow a token through one layer.</p></div>`, "Watch it")}
    ${ex(`<div class="calc">A 4,096 × 4,096 BF16 matrix occupies about <b>33.6 MB</b>. A 64 × 64 tile of the same matrix occupies <b>8 KiB</b>. A kernel can stage manageable tiles locally even when the entire matrix cannot fit there. Actual tile sizes must also allow room for input tiles, accumulators and other working state.</div>`)}
    ${tech(`<ul>
      <li>Moving closer to the cores: capacity goes <b>down</b>, speed goes <b>up</b>, cost per byte goes <b>up</b>.</li>
      <li>HBM is “slow” only compared with on-chip memory. It is still much faster than CPU RAM reached over PCIe.</li>
      <li>Well-designed kernels keep hot data in fast memory as long as possible and avoid round trips to HBM (for example FlashAttention computes attention in blocks that fit in SRAM).</li>
    </ul>`)}
    ${inf(`<p>The data that dominates inference, the <b class="c-memory">weights</b> and the <b class="c-kv">KV cache</b>, is so large that it can only live in HBM. That makes the <b>HBM → compute</b> path the busiest road in LLM inference.</p>`)}
    ${check({
      q: "A 70B model's FP16 weights (about 140 GB) are needed for every token. Which level is large enough to hold them?",
      opts: ["Registers", "SRAM / shared memory", "L2 cache", "HBM"],

    })}`,
  mount(root, ctx) {
    const L = [
      { k: "Registers", size: "Tiny", sizeN: 1, speed: 100, color: "var(--kv)", width: 34, where: "Inside the processing circuits of each core.", stores: "The few values being computed this instant, plus thread bookkeeping.", when: "Every single multiply-add: the current weight element, input element and running sum.", sum: "Tiny + extremely fast" },
      { k: "SRAM / shared memory", size: "Small", sizeN: 2, speed: 85, color: "var(--accent)", width: 56, where: "On the GPU chip, beside the cores of an SM.", stores: "Blocks of data that a group of threads is working on together.", when: "Staging and reusing chunks of weights, activations or attention blocks inside fast kernels.", sum: "Small + very fast" },
      { k: "L2 cache", size: "Larger", sizeN: 3, speed: 55, color: "var(--memory)", width: 78, where: "Between on-chip memory and HBM (simplified level in this session).", stores: "Recently used or soon-needed data travelling between HBM and the cores.", when: "Buffering streams of weight and activation data headed to or from compute.", sum: "Larger + slower than on-chip" },
      { k: "HBM", size: "Huge", sizeN: 5, speed: 28, color: "#28409a", width: 100, where: "Beside the GPU chip, on the same package.", stores: "Model weights, KV cache, activations and other large data.", when: "Always: every forward pass reads weights from here, and every decode step reads (and appends to) the KV cache here.", sum: "Huge + much slower than on-chip" },
    ];
    const pyr = $("#t8-pyr", root);
    pyr.innerHTML = L.map((l, i) => `<div class="pyr-level" data-i="${i}" style="width:${l.width}%;background:${l.color}">${l.k}<small>${l.sum}</small></div>`).join("");
    const bar = (v, c) => `<div style="height:8px;border-radius:4px;background:var(--surface-3);width:120px"><div style="height:100%;width:${v}%;background:${c};border-radius:4px"></div></div>`;
    $("#t8-table", root).innerHTML = `<tr><th>Level</th><th>Relative size</th><th>Relative speed</th><th>What's stored</th></tr>` +
      L.map(l => `<tr><td><b>${l.k}</b></td><td>${bar(l.sizeN * 20, "var(--memory)")}<span class="c-muted" style="font-size:.78rem">${l.size}</span></td><td>${bar(l.speed, "var(--compute)")}</td><td>${l.stores}</td></tr>`).join("");
    const pick = (i) => {

      [1, "Blocks of weights and the token's vector are staged in <b>SRAM / shared memory</b> for the threads."],
      [0, "Individual numbers sit in <b>registers</b> while Tensor Cores multiply and add."],
      [3, "New K and V for this token are written back into the KV cache in <b>HBM</b>. Then the next layer starts, and the trip repeats ×80 layers."],
    ];
    let t = null;
    $("#t8-play", root).onclick = () => {
      if (t) ctx.stop(t);
      let k = 0;
      const stepW = () => { if (k >= walk.length) { ctx.stop(t); t = null; return; } pick(walk[k][0]); $("#t8-walk", root).innerHTML = `<div class="mini-label">Step ${k + 1} of ${walk.length}</div><p>${walk[k][1]}</p>`; k++; };
      stepW(); t = ctx.every(2200, stepW);
    };
  },
});

/* ---------- Topic 9 ---------- */
topic({
  num: 9, title: "Memory capacity vs memory bandwidth",
  question: "Is it about how much memory I have, or how fast it is?",
  render: () => `
    ${say(
      "<b>Capacity</b> answers “how much can I keep in memory?” <b>Bandwidth</b> answers “how many bytes can I transfer each second?” Both mention memory, but they solve different problems.",
      "If weights, KV and runtime buffers exceed capacity, the requested configuration cannot run entirely resident. If they fit but each token requires many bytes to be read, bandwidth can determine how quickly generation proceeds.",
      "Use the controls independently. Increasing capacity can turn an out-of-memory case into one that fits. Increasing bandwidth can shorten transfer time without changing whether the tensors fit at all."
    )}
    ${see("What limits a warehouse: its size or its road?", `
      <svg class="svg-block" viewBox="0 0 720 210" id="t9-svg" role="img" aria-label="Warehouse with road to kitchen"></svg>
      <div class="controls">
        ${slider("t9-cap", "Capacity: warehouse size (GB)", 24, 192, 8, 80)}
        ${slider("t9-bw", "Bandwidth: road speed (GB/s)", 200, 2000, 100, 1000)}
        <div class="ctl"><label>Model in the warehouse</label>${seg("t9-model", [["16", "8B FP16 (16 GB)"], ["140", "70B FP16 (140 GB)"]], "16")}</div>
      </div>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t9-fit">–</span><span class="k">does it fit? (capacity)</span></div>
        <div class="stat"><span class="v c-memory" id="t9-time">–</span><span class="k">time to read all weights once (bandwidth)</span></div>
        <div class="stat"><span class="v" id="t9-tps">–</span><span class="k">max tokens/sec at batch 1 (upper bound)</span></div>
      </div>
      <p class="c-muted" style="font-size:.82rem">${illus()} Upper bound ignores the KV cache and compute time: it only asks how often the full weights could be delivered.</p>`)}
    ${ex(`<div class="calc">Imagine two devices with identical compute and <b>80 GB</b> of memory, but bandwidths of <b>1 TB/s</b> and <b>2 TB/s</b>. Both can store the same tensor payload. Streaming 16 GB takes at least <b>16 ms</b> on the first and <b>8 ms</b> on the second. Conversely, 160 GB of required tensors fits on neither device, however high the bandwidth.</div>`)}
    ${tech(`<ul>
      <li><b>Memory capacity:</b> total bytes the GPU memory can hold (GB).</li>
      <li><b>Memory bandwidth:</b> how many bytes per second can move between memory and the compute chip (GB/s). It depends on the memory type, how many parallel connections there are, and the signalling speed.</li>
    </ul>`)}
    ${fx(["Decode tokens/sec (batch 1) ≲ memory bandwidth ÷ bytes read per token", "bytes read per token ≈ weight bytes + KV cache bytes"], "≲ means “at most about”. Real speed is lower because of compute time and overheads.")}
    ${inf(`<p>Weights live in HBM. Each decode step needs the weights of <b>every layer</b> for just one new token. So at small batch sizes, how fast HBM can deliver data, not how much it can hold, often sets the speed limit.</p>`)}
    ${check({
      q: "Two GPUs have the same memory capacity, but GPU B has 40% higher memory bandwidth. For batch-1 decode of a large dense model, which is likely faster?",
      opts: ["GPU A: capacity is what matters", "GPU B: it can deliver weights faster", "They're the same: capacity is equal", "Can't be faster: bandwidth only matters for training"],
      a: 1, why: "Capacity decides what fits. Bandwidth decides how quickly the weights reach the compute. Batch-1 decode of a large dense model is usually limited by bandwidth.",
    })}`,
  mount(root, ctx) {
    const svg = $("#t9-svg", root);
    let v = { cap: 80, bw: 1000, model: 16 }, trucks = [], spawn = 0;
    const draw = () => {
      const wW = 60 + v.cap * 1.0, fillFrac = Math.min(1, v.model / v.cap);
      const lanes = Math.max(1, Math.round(v.bw / 400));
      let s = `<rect x="10" y="${100 - wW / 3}" width="${wW}" height="${wW * 2 / 3}" rx="6" fill="var(--memory-soft)" stroke="var(--memory)" stroke-width="2"/>

        <text x="${10 + wW / 2}" y="${100 - wW / 3 - 8}" text-anchor="middle" font-size="13" font-weight="600">HBM warehouse · ${v.cap} GB</text>
        <text x="${10 + wW / 2}" y="104" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">${v.model > v.cap ? "OVERFLOW" : "weights " + v.model + " GB"}</text>`;
      const rx = 20 + wW, rw = 560 - rx, laneH = 14;
      const top = 100 - lanes * laneH / 2;
      for (let i = 0; i < lanes; i++) s += `<rect x="${rx}" y="${top + i * laneH}" width="${rw}" height="${laneH - 3}" fill="var(--surface-3)"/>`;

      s += `<g id="t9-trucks"></g>
        <rect x="570" y="50" width="140" height="100" rx="8" fill="var(--compute-soft)" stroke="var(--compute)" stroke-width="2"/>
        <text x="640" y="95" text-anchor="middle" font-size="13" font-weight="700">GPU chip</text>
        <text x="640" y="113" text-anchor="middle" font-size="11" class="muted">(compute)</text>`;
      svg.innerHTML = s;
      svg._geo = { rx, rw, top, laneH, lanes };
    };
    const stopLoop = ctx.loop((dt) => {
      const g = svg._geo; if (!g) return;
      spawn += dt * v.bw / 250;
      while (spawn > 1) { spawn -= 1; trucks.push({ x: g.rx, lane: Math.floor(Math.random() * g.lanes) }); }

      trucks = trucks.filter(t => t.x < g.rx + g.rw - 16).slice(-80);
      const tg = $("#t9-trucks", svg);

    const update = () => {

   PART 3 — Inference Performance (topics 10–18)
   ============================================================ */
part({
  num: 3, title: "Inference Performance",
  blurb: "FLOPs measure computation, bandwidth measures data movement, and arithmetic intensity connects them. This is where prefill and decode part ways.",
  story: "FLOPs measure computation → bandwidth measures data movement → <b>arithmetic intensity</b> connects them → prefill tends toward compute-bound → <b>low-batch decode tends toward memory-bandwidth-bound</b>.",
});

/* ---------- shared simplified performance model ----------
   Bottleneck model: a pass takes as long as the slower of
   (a) computing its FLOPs and (b) moving its bytes.
   Deliberately simple, for teaching only. */
const flopsPerToken = (m, ctxLen) => 2 * m.N + 4 * m.L * ctxLen * m.d;
function decodeStep(m, bpp, B, ctxLen, gpu = DEMO, kvb = 2) {
  const weights = m.N * bpp, kv = kvBytesPerToken(m, kvb) * ctxLen * B;
  const bytes = weights + kv, flops = B * flopsPerToken(m, ctxLen);
  const tm = bytes / (gpu.bwGBs * 1e9), tc = flops / gpu.flops, T = Math.max(tm, tc);
  return { weights, kv, bytes, flops, tm, tc, T, tps: B / T, perUser: 1 / T, ai: flops / bytes, mfu: tc / T, mbu: tm / T };
}
function prefillPass(m, bpp, P, B, gpu = DEMO, kvb = 2) {
  const weights = m.N * bpp;
  const flops = B * (2 * m.N * P + 2 * m.L * m.d * P * (P + 1));
  const bytes = weights + kvBytesPerToken(m, kvb) * P * B; // minimal traffic: weights + KV writes; excludes activations and attention rereads
  const tm = bytes / (gpu.bwGBs * 1e9), tc = flops / gpu.flops, T = Math.max(tm, tc);
  return { weights, bytes, flops, tm, tc, T, ai: flops / bytes, mfu: tc / T, mbu: tm / T };
}
function boundPill(tc, tm) {
  if (tm > 1.5 * tc) return `<span class="pill memory">memory-bandwidth-bound</span>`;
  if (tc > 1.5 * tm) return `<span class="pill compute">compute-bound</span>`;
  return `<span class="pill mixed">near the crossover</span>`;
}

    ${tech(`<p><b>Arithmetic intensity</b> (also called operational intensity) is the ratio of computation to data movement for a workload. It's a property of the <i>workload</i>, not the hardware. Comparing it with the hardware's ratio of compute to bandwidth tells you which will run out first.</p>`)}
    ${fx(["Arithmetic intensity = FLOPs ÷ bytes moved", "Hardware crossover ≈ peak FLOPS ÷ bandwidth (bytes/s)"], "Below the crossover: memory runs out first. Above it: compute runs out first.")}

topic({
  num: 15, title: "Why prefill is generally compute-bound",
  question: "Why does a long prompt keep the Tensor Cores busy?",
  render: () => `

      "Attention also grows with prompt length, and actual kernels move activations and intermediate data. The model below is intentionally simpler: use it to see why adding prompt positions changes the balance between maths and bytes."

      ${flow([{ t: "Many input tokens" }, { t: "Large matrix operations", c: "compute" }, { t: "Lots of computation", c: "compute" }, { t: "Tensor Cores heavily used", c: "compute" }, { t: "High arithmetic intensity", c: "compute" }, { t: "Compute-bound tendency", c: "compute" }], { id: "t15-flow" })}

    ${ex(`<div class="calc">An 8B model processing <b>2,048 prompt tokens</b> needs roughly <b>2 × 8B × 2,048 = 32.8 trillion FLOPs</b> for weight operations. At 200 TFLOP/s that is about <b>164 ms</b>. Reading 16 GB of weights at 1,000 GB/s takes 16 ms. Even before attention arithmetic, the compute time is about ten times larger.</div>`)}
    ${tech(`<p>Prefill processes all prompt tokens as one batched matrix operation per layer (plus attention over the prompt). FLOPs grow with prompt length, while the weight bytes read stay roughly fixed, so arithmetic intensity grows roughly in proportion to prompt length. Once it passes the hardware's crossover point, peak FLOPS becomes the limit.</p>`)}
    ${inf(`<p>That's why TTFT for long prompts improves with <b class="c-compute">more compute</b> (a faster GPU, FP8 kernels, splitting the work across GPUs). Very <b>short</b> prompts are an exception: with only a handful of tokens they can still sit on the memory side.</p>`)}

topic({
  num: 16, title: "Why low-batch decode is memory-bandwidth-bound",
  question: "Why does decode wait on HBM, and why does batching help?",
  render: () => `
    ${say(
      "A cached decode step processes only one new token per active request. At batch 1, a large dense model still reads its weight matrices while applying them to just one new vector. That is little arithmetic for a large weight transfer.",
      "Batching lets several requests share those weight reads. Total output tokens per second can rise because each step produces one token for several users. But a larger step has more arithmetic and more KV traffic, so <b>each user’s stream may get slower</b> even while total throughput improves.",
      "Watch the two rates separately below. Then increase context: past keys and values must be read for each request, so long contexts can erode the benefit of sharing weight reads. Decode is often memory-bound, but its balance changes with batch, context and kernels."
    )}
    ${see("Why does decode wait on HBM?", `
      <div class="grid2" style="grid-template-columns:minmax(220px,300px) 1fr">
        ${flow([{ t: "One new token", c: "kv" }, { t: "Needs model weights (all layers)", c: "memory" }, { t: "Weights reside in HBM", c: "memory" }, { t: "Large amount of data movement", c: "memory" }, { t: "Little computation per byte", c: "compute" }, { t: "Tensor Cores may be underutilized", c: "compute" }, { t: "Memory bandwidth becomes the bottleneck", c: "memory" }], { id: "t16-flow", vertical: true })}
        <div style="display:grid;gap:12px;align-content:start">
          <div class="stage-panel" id="t16-cap" style="min-height:90px"></div>
          ${big("Decode throughput at batch 1 is <b>not</b> mainly set by how many FLOPs the GPU could theoretically perform. It is often limited by <b>how quickly the GPU can move the required model data from memory to the compute hardware</b>.", "Most important idea")}
          ${note("This is a tendency, not a law: it applies most strongly to <b>large dense models at low batch size</b>. Small models, huge batches, or very long contexts shift the balance.", "Accuracy")}
        </div>
      </div>`)}
    ${see("Why does batching help?", `
      <div class="controls">
        <div class="ctl"><label>Model (FP16)</label>${seg("t16-model", [["8B", "8B-class"], ["70B", "70B-class*"]], "8B")}</div>
        ${slider("t16-b", "Batch size (users decoding together)", 0, 8, 1, 0)}
        ${slider("t16-ctx", "Context per user (tokens)", 0, 4, 1, 2)}
      </div>
      <div class="grid2">
        <div style="display:grid;gap:8px">
          ${meter("Compute fraction of toy roofline (MFU-like)", "compute", "t16-cu")}
          ${meter("Bandwidth utilization (MBU-like)", "memory", "t16-mu")}
          <div class="mini-label">Bytes read per step</div>
          <div class="stack" id="t16-stack"></div>
        </div>
        <div class="stat-row">
          <div class="stat"><span class="v" id="t16-tps">–</span><span class="k">total tokens / sec</span></div>
          <div class="stat"><span class="v" id="t16-pu">–</span><span class="k">tokens / sec per user</span></div>
          <div class="stat"><span class="v" id="t16-ai">–</span><span class="k">FLOPs per byte</span></div>
          <div class="stat"><span class="v" id="t16-bd">–</span><span class="k">diagnosis</span></div>
        </div>
      </div>
      <svg class="svg-block" viewBox="0 0 700 200" id="t16-chart"></svg>
      <p class="c-muted" style="font-size:.82rem">Example GPU (peak ${words(DEMO.flops)} FLOPS, ${DEMO.bwGBs.toLocaleString("en-US")} GB/s). *We pretend the 70B-class model fits, to show the maths. Red area = KV cache no longer fits in 80 GB. ${illus("Simplified model · illustrative")}</p>`, "Try batching")}
    ${ex(`<div class="calc">A batch-1 step taking <b>20 ms</b> produces 50 output tokens/s for its user and 50 total. Suppose a batch of eight takes <b>25 ms</b>. Each user now gets <b>40 tokens/s</b>, but total throughput is <b>8 ÷ 0.025 = 320 tokens/s</b>. “Faster inference” needs a metric: single-user speed and server throughput are different objectives.</div>`)}
    ${tech(`<ul>
      <li>Per decode step: bytes moved ≈ weight bytes + (KV cache bytes per token × context × batch); FLOPs ≈ batch × (2N + 4·L·context·d).</li>
      <li>At batch 1, FLOPs/byte ≈ 1, far below the hardware crossover (peak FLOPS ÷ bandwidth), so bandwidth limits speed.</li>
      <li>Batching multiplies FLOPs by B while weight bytes stay fixed, raising arithmetic intensity and throughput. Per-user speed slowly drops as KV reads and compute grow.</li>
    </ul>`)}
    ${inf(`<p>This single idea explains a lot of real serving practice: <b>batching</b> (and continuous batching), <b>quantizing weights</b> (fewer bytes to move), <b>GQA/MQA</b> (smaller KV cache), and why GPUs with <b>faster HBM</b> speed up decode even when compute is unchanged.</p>`)}
    ${check({
      q: "Why does batching 32 users together raise total decode throughput so much?",
      opts: ["Each user's weights are read separately, but faster", "The weights are read once per step and shared by all 32 tokens, so compute does more work per byte moved", "Batching reduces the model size", "Batching skips the KV cache"],

    })}`,

      "…but to produce it, the token passes through <b>every layer</b>, and each layer needs its weight matrices.",
      "Those weights live in <b class='c-memory'>HBM</b>, not on the chip.",
      "So for each token, a model-sized amount of data (140 GB for 70B FP16) has to flow toward the chip.",
      "The maths for one token is small: about 1 FLOP for every byte moved.",
      "The Tensor Cores finish their share quickly and <b>sit idle</b> between deliveries.",
      "Result: the speed of the <b class='c-memory'>HBM → compute</b> path sets tokens per second.",
    ];
    let k = 0;

      for (let e = 0; e <= 8; e++) s += `<text x="${X(e)}" y="186" text-anchor="middle" font-size="11" class="muted">${Math.pow(2, e)}</text>`;

      s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map(p => `${X(p.e)},${Y(p.tps)}`).join(" ")}"/>`;

      s += `<circle cx="${X(Math.log2(Bcur))}" cy="${Y(rc.tps)}" r="7" fill="var(--compute)" stroke="var(--surface)" stroke-width="2"/>`;
      $("#t16-chart", root).innerHTML = s;
    };
    const run = bindSliders(root, { "t16-b": x => Math.pow(2, x), "t16-ctx": x => ctxs[x].toLocaleString("en-US") }, v => {
      const m = MODELS[model], B = Math.pow(2, v["t16-b"]), cl = ctxs[v["t16-ctx"]];

      $("#t16-stack", root).innerHTML = `<span class="s-w" style="width:${wp}%">${wp > 22 ? `weights ${gb(r.weights)}` : ""}</span><span class="s-kv" style="width:${100 - wp}%">${100 - wp > 22 ? `KV ${gb(r.kv)}` : ""}</span>`;
      chart(m, cl, B);
    });
    bindSeg(root, "t16-model", k2 => { model = k2; run(); });
  },
});

/* ---------- tiny floating-point simulator ---------- */
function fpSpec(E, M, fn = false) {
  const bias = Math.pow(2, E - 1) - 1;
  const topExp = fn ? Math.pow(2, E) - 1 : Math.pow(2, E) - 2;
  const topMant = fn ? Math.pow(2, M) - 2 : Math.pow(2, M) - 1;
  return { E, M, fn, bias, topExp, topMant, max: Math.pow(2, topExp - bias) * (1 + topMant / Math.pow(2, M)), minSub: Math.pow(2, 1 - bias - M) };
}
const FP = {
  FP32: fpSpec(8, 23), FP16: fpSpec(5, 10), BF16: fpSpec(8, 7), E4M3: fpSpec(4, 3, true), E5M2: fpSpec(5, 2),
};
function encodeFP(x, f) {
  const sign = x < 0 || Object.is(x, -0) ? 1 : 0, a = Math.abs(x);
  if (a === 0) return { v: 0, status: "exact", s: sign, e: 0, m: 0 };
  let e = Math.floor(Math.log2(a));
  if (e < 1 - f.bias) e = 1 - f.bias;
  const step = Math.pow(2, e - f.M);
  const scaled = a / step, lo = Math.floor(scaled);
  const q = (scaled - lo === 0.5 ? lo + (lo % 2) : Math.round(scaled)) * step; // nearest, ties to even
  if (q > f.max) return f.fn
    ? { v: sign ? -f.max : f.max, status: "saturated", s: sign, e: f.topExp, m: f.topMant }
    : { v: sign ? -Infinity : Infinity, status: "overflow", s: sign, e: Math.pow(2, f.E) - 1, m: 0 };
  if (q === 0) return { v: 0, status: "underflow", s: sign, e: 0, m: 0 };
  const e2 = Math.floor(Math.log2(q));
  let eField, mField;
  if (e2 < 1 - f.bias) { eField = 0; mField = Math.round(q / f.minSub); }
  else { eField = e2 + f.bias; mField = Math.round((q / Math.pow(2, e2) - 1) * Math.pow(2, f.M)); }
  return { v: sign ? -q : q, status: q === a ? "exact" : "rounded", s: sign, e: eField, m: mField };
}
function fpValues(f) {
  const out = [];
  for (let e = 0; e <= f.topExp; e++) {
    const mm = e === f.topExp ? f.topMant : Math.pow(2, f.M) - 1;
    for (let m = 0; m <= mm; m++) out.push(e === 0 ? m * f.minSub : Math.pow(2, e - f.bias) * (1 + m / Math.pow(2, f.M)));
  }
  return out.filter(v => v > 0);
}
function bitStrip(name, f, enc) {
  const bin = (v, n) => v.toString(2).padStart(n, "0");
  const s = enc ? String(enc.s) : "±", e = enc ? bin(enc.e, f.E) : "e".repeat(f.E), m = enc ? bin(enc.m, f.M) : "m".repeat(f.M);
  const cell = (ch, bg, fg) => `<span style="display:inline-grid;place-items:center;min-width:${f.M > 12 ? 12 : 18}px;height:22px;background:${bg};color:${fg};font-family:var(--f-mono);font-size:.7rem;border-radius:2px">${ch}</span>`;
  return `<div style="display:flex;gap:2px;flex-wrap:nowrap;align-items:center"><span class="mono" style="width:52px;font-size:.8rem;font-weight:600">${name}</span>
    ${cell(s, "var(--kv)", "#fff")}${e.split("").map(c => cell(c, "var(--memory)", "#fff")).join("")}${m.split("").map(c => cell(c, "var(--compute-soft)", "var(--compute)")).join("")}</div>`;
}
function showNum(v) {
  if (!isFinite(v)) return v > 0 ? "+∞ (overflow)" : "−∞ (overflow)";
  if (v === 0) return "0";
  const a = Math.abs(v);
  return a >= 1e5 || a < 1e-3 ? v.toExponential(4) : String(+v.toPrecision(7));
}

const REQ_COLORS = ["#3559d1", "#cf6a0b", "#8e44c2", "#0a7470", "#b83280", "#2b8543", "#a8750a", "#5a67d8", "#c13535", "#2a7fa8"];

/* ---------- Topic 26 ---------- */
topic({
  num: 26, title: "Why multiple GPUs?",
  question: "When do I need more than one GPU?",
  render: () => `
    ${say(
      "Multiple GPUs can solve different problems. You may need to <b>split a model that does not fit</b>, <b>serve more independent requests</b>, or <b>reduce the processing time of one request</b>. Those are different objectives and can call for different arrangements.",
      "The memory in several GPUs does not automatically become one pool that an unchanged program can use. The serving engine must decide which tensors live on which device and how intermediate results are exchanged.",
      "Before choosing a strategy, state the problem. If one model copy fits but requests queue, replicas may help. If one copy does not fit, its tensors or layers must be split or reduced. The following topics show how those choices differ."
    )}
    ${see("How many 80 GB GPUs does my deployment need?", `
      <div class="controls">
        <div class="ctl"><label>Model</label>${seg("t26-m", [["8B", "8B"], ["70B", "70B"], ["405B", "405B"]], "70B")}</div>
        <div class="ctl"><label>Precision</label>${seg("t26-p", [["2", "BF16"], ["1", "FP8"], ["0.5", "INT4"]], "2")}</div>
        ${slider("t26-u", "Concurrent users", 1, 128, 1, 16)}
        ${slider("t26-c", "Context per user (tokens)", 0, 5, 1, 2)}
      </div>
      <div class="stack" id="t26-stack"></div>
      <div id="t26-gpus" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t26-w">–</span><span class="k">weights</span></div>
        <div class="stat"><span class="v c-kv" id="t26-kv">–</span><span class="k">KV cache (all users)</span></div>
        <div class="stat"><span class="v" id="t26-n">–</span><span class="k">GPUs needed just for memory</span></div>
      </div>
      <p class="c-muted" style="font-size:.82rem">KV cache kept in 16-bit; 10% memory held back for activations and buffers. Throughput needs may require even more GPUs. ${illus("Approximate")}</p>`)}
    ${see("What are the four reasons?", `<div class="grid2">
      <div class="card"><h4>1. The model does not fit</h4><p>405B in BF16 is ~810 GB of weights. No single GPU holds that.</p></div>
      <div class="card"><h4>2. The KV cache does not fit</h4><p>Many users × long contexts can need more memory than the weights.</p></div>
      <div class="card"><h4>3. Need more throughput</h4><p>More users than one GPU can serve at acceptable speed.</p></div>
      <div class="card"><h4>4. Need more compute or bandwidth per token</h4><p>Splitting a model lets several GPUs share each token's work, lowering latency.</p></div></div>`, "Reasons")}
    ${inf(`<p>How you split depends on the reason: copy the whole model (<b>data parallel</b>) for throughput, split matrices (<b>tensor parallel</b>) or layers (<b>pipeline parallel</b>) when it doesn't fit, and spread experts (<b>expert parallel</b>) for MoE models.</p>`)}
    ${ex(`<div class="calc">Two 80 GB GPUs provide <b>160 GB total physical memory</b>. A 140 GB model could in principle split its raw weights across them, but needs a supported partition and room for other tensors. Running two complete replicas instead would require <b>140 GB on each GPU</b>, which does not solve the fitting problem.</div>`)}
    ${check({
      q: "An 8B model fits comfortably on one GPU, but you have 10× more users than it can serve. What is the simplest scaling approach?",
      opts: ["Split its layers across GPUs", "Run several full copies of the model on separate GPUs", "Quantize to 2 bits", "Use a bigger CPU"],
      a: 1, why: "The model already fits, so the need is throughput. Independent copies (data parallelism) scale throughput with almost no communication.",
    })}`,
  mount(root, ctx) {
    const ctxs = [1024, 2048, 4096, 8192, 32768, 131072];
    let model = "70B", bpp = 2;
    const run = bindSliders(root, { "t26-u": x => x, "t26-c": x => ctxs[x].toLocaleString("en-US") }, v => {
      const m = MODELS[model];
      const w = m.N * bpp, kv = kvBytesPerToken(m, 2) * ctxs[v["t26-c"]] * v["t26-u"], total = w + kv;
      const usable = DEMO.hbmGB * 1e9 * 0.9, n = Math.ceil(total / usable);

      $("#t26-n", root).innerHTML = `<span class="${n > 1 ? "c-bad" : "c-ok"}">${n}</span>`;
      const wp = w / total * 100;
      $("#t26-stack", root).innerHTML = `<span class="s-w" style="width:${wp}%">${wp > 18 ? "weights" : ""}</span><span class="s-kv" style="width:${100 - wp}%">${100 - wp > 18 ? "KV cache" : ""}</span>`;
      const shown = Math.min(n, 48);
      $("#t26-gpus", root).innerHTML = Array.from({ length: shown }, (_, i) => {
        const fill = Math.min(1, (total - i * usable) / usable);

          <div style="position:absolute;left:0;right:0;bottom:0;height:${fill * 100}%;background:var(--memory);opacity:.6"></div>
          <span style="position:absolute;inset:0;display:grid;place-items:center;font-size:.66rem;font-weight:700">GPU ${i + 1}</span></div>`;
      }).join("") + (n > shown ? `<span class="c-muted">+${n - shown} more</span>` : "");
    });
    bindSeg(root, "t26-m", k => { model = k; run(); });
    bindSeg(root, "t26-p", k => { bpp = +k; run(); });
  },
});

topic({
  num: 27, title: "Data parallelism",
  question: "What if I just run more copies of the model?",
  render: () => `
    ${say(
      "<b>Data parallelism</b> for serving means running several complete model replicas and sending different requests to different replicas. Each replica carries out a full forward pass for its assigned requests.",
      "This is useful when one model copy already fits and you need more total request capacity. It does not require the replicas to combine every layer’s result for an ordinary independent inference request.",
      "The tradeoff is duplicated weights and separate request/cache state. Adding replicas can reduce queueing and raise aggregate throughput, but it does not automatically divide the GPU processing time of one request. Watch how requests are assigned below."
    )}
    ${see("What happens to the queue as I add replicas?", `
      <div class="controls">
        ${slider("t27-r", "Model replicas (GPUs)", 1, 4, 1, 1)}
        ${slider("t27-a", "Incoming requests per second", 1, 12, 1, 6)}
      </div>
      <svg class="svg-block" viewBox="0 0 720 260" id="t27-svg"></svg>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t27-cap">–</span><span class="k">capacity (requests/sec)</span></div>
        <div class="stat"><span class="v" id="t27-q">–</span><span class="k">waiting in queue</span></div>
        <div class="stat"><span class="v" id="t27-st">–</span><span class="k">status</span></div>
      </div>
      <p class="c-muted" style="font-size:.82rem">Each replica handles 3 requests/sec in this toy. ${illus()}</p>`)}
    ${ex(`<div class="calc">If one replica sustains <b>100 output tokens/s</b> at an acceptable latency, four replicas may approach <b>400 total</b> when load is balanced and other resources keep up. A request sent to one replica still runs on that replica. The four devices do not jointly produce each token of that request.</div>`)}
    ${tech(`<ul>
      <li>Each replica holds full weights and its own KV cache. A load balancer routes requests.</li>
      <li>Throughput scales almost linearly with replicas; <b>per-token latency does not improve</b>, because each token is still produced by one GPU.</li>
      <li>Only works if the model fits on one GPU (or one group of GPUs, when combined with other methods).</li>
    </ul>`)}
    ${inf(`<p>Useful when the model fits and you need more users served. It does nothing for a model that doesn't fit, and nothing for batch-1 latency.</p>`)}
    ${check({
      q: "What does data parallelism NOT improve?",
      opts: ["Total requests served per second", "The time to generate each token for a single request", "Ability to handle traffic spikes", "Fault tolerance"],
      a: 1, why: "Each request still runs on a single copy, so its per-token speed is unchanged. Data parallelism adds throughput, not per-request speed.",
    })}`,
  mount(root, ctx) {
    let R = 1, A = 6, queue = 0, acc = 0, dots = [], served = [];
    const svg = $("#t27-svg", root), per = 3;
    const draw = () => {
      let s = `<rect x="10" y="100" width="130" height="60" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>
        <text x="75" y="95" text-anchor="middle" font-size="12" font-weight="600">Request queue</text>`;
      const qShow = Math.min(queue, 24);
      for (let i = 0; i < qShow; i++) s += `<circle cx="${22 + (i % 8) * 15}" cy="${113 + Math.floor(i / 8) * 16}" r="5" fill="var(--accent)"/>`;
      if (queue > 24) s += `<text x="75" y="178" text-anchor="middle" font-size="11" style="fill:var(--bad)">+${Math.round(queue - 24)} more</text>`;
      s += `<rect x="170" y="110" width="80" height="40" rx="6" fill="var(--surface)" stroke="var(--ink)"/><text x="210" y="134" text-anchor="middle" font-size="11" font-weight="600">router</text>`;
      for (let i = 0; i < 4; i++) {
        const y = 20 + i * 60, on = i < R;
        s += `<line x1="250" y1="130" x2="360" y2="${y + 24}" stroke="${on ? "var(--line)" : "transparent"}" stroke-width="2"/>
          <rect x="360" y="${y}" width="230" height="48" rx="8" fill="${on ? "var(--surface)" : "transparent"}" stroke="${on ? "var(--ink)" : "var(--line)"}" stroke-dasharray="${on ? "0" : "4 4"}" stroke-width="1.5"/>
          <text x="375" y="${y + 20}" font-size="12" font-weight="700" ${on ? "" : "class='muted'"}>GPU ${i + 1}</text>
          <text x="375" y="${y + 38}" font-size="11" class="muted">${on ? "full model copy + own KV cache" : "not in use"}</text>
          ${on ? `<rect x="540" y="${y + 10}" width="40" height="28" rx="4" fill="var(--memory)" opacity=".7"/><text x="560" y="${y + 29}" text-anchor="middle" font-size="9" style="fill:#fff" font-weight="700">model</text>` : ""}`;
      }
      dots.forEach(d => s += `<circle cx="${d.x}" cy="${d.y}" r="5" fill="var(--accent)"/>`);
      s += `<text x="660" y="130" text-anchor="middle" font-size="12" font-weight="600">served</text><text x="660" y="150" text-anchor="middle" font-size="18" font-weight="700" style="fill:var(--ok)">${served.length}</text>`;
      svg.innerHTML = s;
    };
    bindSliders(root, { "t27-r": x => x, "t27-a": x => x }, v => { R = v["t27-r"]; A = v["t27-a"]; });
    let t = 0, srvAcc = 0;
    ctx.loop(dt => {
      dt = Math.min(dt, .1); t += dt;
      acc += dt * A; while (acc >= 1) { acc -= 1; queue++; }
      srvAcc += dt * R * per;
      while (srvAcc >= 1 && queue >= 1) {
        srvAcc -= 1; queue--;
        const g = Math.floor(Math.random() * R);
        dots.push({ x: 250, y: 130, tx: 590, ty: 44 + g * 60, p: 0 });
      }

      dots = dots.filter(d => { if (d.p >= 1) { served.push(1); return false; } return true; });
      if (served.length > 999) served = [];
      const cap = R * per;

const CB_REQS = [
  { id: "A", arr: 0, len: 8 }, { id: "B", arr: 0, len: 3 }, { id: "C", arr: 0, len: 5 }, { id: "D", arr: 1, len: 4 },
  { id: "E", arr: 2, len: 6 }, { id: "F", arr: 3, len: 2 }, { id: "G", arr: 4, len: 5 }, { id: "H", arr: 6, len: 3 },
];
function simulateBatching(mode, slots = 3) {
  const grid = Array.from({ length: slots }, () => []), running = new Array(slots).fill(null), queue = [], finish = {};
  let t = 0, wasted = 0;
  while (Object.keys(finish).length < CB_REQS.length && t < 60) {
    CB_REQS.filter(r => r.arr === t).forEach(r => queue.push({ ...r, left: r.len }));
    if (mode === "static") {
      if (running.every(x => !x)) for (let s = 0; s < slots && queue.length; s++) running[s] = queue.shift();
    } else {
      for (let s = 0; s < slots && queue.length; s++) if (!running[s]) running[s] = queue.shift();
    }
    for (let s = 0; s < slots; s++) {
      const r = running[s];
      if (r) { grid[s][t] = r.id; r.left--; if (r.left === 0) { finish[r.id] = t + 1; running[s] = null; } }
      else { grid[s][t] = null; if (queue.length) wasted++; }
    }
    t++;
  }
  const avg = CB_REQS.reduce((a, r) => a + (finish[r.id] - r.arr), 0) / CB_REQS.length;
  return { grid, T: t, avg, wasted };
}

topic({
  num: 35, title: "KV cache optimizations: paged KV cache",
  question: "Why does KV cache memory get wasted, and how do we stop it?",
  render: () => `
    ${say(
      "A request’s KV cache grows as more tokens are processed. Reserving one large contiguous region for its maximum possible length can waste memory when the actual response is much shorter. Finding large contiguous free regions can also become difficult as requests come and go.",
      "<b>Paged KV allocation</b> stores the sequence in fixed-size blocks and uses a table to map logical token positions to physical blocks. A sequence does not need to occupy adjacent physical memory, and more blocks can be allocated as it grows.",
      "This reduces allocation waste and supports useful sharing patterns. It does not make a key or value smaller: dtype and attention architecture determine that payload. Use the allocation animation to distinguish live data, reserved space and genuinely free space."
    )}
    ${see("Same events, two memory managers: where does space get wasted?", `
      <div class="btn-row">
        <button type="button" class="btn" id="t35-back">← Back</button>
        <button type="button" class="btn primary" id="t35-next">Next event →</button>
        <button type="button" class="btn" id="t35-reset">Reset</button>
      </div>
      <div class="stage-panel" id="t35-event" style="min-height:56px"></div>
      <div class="grid2">
        <div style="display:grid;gap:8px"><h4>Contiguous reservation</h4><div class="blocks" id="t35-naive"></div><div class="stat-row" id="t35-ns"></div></div>
        <div style="display:grid;gap:8px"><h4>Paged KV cache</h4><div class="blocks" id="t35-paged"></div><div class="stat-row" id="t35-ps"></div><div id="t35-table" class="mono" style="font-size:.78rem"></div></div>
      </div>
      <div class="btn-row" style="gap:14px;font-size:.8rem"><span><span class="pill" style="background:var(--memory);color:#fff">A</span> block holding real KV data</span><span><span class="pill bad">▨</span> reserved but empty (wasted)</span><span><span class="pill" style="background:var(--surface-3)">&nbsp;</span> free</span></div>`)}
    ${ex(`<div class="calc">With blocks of <b>16 token positions</b>, a request containing 70 cached tokens needs <b>five blocks</b>, enough for 80 positions. Ten positions in its final block are unused. That is different from reserving a contiguous region for an entire 4,096-token maximum in advance. Paging limits this kind of waste, but does not eliminate every unused byte.</div>`)}
    ${tech(`<ul>
      <li><b>Internal fragmentation:</b> memory reserved for a request but not used (over-reserving for max length).</li>
      <li><b>External fragmentation:</b> free memory broken into gaps too small for a new contiguous reservation.</li>
      <li><b>Paged KV cache:</b> fixed-size KV blocks (e.g. 16 tokens each), allocated on demand, mapped by a per-request block table; waste is limited to the last, partly-filled block.</li>
      <li>Blocks can be <b>shared</b> between requests (prefix caching, parallel sampling) with copy-on-write, and freed or evicted cleanly.</li>
    </ul>`)}

      opts: ["It compresses the KV cache to 1 bit", "Its blocks don't need to be next to each other, and it only allocates what is actually used", "It moves the KV cache to disk", "It deletes old requests"],
      a: 1, why: "Paging avoids both over-reservation and the need for one continuous gap, so scattered free blocks are still usable.",
    })}`,
  mount(root, ctx) {
    const TOTAL = 40;
    const colors = { A: REQ_COLORS[0], B: REQ_COLORS[1], C: REQ_COLORS[2], D: REQ_COLORS[3] };
    const events = [
      { txt: "Start: GPU KV memory is empty. 40 blocks.", fn: () => { } },
      { txt: "Request <b>A</b> arrives. Could grow to 10 blocks; right now needs 2.", fn: s => add(s, "A", 10, 2) },

      { txt: "Request <b>A</b> finishes and frees its memory.", fn: s => free(s, "A") },
      { txt: "Request <b>D</b> arrives. Could grow to 14 blocks; needs 3.", fn: s => add(s, "D", 14, 3) },
    ];
    const fresh = () => ({ naive: new Array(TOTAL).fill(null), paged: new Array(TOTAL).fill(null), res: {}, table: {}, rejected: [] });
    function add(s, id, max, need) {
      let start = -1, run = 0;
      for (let i = 0; i < TOTAL; i++) { run = s.naive[i] ? 0 : run + 1; if (run === max) { start = i - max + 1; break; } }
      if (start >= 0) { s.res[id] = { start, max, used: need }; for (let i = 0; i < max; i++) s.naive[start + i] = { id, used: i < need }; }
      else s.rejected.push(id);
      s.table[id] = [];
      grow(s, id, need, true);
    }
    function grow(s, id, need, pagedOnly) {
      if (!pagedOnly && s.res[id]) { s.res[id].used = need; for (let i = 0; i < s.res[id].max; i++) s.naive[s.res[id].start + i] = { id, used: i < need }; }
      while (s.table[id].length < need) { const f = s.paged.findIndex(x => !x); if (f < 0) break; s.paged[f] = id; s.table[id].push(f); }
    }
    function free(s, id) {
      if (s.res[id]) { for (let i = 0; i < s.res[id].max; i++) s.naive[s.res[id].start + i] = null; delete s.res[id]; }
      s.table[id].forEach(b => s.paged[b] = null); delete s.table[id];
    }
    let step = 0;
    const draw = () => {
      const s = fresh(); for (let i = 0; i <= step; i++) events[i].fn(s);
      $("#t35-event", root).innerHTML = `<div class="mini-label">Event ${step + 1} of ${events.length}</div><p>${events[step].txt}</p>`;
      $("#t35-naive", root).innerHTML = s.naive.map(b => !b ? `<i></i>` : b.used ? `<i style="background:${colors[b.id]}">${b.id}</i>` : `<i class="reserved">${b.id}</i>`).join("");
      $("#t35-paged", root).innerHTML = s.paged.map(b => b ? `<i style="background:${colors[b]}">${b}</i>` : `<i></i>`).join("");
      const nUsed = s.naive.filter(b => b && b.used).length, nRes = s.naive.filter(b => b && !b.used).length, nFree = TOTAL - nUsed - nRes;
      let big = 0, run = 0; s.naive.forEach(b => { run = b ? 0 : run + 1; big = Math.max(big, run); });
      const pUsed = s.paged.filter(Boolean).length;
      const rej = s.rejected.length ? `<div class="stat"><span class="v c-bad">${s.rejected.join(", ")} rejected</span><span class="k">no continuous gap big enough</span></div>` : "";
      $("#t35-ns", root).innerHTML = `<div class="stat"><span class="v">${nUsed}</span><span class="k">blocks with data</span></div><div class="stat"><span class="v c-bad">${nRes}</span><span class="k">reserved, empty</span></div><div class="stat"><span class="v">${nFree} (largest gap ${big})</span><span class="k">free</span></div>${rej}`;
      $("#t35-ps", root).innerHTML = `<div class="stat"><span class="v">${pUsed}</span><span class="k">blocks with data</span></div><div class="stat"><span class="v c-ok">0</span><span class="k">reserved, empty</span></div><div class="stat"><span class="v">${TOTAL - pUsed}</span><span class="k">free (all usable)</span></div>`;
      $("#t35-table", root).innerHTML = Object.keys(s.table).length ? `<div class="mini-label" style="margin-bottom:4px">Block table</div>` + Object.entries(s.table).map(([id, bl]) => `<div><b style="color:${colors[id]}">${id}</b>: logical 0…${bl.length - 1} → physical [${bl.join(", ")}]</div>`).join("") : "";
      $("#t35-back", root).disabled = step === 0; $("#t35-next", root).disabled = step === events.length - 1;
    };
    $("#t35-next", root).onclick = () => { step = Math.min(step + 1, events.length - 1); draw(); };
    $("#t35-back", root).onclick = () => { step = Math.max(step - 1, 0); draw(); };
    $("#t35-reset", root).onclick = () => { step = 0; draw(); };
    draw();
  },
});

topic({
  num: null, title: "Inference simulator",
  question: "For my setup, what fills the GPU, and what is it waiting on?",
  render: () => `
    ${say(
      "Start with a deployment question: <b>can the requested work fit, and which resource would limit its speed?</b> The controls below combine the model, numeric formats, prompt length, output length, active requests and number of GPUs.",
      "First read the memory budget: weights, KV and temporary storage. Then compare the compute and memory time estimates for prefill and decode. Change one control at a time so the reason for a change stays visible.",
      "Weight precision and KV precision are independent. Increasing the GPU count assumes a balanced supported partition with an illustrative scaling factor. The displayed times omit queueing and other runtime costs; they explain the model’s assumptions rather than predict a production benchmark."
    )}
    ${tech("A <b>simplified analytical model</b>, not a production performance predictor. It uses an imaginary GPU (80 GB HBM, 1,000 GB/s bandwidth, 200 trillion FLOPS peak), the rough formulas from Part 3, and assumes tensor parallelism across GPUs with a fixed illustrative scaling factor. It assumes even sharding of weights and KV heads (the presets have 8 KV heads). Weight precision and KV precision are independent. Peak compute stays fixed across weight formats; this isolates byte savings rather than simulating native FP8/INT8 kernel speedups. Prefill includes weights and KV writes but omits activation traffic and attention rereads. Capacity reserves 5% weight overhead and 2 GB/GPU for buffers; these are assumptions, not guarantees. Times omit queues, network, launch overhead and detailed collectives. Use it to reason about <b>directions and bottlenecks</b>, not exact numbers.", "How the estimates are calculated")}
    <div class="viz">
      <div class="controls">
        <div class="ctl"><label>Model size</label>${seg("cs-model", [["8B", "8B"], ["70B", "70B"], ["405B", "405B"]], "70B")}</div>
        <div class="ctl"><label>Weight precision</label>${seg("cs-prec", [["BF16", "BF16"], ["FP8", "FP8"], ["INT8", "INT8"], ["INT4", "INT4"]], "BF16")}</div>
        <div class="ctl"><label>Number of GPUs</label>${seg("cs-gpus", [["1", "1"], ["2", "2"], ["4", "4"], ["8", "8"]], "2")}</div>
        <div class="ctl"><label>KV cache precision (independent)</label>${seg("cs-kv", [["2", "BF16 · 2 bytes"], ["1", "FP8 · 1 byte"]], "2")}</div>
        ${slider("cs-prompt", "Prompt length (tokens)", 5, 15, 1, 11)}
        ${slider("cs-out", "Output length (tokens)", 4, 12, 1, 9)}
        ${slider("cs-batch", "Batch size (concurrent requests)", 0, 8, 1, 0)}
      </div>
    </div>
    <div class="grid2">
      <div class="viz">
        <div class="viz-q">Where do the weights and KV cache live?</div>
        <div id="cs-fit"></div>
        <div class="stack" id="cs-stack" style="height:40px"></div>
        <div id="cs-gpu-row" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="viz">
        <div class="viz-q">What happens for each request?</div>
        <div class="btn-row">${seg("cs-phase", [["prefill", "Prefill"], ["decode", "Decode"]], "prefill")}</div>
        <div id="cs-flow"></div>
      </div>
    </div>
    <div class="grid2">
      <div class="viz">
        <div class="viz-q">Prefill: is it waiting on compute or memory?</div>

      </div>
      <div class="viz">
        <div class="viz-q">Decode: is it waiting on compute or memory?</div>
        <div id="cs-dec"></div>
      </div>
    </div>
    <div class="grid2">
      <div class="viz"><div class="viz-q">Where do both phases sit on the roofline?</div><svg class="svg-block" viewBox="0 0 460 260" id="cs-roof"></svg></div>
      <div class="viz"><div class="viz-q">What could I try next?</div><div id="cs-tips" style="display:grid;gap:8px"></div></div>
    </div>
    ${check({
      q: "In the simulator, set 70B, BF16, 2 GPUs, batch 1. Then switch to INT4. Which phase speeds up the most, and why?",
      opts: ["Prefill, because INT4 adds compute", "Decode, because there are 4× fewer weight bytes to move per token", "Neither changes", "Both slow down"],
      a: 1, why: "Batch-1 decode is memory-bandwidth-bound, so fewer bytes per step speeds it up directly. Prefill is compute-bound and weight-only INT4 doesn't reduce its FLOPs.",
    })}`,
  mount(root, ctx) {
    const BPP = { BF16: 2, FP8: 1, INT8: 1, INT4: 0.5 };
    const EFF = { 1: 1, 2: 0.9, 4: 0.85, 8: 0.8 };
    let phase = "prefill", flowStep = 0;
    const flows = {
      prefill: [{ t: "Model weights", c: "memory" }, { t: "GPU HBM", c: "memory" }, { t: "Prompt tokens" }, { t: "Prefill (all tokens at once)", c: "compute" }, { t: "KV cache written", c: "kv" }, { t: "First token" }],
      decode: [{ t: "Last token" }, { t: "Read weights + KV cache from HBM", c: "memory" }, { t: "Tensor Cores", c: "compute" }, { t: "Next token" }, { t: "Append K/V to cache", c: "kv" }, { t: "Repeat" }],

    const drawFlow = () => { $("#cs-flow", root).innerHTML = flow(flows[phase], { vertical: true, id: "cs-flow-chain" }); };
    bindSeg(root, "cs-phase", p => { phase = p; flowStep = 0; drawFlow(); });
    drawFlow();
    ctx.every(750, () => setFlow($("#cs-flow-chain", root), flowStep++ % flows[phase].length));

    let sel = { model: "70B", prec: "BF16", gpus: 2, kvb: 2 };
    const pill = (tc, tm) => boundPill(tc, tm);
    const ms = s => s < 1 ? `${fmt(s * 1000, 0)} ms` : `${fmt(s, 2)} s`;
    const run = bindSliders(root, {
      "cs-prompt": x => Math.pow(2, x).toLocaleString("en-US"),
      "cs-out": x => Math.pow(2, x).toLocaleString("en-US"),
      "cs-batch": x => Math.pow(2, x),
    }, v => {
      const m = MODELS[sel.model], bpp = BPP[sel.prec], G = +sel.gpus;
      const P = Math.pow(2, v["cs-prompt"]), O = Math.pow(2, v["cs-out"]), B = Math.pow(2, v["cs-batch"]);
      const kvb = +sel.kvb;
      const gpu = { bwGBs: DEMO.bwGBs * G * EFF[G], flops: DEMO.flops * G * EFF[G], hbmGB: DEMO.hbmGB * G };

      // memory
      const weights = m.N * bpp * 1.05, kv = kvBytesPerToken(m, kvb) * (P + O) * B, act = 2e9 * G;
      const cap = gpu.hbmGB * 1e9, used = weights + kv + act, fits = used <= cap;
      const scale = Math.max(cap, used);
      $("#cs-stack", root).innerHTML = `<span class="s-w" style="width:${weights / scale * 100}%">${weights / scale > .15 ? `weights ${gb(weights)}` : ""}</span>
        <span class="s-kv" style="width:${kv / scale * 100}%">${kv / scale > .15 ? `KV ${gb(kv)}` : ""}</span>
        <span class="s-act" style="width:${act / scale * 100}%"></span>
        <span class="s-free" style="width:${Math.max(0, cap - used) / scale * 100}%">${(cap - used) / scale > .15 ? "free" : ""}</span>
        <div class="cap-line" style="left:calc(${cap / scale * 100}% - 2px)"></div>`;
      $("#cs-fit", root).innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${fits ? `<span class="pill ok">fits</span>` : `<span class="pill bad">does not fit</span>`}
        <span class="c-muted" style="font-size:.85rem">${gb(used)} needed of ${gb(cap)} (${G} × 80 GB). Weights ${gb(weights)} · KV cache ${gb(kv)} · activations/buffers ${gb(act)}</span></div>`;
      $("#cs-gpu-row", root).innerHTML = Array.from({ length: G }, (_, i) => `<div style="flex:1;min-width:60px;border:2px solid var(--ink);border-radius:6px;padding:4px;font-size:.7rem;text-align:center">
        GPU ${i + 1}<div style="height:6px;border-radius:3px;background:var(--surface-3);margin-top:3px;overflow:hidden"><div style="height:100%;width:${Math.min(100, used / cap * 100)}%;background:${fits ? "var(--memory)" : "var(--bad)"}"></div></div></div>`).join("");

      // prefill for the whole batch, decode at average context
      const pre = prefillPass(m, bpp, P, B, gpu, kvb);
      const dec = decodeStep(m, bpp, B, P + (O - 2) / 2 + 1, gpu, kvb);
      const total = pre.T + (O - 1) * dec.T;
      const warn = fits ? "" : `<p class="c-bad" style="font-size:.85rem">Doesn't fit: numbers below are hypothetical.</p>`;
      $("#cs-pre", root).innerHTML = `${warn}<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(pre.tc, pre.tm)}<span class="c-muted" style="font-size:.82rem">arithmetic intensity ≈ ${fmt(pre.ai, 1)} FLOPs/byte</span></div>
        ${meter("Compute fraction of toy ceiling", "compute", "cs-p-mfu")}${meter("Bandwidth fraction of toy ceiling", "memory", "cs-p-mbu")}
        <div class="stat-row"><div class="stat"><span class="v">${ms(pre.T)}</span><span class="k">Prefill lower bound for ${B > 1 ? `${B} prompts` : "the prompt"}</span></div>
        <div class="stat"><span class="v">${words(pre.flops)}</span><span class="k">FLOPs</span></div></div>`;
      setMeter(root, "cs-p-mfu", pre.mfu); setMeter(root, "cs-p-mbu", pre.mbu);
      $("#cs-dec", root).innerHTML = `${warn}<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(dec.tc, dec.tm)}<span class="c-muted" style="font-size:.82rem">arithmetic intensity ≈ ${fmt(dec.ai, 1)} FLOPs/byte</span></div>
        ${meter("Compute fraction of toy ceiling", "compute", "cs-d-mfu")}${meter("Bandwidth fraction of toy ceiling", "memory", "cs-d-mbu")}
        <div class="stat-row"><div class="stat"><span class="v">${fmt(dec.perUser, 1)}</span><span class="k">tokens/sec per request</span></div>
        <div class="stat"><span class="v">${fmt(dec.tps, 0)}</span><span class="k">tokens/sec total</span></div>
        <div class="stat"><span class="v">${ms(total)}</span><span class="k">response service-time estimate</span></div></div>
        <p class="c-muted" style="font-size:.8rem">Bytes read per step: ${gb(dec.weights)} weights + ${gb(dec.kv)} KV cache.</p>`;
      setMeter(root, "cs-d-mfu", dec.mfu, `${fmt(dec.mfu * 100, 1)}%`); setMeter(root, "cs-d-mbu", dec.mbu, `${fmt(dec.mbu * 100, 1)}%`);

      // mini roofline
      const bw = gpu.bwGBs * 1e9, F = gpu.flops;
      const X = a => 50 + (Math.log10(a) + 1) / 6 * 390, Y = p => 220 - (Math.log10(p) - 10) / 7 * 200;
      const knee = F / bw;
      let s = `<line x1="50" y1="220" x2="440" y2="220" stroke="var(--line)"/><line x1="50" y1="20" x2="50" y2="220" stroke="var(--line)"/>
        <text x="245" y="250" text-anchor="middle" font-size="11" class="muted">arithmetic intensity (FLOPs/byte, log)</text>
        <text x="14" y="120" font-size="11" class="muted" transform="rotate(-90 14 120)" text-anchor="middle">FLOPS (log)</text>
        <line x1="${X(.1)}" y1="${Y(bw * .1)}" x2="${X(knee)}" y2="${Y(F)}" stroke="var(--memory)" stroke-width="3"/>
        <line x1="${X(knee)}" y1="${Y(F)}" x2="${X(1e5)}" y2="${Y(F)}" stroke="var(--compute)" stroke-width="3"/>`;
      [[pre, "prefill", "var(--compute)"], [dec, "decode", "var(--memory)"]].forEach(([r, n, c], i) => {
        const a = clamp(r.ai, .1, 1e5), p = Math.min(F, bw * r.ai);
        s += `<circle cx="${X(a)}" cy="${Y(p)}" r="7" fill="${c}" stroke="var(--surface)" stroke-width="2"/><text x="${X(a) + (a > 1e3 ? -10 : 10)}" y="${Y(p) + (i ? 18 : -10)}" font-size="11" font-weight="700" text-anchor="${a > 1e3 ? "end" : "start"}">${n}</text>`;
      });
      $("#cs-roof", root).innerHTML = s;

      // suggestions
      const tips = [];
      if (!fits) tips.push(["bad", "Doesn't fit", "Add GPUs (tensor parallelism), lower the precision, shorten context, or reduce batch size. Models with GQA and paged KV cache also help."]);
      if (dec.tm > 1.5 * dec.tc) tips.push(["memory", "Decode is memory-bandwidth-bound", "Increase batch size (continuous batching), quantize weights, shrink the KV cache (GQA, KV quantization), or use GPUs with faster HBM. More FLOPS won't help much."]);
      if (dec.tc > 1.5 * dec.tm) tips.push(["compute", "Decode is compute-bound", "The batch is large enough that compute is the limit: more or faster compute, FP8 kernels, or more GPUs."]);
      if (pre.tc > 1.5 * pre.tm) tips.push(["compute", "Prefill is compute-bound", "For lower TTFT: more compute, FP8 compute, prefix caching for shared prompts, and validated faster kernels. Chunked prefill targets other users' inter-token latency; it can increase the long prompt's TTFT."]);
      if (pre.tm > 1.5 * pre.tc) tips.push(["memory", "Prefill is on the memory side", "The prompt is short enough that reading weights dominates; prefill is already cheap."]);
      if (kv > weights && fits) tips.push(["kv", "KV cache is bigger than the weights", "Long contexts × many requests: paged KV cache, prefix caching, KV quantization, and GQA models matter a lot here."]);
      $("#cs-tips", root).innerHTML = tips.map(([c, h, t]) => `<div class="card flat"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${c === "kv" ? "mixed" : c}">${h}</span></div><p>${t}</p></div>`).join("");
    });
    bindSeg(root, "cs-model", k => { sel.model = k; run(); });
    bindSeg(root, "cs-prec", k => { sel.prec = k; run(); });
    bindSeg(root, "cs-gpus", k => { sel.gpus = k; run(); });
    bindSeg(root, "cs-kv", k => { sel.kvb = +k; run(); });
  },
});
