        <div style="display:grid;gap:12px;align-content:start">
          <div class="stage-panel" id="t16-cap" style="min-height:90px"></div>
          ${big("Decode throughput at batch 1 is <b>not</b> mainly set by how many FLOPs the GPU could theoretically perform. It is often limited by <b>how quickly the GPU can move the required model data from memory to the compute hardware</b>.", "Most important idea")}

    ${see("Why does batching help?", `

      <div class="grid2">
        <div style="display:grid;gap:8px">

          <div class="stat"><span class="v" id="t16-ai">–</span><span class="k">FLOPs per byte</span></div>
          <div class="stat"><span class="v" id="t16-bd">–</span><span class="k">diagnosis</span></div>
        </div>
      </div>
      <svg class="svg-block" viewBox="0 0 700 200" id="t16-chart"></svg>
      <p class="c-muted" style="font-size:.82rem">Example GPU (peak ${words(DEMO.flops)} FLOPS, ${DEMO.bwGBs.toLocaleString("en-US")} GB/s). *We pretend the 70B-class model fits, to show the maths. Red area = KV cache no longer fits in 80 GB. ${illus("Simplified model · illustrative")}</p>`, "Try batching")}
    ${ex(`<div class="calc">8B FP16, 2,048-token context ${illus()}<br>
      batch 1: read ≈ 16.3 GB/step → ≈ <b>61 tok/s</b>, Tensor Cores under 1% busy<br>
      batch 32: read ≈ 16 GB weights (shared!) + 8.6 GB KV → ≈ <b>1,300 tok/s total</b><br>

    ${tech(`<ul>
      <li>Per decode step: bytes moved ≈ weight bytes + (KV cache bytes per token × context × batch); FLOPs ≈ batch × (2N + 2·L·context·d).</li>
      <li>At batch 1, FLOPs/byte ≈ 1, far below the hardware crossover (peak FLOPS ÷ bandwidth), so bandwidth limits speed.</li>
      <li>Batching multiplies FLOPs by B while weight bytes stay fixed, raising arithmetic intensity and throughput. Per-user speed slowly drops as KV reads and compute grow.</li>
    </ul>`)}
    ${inf(`<p>This single idea explains a lot of real serving practice: <b>batching</b> (and continuous batching), <b>quantizing weights</b> (fewer bytes to move), <b>GQA/MQA</b> (smaller KV cache), and why GPUs with <b>faster HBM</b> speed up decode even when compute is unchanged.</p>`)}
    ${check({
      q: "Why does batching 32 users together raise total decode throughput so much?",
      opts: ["Each user's weights are read separately, but faster", "The weights are read once per step and shared by all 32 tokens, so compute does more work per byte moved", "Batching reduces the model size", "Batching skips the KV cache"],

      "The maths for one token is small: about 1 FLOP for every byte moved.",
      "The Tensor Cores finish their share quickly and <b>sit idle</b> between deliveries.",

      s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map(p => `${X(p.e)},${Y(p.tps)}`).join(" ")}"/>`;

      $("#t16-chart", root).innerHTML = s;
    };
    const run = bindSliders(root, { "t16-b": x => Math.pow(2, x), "t16-ctx": x => ctxs[x].toLocaleString("en-US") }, v => {

      $("#t16-stack", root).innerHTML = `<span class="s-w" style="width:${wp}%">${wp > 22 ? `weights ${gb(r.weights)}` : ""}</span><span class="s-kv" style="width:${100 - wp}%">${100 - wp > 22 ? `KV ${gb(r.kv)}` : ""}</span>`;
      chart(m, cl, B);
    });
    bindSeg(root, "t16-model", k2 => { model = k2; run(); });
  },
});

  blurb: "Fewer bits per number means fewer bytes to store and to move. Ends with how to estimate the GPU memory a deployment needs.",

/* ---------- tiny floating-point simulator ---------- */
function fpSpec(E, M, fn = false) {
  const bias = Math.pow(2, E - 1) - 1;
  const topExp = fn ? Math.pow(2, E) - 1 : Math.pow(2, E) - 2;
  const topMant = fn ? Math.pow(2, M) - 2 : Math.pow(2, M) - 1;
  return { E, M, fn, bias, topExp, topMant, max: Math.pow(2, topExp - bias) * (1 + topMant / Math.pow(2, M)), minSub: Math.pow(2, 1 - bias - M) };
}
const FP = {
  FP32: fpSpec(8, 23), FP16: fpSpec(5, 10), BF16: fpSpec(8, 7), E4M3: fpSpec(4, 3, true), E5M2: fpSpec(5, 2),
};
function encodeFP(x, f) {
  const sign = x < 0 || Object.is(x, -0) ? 1 : 0, a = Math.abs(x);
  if (a === 0) return { v: 0, status: "exact", s: sign, e: 0, m: 0 };
  let e = Math.floor(Math.log2(a));
  if (e < 1 - f.bias) e = 1 - f.bias;
  const step = Math.pow(2, e - f.M);
  const q = Math.round(a / step) * step;
  if (q > f.max) return { v: sign ? -Infinity : Infinity, status: "overflow", s: sign, e: f.fn ? f.topExp : Math.pow(2, f.E) - 1, m: f.fn ? f.topMant : 0 };
  if (q === 0) return { v: 0, status: "underflow", s: sign, e: 0, m: 0 };
  const e2 = Math.floor(Math.log2(q));
  let eField, mField;
  if (e2 < 1 - f.bias) { eField = 0; mField = Math.round(q / f.minSub); }
  else { eField = e2 + f.bias; mField = Math.round((q / Math.pow(2, e2) - 1) * Math.pow(2, f.M)); }
  return { v: sign ? -q : q, status: q === a ? "exact" : "rounded", s: sign, e: eField, m: mField };
}
function fpValues(f) {
  const out = [];
  for (let e = 0; e <= f.topExp; e++) {
    const mm = e === f.topExp ? f.topMant : Math.pow(2, f.M) - 1;
    for (let m = 0; m <= mm; m++) out.push(e === 0 ? m * f.minSub : Math.pow(2, e - f.bias) * (1 + m / Math.pow(2, f.M)));
  }
  return out.filter(v => v > 0);
}
function bitStrip(name, f, enc) {
  const bin = (v, n) => v.toString(2).padStart(n, "0");
  const s = enc ? String(enc.s) : "±", e = enc ? bin(enc.e, f.E) : "e".repeat(f.E), m = enc ? bin(enc.m, f.M) : "m".repeat(f.M);
  const cell = (ch, bg, fg) => `<span style="display:inline-grid;place-items:center;min-width:${f.M > 12 ? 12 : 18}px;height:22px;background:${bg};color:${fg};font-family:var(--f-mono);font-size:.7rem;border-radius:2px">${ch}</span>`;
  return `<div style="display:flex;gap:2px;flex-wrap:nowrap;align-items:center"><span class="mono" style="width:52px;font-size:.8rem;font-weight:600">${name}</span>
    ${cell(s, "var(--kv)", "#fff")}${e.split("").map(c => cell(c, "var(--memory)", "#fff")).join("")}${m.split("").map(c => cell(c, "var(--compute-soft)", "var(--compute)")).join("")}</div>`;
}
function showNum(v) {
  if (!isFinite(v)) return v > 0 ? "+∞ (overflow)" : "−∞ (overflow)";
  if (v === 0) return "0";
  const a = Math.abs(v);
  return a >= 1e5 || a < 1e-3 ? v.toExponential(4) : String(+v.toPrecision(7));
}

const FORMATS = [
  { k: "FP32", bits: [1, 8, 23], bytes: 4, use: "Full precision. Used for training master weights; rarely needed for serving.", kind: "float" },
  { k: "TF32", bits: [1, 8, 15], bytes: 4, use: "Not a storage format: numbers are stored as FP32 (4 bytes), but matrix multiplies on newer GPUs use 8 exponent + 15 mantissa bits internally for speed.", kind: "float", tf: true },
  { k: "FP16", bits: [1, 5, 10], bytes: 2, use: "Half precision. A common serving format; small range can overflow.", kind: "float" },
  { k: "BF16", bits: [1, 8, 7], bytes: 2, use: "Brain float. Same range as FP32 with 2 bytes: the default for many modern LLM checkpoints.", kind: "float" },
  { k: "FP8", bits: [1, 4, 3], bytes: 1, use: "8-bit float (E4M3 or E5M2). Needs scale factors and recent hardware; common for fast serving.", kind: "float" },
  { k: "INT8", bits: [8], bytes: 1, use: "8-bit integer plus a scale. Weights (and sometimes activations) quantized.", kind: "int" },
  { k: "INT4", bits: [4], bytes: 0.5, use: "4-bit integer plus scales, usually per group of weights. Big memory savings; care needed for accuracy.", kind: "int" },
];

topic({
  num: 22, title: "INT8 / INT4 quantization",
  question: "How do you squeeze a decimal weight into a small integer?",
  render: () => `
    ${say(
      "Find the biggest weight in a group. Stretch the integer range to cover it: that stretch is the <b>scale</b>. Divide each weight by the scale and round to a whole number. Store the whole numbers plus the one scale.",
      "To use the weight, multiply back: <b>integer × scale</b>. You get something close to the original, but not exact. That gap is the quantization error."
    )}
    ${see("What happens to real weights when we quantize them?", `
      ${flow([{ t: "FP value (e.g. 0.42)" }, { t: "÷ scale", c: "memory" }, { t: "round & clip" }, { t: "integer stored (e.g. 49)", c: "kv" }, { t: "× scale when used", c: "compute" }])}

        ${seg("t22-gran", [["tensor", "One scale for all"], ["group", "One scale per group of 4"]], "tensor")}

      </div>
      <div class="scroll-x"><table class="cmp-table" id="t22-table"></table></div>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t22-scale">–</span><span class="k">scale(s)</span></div>
        <div class="stat"><span class="v" id="t22-err">–</span><span class="k">average error</span></div>
        <div class="stat"><span class="v" id="t22-mem">–</span><span class="k">memory vs FP16</span></div>
      </div>`)}
    ${see("Where does accuracy start to drop?", `
      <svg class="svg-block" viewBox="0 0 700 220" id="t22-cliff"></svg>
      <p class="c-muted" style="font-size:.82rem">${illus("Illustrative trend, not a benchmark")} The exact cliff depends on the model, the method (e.g. GPTQ, AWQ, SmoothQuant), group size and task.</p>`, "Accuracy trade-off")}
    ${ex(`<div class="calc">Weights [0.42, −1.10, 0.05, 0.88], INT8<br>
      scale = 1.10 ÷ 127 = 0.00866<br>
      0.42 ÷ 0.00866 = 48.5 → store <b>48</b> → use 48 × 0.00866 = <b>0.4157</b> (error 0.004)</div>`)}
    ${tech(`<ul>
      <li><b>Weight-only quantization</b> (e.g. <b>W4A16</b>): weights stored in 4 bits, dequantized to 16-bit on the fly for the matrix multiply. Cuts memory and bytes moved; compute stays about FP16-level (with some dequantization cost).</li>
      <li><b>Weight + activation quantization</b> (e.g. <b>W8A8</b>): both weights and activations are 8-bit, so the multiply itself can run in INT8 on supported kernels. Saves memory <b>and</b> compute, but activations have outliers that make it harder.</li>
      <li><b>Granularity</b>: per-tensor, per-channel or per-group scales. Smaller groups = better accuracy, slightly more overhead.</li>
      <li><b>Accuracy cliff</b>: quality usually holds well at 8 bits, often at 4 bits with good methods, then drops sharply around 3 bits and below.</li>
    </ul>`)}
    ${fx(["scale = max |w| ÷ q_max      (q_max = 127 for INT8, 7 for INT4)", "q = round(w ÷ scale)        w ≈ q × scale"], "Symmetric quantization shown. Asymmetric schemes add a zero-point.")}
    ${inf(`<p>One outlier inflates the scale and crushes every small weight toward zero. That's why real methods use small groups, keep sensitive layers in higher precision, or smooth out outliers before quantizing.</p>`)}
    ${check({
      q: "W4A16 means…",
      opts: ["4-bit activations, 16-bit weights", "4-bit weights, 16-bit activations", "4 GPUs and 16 layers", "4-bit KV cache and 16-bit weights"],
      a: 1, why: "W = weights, A = activations. W4A16 stores weights in 4 bits and does the maths with 16-bit activations.",
    })}`,

      const qmax = bits === 8 ? 127 : 7;
      const groups = gran === "tensor" ? [w.map((_, i) => i)] : [[0, 1, 2, 3], [4, 5, 6, 7]];
      const scales = [], rows = [];
      groups.forEach((g, gi) => {
        const s = Math.max(...g.map(i => Math.abs(w[i]))) / qmax; scales.push(s);
        g.forEach(i => { const q = clamp(Math.round(w[i] / s), -qmax, qmax); rows[i] = { w: w[i], q, d: q * s, g: gi }; });
      });
      const maxAbs = Math.max(...w.map(Math.abs));
      const barW = (v) => `<div style="position:relative;height:10px;width:140px;background:var(--surface-2);border-radius:3px"><div style="position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)"></div><div style="position:absolute;top:0;bottom:0;${v >= 0 ? "left:50%" : `right:50%`};width:${Math.abs(v) / maxAbs * 50}%;background:var(--accent);border-radius:2px"></div></div>`;
      $("#t22-table", root).innerHTML = `<tr><th>Original (FP16)</th><th></th><th>Stored int</th><th>Recovered</th><th>Error</th></tr>` + rows.map(r => {
        const err = Math.abs(r.d - r.w), bad = err > 0.08;
        return `<tr><td class="mono">${r.w.toFixed(2)}</td><td>${barW(r.w)}</td><td class="mono c-kv">${r.q}</td><td class="mono">${r.d.toFixed(3)}</td><td class="mono ${bad ? "c-bad" : ""}">${err.toFixed(3)}</td></tr>`;
      }).join("");
      $("#t22-scale", root).textContent = scales.map(s => s.toFixed(4)).join(" / ");
      $("#t22-err", root).textContent = (rows.reduce((a, r) => a + Math.abs(r.d - r.w), 0) / rows.length).toFixed(4);
      $("#t22-mem", root).textContent = bits === 8 ? "½ (plus scales)" : "¼ (plus scales)";
    };
    bindSeg(root, "t22-bits", run); bindSeg(root, "t22-gran", run);
    $("#t22-out", root).addEventListener("change", run);
    run();
    const pts = [[16, 100], [8, 99.7], [6, 99.2], [5, 98.4], [4, 96.8], [3, 88], [2, 45]];
    const X = b => 70 + (16 - b) / 14 * 580, Y = q => 190 - (q - 40) / 60 * 170;
    let s = `<line x1="70" y1="190" x2="660" y2="190" stroke="var(--line)"/><line x1="70" y1="20" x2="70" y2="190" stroke="var(--line)"/>`;
    [40, 70, 100].forEach(q => s += `<text x="64" y="${Y(q) + 4}" text-anchor="end" font-size="11" class="muted">${q}%</text>`);
    pts.forEach(([b]) => s += `<text x="${X(b)}" y="206" text-anchor="middle" font-size="11" class="muted">${b}-bit</text>`);
    s += `<rect x="${X(3.5)}" y="20" width="${X(2) - X(3.5) + 10}" height="170" fill="var(--bad-soft)" opacity=".7"/><text x="${X(2.6)}" y="36" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bad)">accuracy cliff</text>`;
    s += `<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${pts.map(([b, q]) => `${X(b)},${Y(q)}`).join(" ")}"/>`;
    pts.forEach(([b, q]) => s += `<circle cx="${X(b)}" cy="${Y(q)}" r="5" fill="var(--accent)"/>`);
    s += `<text x="80" y="16" font-size="11" class="muted">relative quality</text>`;
    $("#t22-cliff", root).innerHTML = s;
  },
});

        <div class="ctl"><label>GPUs (tensor parallel)</label>${seg("me-g", [["1", "1"], ["2", "2"], ["4", "4"], ["8", "8"]], "4")}</div>
        ${slider("me-ctx", "Context per request (prompt + output tokens)", 0, 7, 1, 3)}
        ${slider("me-users", "Concurrent requests", 1, 128, 1, 16)}
      </div>
      ${player("me-pl")}
      <div class="caption" id="me-cap"></div>
      <div class="grid2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start">
        <div style="display:grid;gap:8px">
          <div class="calc" id="me-calc" style="background:var(--surface-2);border-radius:8px;padding:10px 14px"></div>
        </div>
        <div style="display:grid;gap:8px">
          <div class="mini-label">Memory on each GPU</div>
          <div class="stack" id="me-bar" style="height:44px"></div>
          <div class="btn-row" style="gap:12px;font-size:.78rem">
            <span><span class="pill" style="background:var(--memory);color:#fff">■</span> weights</span>
            <span><span class="pill" style="background:var(--kv);color:#fff">■</span> KV cache</span>
            <span><span class="pill" style="background:var(--compute);color:#fff">■</span> activations + overhead</span>
            <span style="color:var(--bad)">| usable limit (90%)</span></div>
          <div class="stat-row">
            <div class="stat"><span class="v" id="me-fit">–</span><span class="k">verdict</span></div>
            <div class="stat"><span class="v" id="me-maxu">–</span><span class="k">max concurrent requests at this context</span></div>
            <div class="stat"><span class="v" id="me-maxc">–</span><span class="k">max context at this many requests</span></div>
          </div>
        </div>
      </div>
      <p class="c-muted" style="font-size:.82rem">Rules of thumb: activations + temporary buffers ≈ 2 GB per GPU, CUDA/framework overhead ≈ 1 GB per GPU, and keep 10% of memory free as headroom (serving engines like vLLM reserve about 90% by default). Real engines measure activation memory at startup. ${illus("Estimate, not a guarantee")}</p>`)}
    ${ex(`<div class="calc">Llama-3-70B-style (80 layers, 8 KV heads, head size 128), BF16 weights and KV, 8,192-token context, 16 requests, 4 × 80 GB GPUs<br>
      <b>1. Weights</b>   = 70B × 2 bytes = 140 GB → ÷ 4 GPUs = <b>35 GB</b> each<br>
      <b>2. KV per token</b> = 2 × 80 × 8 × 128 × 2 bytes = 327,680 bytes ≈ 0.33 MB<br>
      <b>3. KV total</b>  = 0.33 MB × 8,192 × 16 ≈ 42.9 GB → ÷ 4 = <b>10.7 GB</b> each<br>
      <b>4. Activations + overhead</b> ≈ 2 + 1 = <b>3 GB</b> each<br>
      <b>5. Total</b> ≈ 48.7 GB per GPU vs 72 GB usable → <span class="c-ok">fits</span>, with room for more requests</div>`)}
    ${fx([
      "Weights (GB) ≈ parameters (billions) × bytes per parameter",
      "KV cache per token (bytes) = 2 × layers × KV heads × head size × bytes per number",
      "KV cache total = per token × context length × concurrent requests",
      "Per GPU (tensor parallel over N) ≈ (weights + KV total) ÷ N + activations + overhead  ≤  90% of GPU memory",
    ], "Find layers, KV heads (num_key_value_heads) and head size (hidden_size ÷ num_attention_heads) in the model's config.json.")}
    ${tech(`<ul>
      <li><b>Weights</b> are fixed once loaded. Quantized formats add a little for scales (per group), and some layers (embeddings, norms, output head) often stay in 16-bit.</li>
      <li><b>KV cache</b> is the part that changes with traffic: it scales with context length × concurrent sequences, and with the number of <b>KV heads</b> (GQA models need far less than MHA models).</li>
      <li><b>Activations</b> are temporary tensors of the current forward pass. They peak during large prefills and scale with the number of tokens processed in one step (chunked prefill caps this).</li>
      <li><b>Overhead</b>: CUDA context, kernels' workspace, communication buffers for multi-GPU, memory fragmentation.</li>
      <li>With <b>tensor parallelism</b>, weights and KV cache are split across GPUs; activations and overhead are paid on every GPU.</li>
    </ul>`)}
    ${inf(`<p>The weights decide the <b>minimum</b> number of GPUs. The KV cache decides <b>how many users and how much context</b> fit on top. Every extra GB freed (by quantizing weights, FP8 KV cache, GQA models or paged KV cache) turns directly into more concurrent requests, which means larger batches and better throughput for memory-bound decode.</p>`)}
    ${check({
      q: "A Llama-3-8B-style model has 32 layers, 8 KV heads and head size 128, with an FP16 KV cache. Roughly how much KV cache does one 8,000-token conversation need?",
      opts: ["About 100 MB", "About 1 GB", "About 10 GB", "About 16 GB"],
      a: 1, why: "Per token: 2 × 32 × 8 × 128 × 2 bytes = 131,072 bytes (≈ 0.13 MB). × 8,000 tokens ≈ 1.05 GB.",
    })}
    ${check({
      q: "Your 70B deployment fits, but only 6 users at 32k context. Which change lets you serve the most extra users without adding GPUs?",
      opts: ["Use a larger vocabulary", "Switch the KV cache from FP16 to FP8", "Increase the context length", "Use BF16 instead of FP16 weights"],
      a: 1, why: "An FP8 KV cache halves the KV memory per token, roughly doubling the users that fit (if the freed memory was the limit). BF16 and FP16 are the same size.",
    })}`,
  mount(root, ctx) {
    const ctxs = [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072];
    const S = { model: "70B", wp: 2, kp: 2, gm: 80, g: 4 };
    let frame = 0, vals = { "me-ctx": 3, "me-users": 16 };
    const GBv = b => b / 1e9;
    const compute = () => {
      const m = MEM_MODELS[S.model], ctxLen = ctxs[vals["me-ctx"]], users = vals["me-users"], G = S.g;
      const weights = m.N * S.wp, kvTok = 2 * m.L * m.kvH * m.hd * S.kp, kvTot = kvTok * ctxLen * users;
      const actOv = 3e9, usable = S.gm * 1e9 * 0.9;
      const perGpu = (weights + kvTot) / G + actOv;
      const free = usable - weights / G - actOv;
      const maxU = free > 0 ? Math.floor(free * G / (kvTok * ctxLen)) : 0;
      const maxC = free > 0 ? Math.floor(free * G / (kvTok * users)) : 0;
      return { m, ctxLen, users, G, weights, kvTok, kvTot, actOv, usable, perGpu, maxU, maxC };
    };
    const render = (i) => {
      frame = i;
      const r = compute(), cap = S.gm * 1e9;
      const lines = [
        `<b>1. Weights</b> = ${r.m.N / 1e9}B params × ${S.wp} bytes = <b>${gb(r.weights)}</b>${r.G > 1 ? ` → ÷ ${r.G} GPUs = <b>${gb(r.weights / r.G)}</b> each` : ""}`,
        `<b>2. KV per token</b> = 2 × ${r.m.L} layers × ${r.m.kvH} KV heads × ${r.m.hd} × ${S.kp} bytes = <b>${r.kvTok.toLocaleString("en-US")} bytes</b> (${gb(r.kvTok)})`,
        `<b>3. KV total</b> = ${gb(r.kvTok)} × ${r.ctxLen.toLocaleString("en-US")} tokens × ${r.users} requests = <b>${gb(r.kvTot)}</b>${r.G > 1 ? ` → ÷ ${r.G} = <b>${gb(r.kvTot / r.G)}</b> each` : ""}`,
        `<b>4. Activations + overhead</b> ≈ 2 GB + 1 GB = <b>3 GB</b> per GPU`,
        `<b>5. Per GPU</b> ≈ <b>${gb(r.perGpu)}</b> vs usable ${gb(r.usable)} (90% of ${S.gm} GB) → ${r.perGpu <= r.usable ? `<span class="c-ok">fits</span>` : `<span class="c-bad">does not fit</span>`}`,
      ];
      $("#me-calc", root).innerHTML = lines.map((l, j) => `<div style="opacity:${j <= i ? 1 : .25};transition:opacity .3s">${l}</div>`).join("");
      const w = i >= 0 ? r.weights / r.G : 0, kv = i >= 2 ? r.kvTot / r.G : 0, ao = i >= 3 ? r.actOv : 0;
      const scale = Math.max(cap, w + kv + ao) * 1.02;
      $("#me-bar", root).innerHTML = `<span class="s-w" style="width:${w / scale * 100}%">${w / scale > .12 ? gb(w) : ""}</span><span class="s-kv" style="width:${kv / scale * 100}%">${kv / scale > .12 ? gb(kv) : ""}</span><span class="s-act" style="width:${ao / scale * 100}%"></span><span class="s-free" style="flex:1"></span>
        <div class="cap-line" style="left:${r.usable / scale * 100}%"></div>${scale > cap * 1.03 ? `<div class="cap-line" style="left:${cap / scale * 100}%;background:var(--ink)"></div>` : ""}`;
      const fits = r.perGpu <= r.usable;
      $("#me-fit", root).innerHTML = i < 4 ? "–" : fits ? `<span class="c-ok">fits</span>` : `<span class="c-bad">does not fit</span>`;
      $("#me-maxu", root).textContent = i < 4 ? "–" : r.maxU.toLocaleString("en-US");
      $("#me-maxc", root).textContent = i < 4 ? "–" : r.maxC > 0 ? `${r.maxC.toLocaleString("en-US")} tokens` : "0 (weights don't fit)";
      const caps = [
        ["Step 1 · weights", `The weights are a fixed cost: every parameter takes a number of bytes set by the precision. ${r.G > 1 ? `With ${r.G} GPUs in tensor parallel, each GPU holds about 1/${r.G} of them.` : ""}`],
        ["Step 2 · KV cache per token", `Every token in every request stores one Key and one Value vector in every layer. ${r.m.name} uses ${r.m.attn} with ${r.m.kvH} KV heads, which sets the cost per token.`],
        ["Step 3 · KV cache total", "Multiply by how many tokens each request keeps (prompt + output) and by how many requests run at the same time. This is the part that grows with traffic."],
        ["Step 4 · activations and overhead", "Add working space for the current forward pass plus CUDA and framework overhead, paid on every GPU. It's small next to weights and KV cache, but not zero."],
        ["Step 5 · compare with the GPU", fits
          ? `Fits with ${gb(r.usable - r.perGpu)} spare per GPU. At this context you could run up to ${r.maxU.toLocaleString("en-US")} requests at once.`
          : r.maxC > 0 ? `Too much. Options: fewer requests (max ${r.maxU.toLocaleString("en-US")} here), shorter context, an FP8 KV cache, lower-precision weights, or more GPUs.` : "The weights alone don't fit. Use more GPUs, bigger GPUs, or lower-precision weights."],
      ];
      $("#me-cap", root).innerHTML = `<span class="cap-step">${caps[i][0]}</span><span>${caps[i][1]}</span>`;
    };
    const pl = bindPlayer(root, "me-pl", ctx, { frames: 5, render, interval: 3200 });
    pl.show(4);
    const rerender = () => render(frame);
    [["me-model", "model", v => v], ["me-wp", "wp", Number], ["me-kp", "kp", Number], ["me-gm", "gm", Number], ["me-g", "g", Number]]
      .forEach(([id, k, conv]) => bindSeg(root, id, v => { S[k] = conv(v); rerender(); }));
    bindSliders(root, { "me-ctx": v => ctxs[v].toLocaleString("en-US"), "me-users": v => v }, v => { vals = v; rerender(); });
  },
});

/* ============================================================
   PART 5 — What makes newer GPUs better for inference? (24–25)
   ============================================================ */
part({
  num: 5, title: "GPU Types & Generations",
  blurb: "Newer GPUs improve on five separate dimensions. Which ones matter depends on whether your workload is compute-bound or memory-bound.",
  story: "Newer GPUs improve <b>compute + HBM capacity + bandwidth + precision support + interconnect</b>. Each one fixes a different bottleneck.",
});

const DIMENSIONS = [
  { k: "compute", name: "More compute", c: "var(--compute)", what: "Faster and more capable Tensor Cores and cores overall.", helps: ["Faster prefill (lower TTFT for long prompts)", "Higher throughput at large batch sizes", "Compute-bound workloads"], },
  { k: "cap", name: "More HBM capacity", c: "var(--memory)", what: "More GB of memory on each GPU.", helps: ["Larger models on fewer GPUs", "Longer contexts (bigger KV cache)", "More concurrent users per GPU"], },
  { k: "bw", name: "Higher HBM bandwidth", c: "var(--memory)", what: "More GB per second between memory and compute.", helps: ["Faster weight and KV cache movement", "Faster low-batch decode (memory-bound)", "Better tokens/sec per user"], },
  { k: "prec", name: "Better low-precision support", c: "var(--kv)", what: "Hardware that computes natively in FP16 → BF16 → FP8 → FP4, plus fast INT8/INT4 kernels.", helps: ["Fewer bytes per weight → less memory and data movement", "Faster matrix maths in low precision", "Bigger models on the same hardware"], },
  { k: "link", name: "Better GPU-to-GPU interconnect", c: "var(--accent)", what: "PCIe → NVLink → NVSwitch: faster, wider links between GPUs.", helps: ["Efficient tensor parallelism across GPUs", "Serving models too big for one GPU", "Less time lost communicating each layer"], },
];

/* ---------- Topic 24 ---------- */
topic({
  num: 24, title: "Why are newer GPUs better?",
  question: "Which GPU improvement actually helps my workload?",
  render: () => `
    ${say(
      "“Newer is faster” hides the real story. A GPU generation can improve <b>five different things</b>, and each one fixes a <b>different bottleneck</b>.",
      "If your workload is memory-bound, more compute barely helps. If it's compute-bound, more bandwidth barely helps. So first ask: <b>what is my workload waiting on?</b>"
    )}
    ${see("Which dimension fixes which bottleneck? Pick a workload.", `
      <div class="btn-row" id="t24-work">
        ${[["chat", "Chat with a large model, few users"], ["rag", "Very long prompts (RAG, documents)"], ["many", "Many users, long conversations"], ["huge", "Model too big for one GPU"]].map(([k, t], i) => `<button type="button" class="btn ${i === 0 ? "on" : ""}" data-k="${k}">${t}</button>`).join("")}
      </div>
      <div class="stage-panel" id="t24-why" style="min-height:60px"></div>
      <div class="grid3" id="t24-dims"></div>`)}
    ${ex(`<div class="calc">Two GPUs with the <b>same compute</b>, but GPU B has more and faster HBM ${illus("Conceptual")}<br>
      Long-prompt prefill → roughly the same TTFT on both (compute-bound)<br>
      Batch-1 decode of a 70B model → GPU B streams tokens faster (bandwidth-bound)<br>
      Many users with long contexts → GPU B fits more KV cache (capacity-bound)</div>`)}
    ${tech(`<ul>
      <li><b>Compute:</b> peak FLOPS, from more and better cores and Tensor Cores.</li>
      <li><b>Capacity:</b> GB of HBM (or GDDR on smaller cards).</li>
      <li><b>Bandwidth:</b> GB/s between memory and the GPU chip.</li>
      <li><b>Precision support:</b> native number formats (FP16 → BF16/TF32 → FP8 → FP4) and fast low-bit kernels.</li>
      <li><b>Interconnect:</b> PCIe (general-purpose, slower) → NVLink (direct GPU links) → NVSwitch (every GPU in a group linked at full speed).</li>
    </ul>`)}
    ${inf(`<p>Match the upgrade to the bottleneck: prefill-heavy → compute and precision; low-batch decode → bandwidth and precision; many long conversations → capacity; giant models → capacity and interconnect.</p>`)}
    ${check({
      q: "Your service runs a big dense model at batch 1 and the output streams slowly. Compute utilization is very low. Which upgrade is most likely to help?",
      opts: ["More peak compute", "Higher HBM bandwidth (or lower-precision weights)", "More CPU cores", "More disk"],
      a: 1, why: "Very low compute utilization at batch 1 points to a memory-bandwidth bottleneck. Faster HBM, or fewer bytes per weight, helps directly.",
    })}`,
  mount(root, ctx) {
    const W = {
      chat: { on: ["bw", "prec"], why: "Few users means small batches, so decode is memory-bandwidth-bound. Faster HBM and fewer bytes per weight help most." },
      rag: { on: ["compute", "prec"], why: "Long prompts make prefill dominate. Prefill is compute-bound, so more compute and fast low-precision maths cut TTFT." },
      many: { on: ["cap", "bw", "compute"], why: "Many long conversations means a huge KV cache (capacity), large batches (compute rises), and lots of KV reads per step (bandwidth)." },
      huge: { on: ["cap", "link", "prec"], why: "If weights don't fit, you need more GB per GPU, lower precision, or several GPUs connected by a fast interconnect." },
    };
    const draw = (k) => {
      $$("#t24-work .btn", root).forEach(b => b.classList.toggle("on", b.dataset.k === k));
      $("#t24-why", root).innerHTML = `<p>${W[k].why}</p>`;
      $("#t24-dims", root).innerHTML = DIMENSIONS.map(d => {
        const on = W[k].on.includes(d.k);
        return `<div class="card" style="border-width:2px;border-color:${on ? d.c : "var(--line)"};opacity:${on ? 1 : .5};transition:all .3s">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px"><h4>${d.name}</h4>${on ? `<span class="pill ok">helps here</span>` : ""}</div>
          <p class="c-muted">${d.what}</p><ul style="padding-left:1.1em;margin:0">${d.helps.map(h => `<li>${h}</li>`).join("")}</ul></div>`;
      }).join("");
    };
    $("#t24-work", root).onclick = e => { const b = e.target.closest("button"); if (b) draw(b.dataset.k); };
    draw("chat");
  },
});

/* ---------- Topic 25 ---------- */
const GENS = [
  { k: "T4", arch: "Turing", mem: "16 GB GDDR6", lv: [1, 1, 1, 2, 1], feats: ["Tensor Cores", "FP16 / INT8", "PCIe only", "Low power"], enabled: "Cheap, power-efficient inference for small models and classic deep learning. Still a sensible choice when the model is small." },
  { k: "A10", arch: "Ampere", mem: "24 GB GDDR6", lv: [2, 2, 2, 3, 1], feats: ["More compute", "BF16 / TF32", "PCIe only"], enabled: "A 7B-class model in 16-bit fits on a single card, for affordable single-GPU serving." },
  { k: "A100", arch: "Ampere", mem: "40 / 80 GB HBM", lv: [3, 3, 3, 3, 3], feats: ["HBM", "BF16 / TF32", "NVLink + NVSwitch", "MIG partitioning"], enabled: "Large models served across 8-GPU NVLink nodes. Made tensor parallelism practical at scale." },
  { k: "H100", arch: "Hopper", mem: "80 GB HBM", lv: [4, 3, 3, 4, 4], feats: ["Much more compute", "FP8 (Transformer Engine)", "Faster NVLink"], enabled: "FP8 inference and much faster prefill and large-batch serving." },
  { k: "H200", arch: "Hopper", mem: "141 GB HBM", lv: [4, 4, 4, 4, 4], feats: ["Same compute class as H100", "More and faster HBM"], enabled: "A clean example of memory mattering: similar compute to H100, but bigger KV caches, bigger models per GPU and faster memory-bound decode." },
  { k: "B200", arch: "Blackwell", mem: "192 GB HBM", lv: [5, 5, 5, 5, 5], feats: ["More compute", "FP4 support", "Newer NVLink, larger GPU domains"], enabled: "Very large models and long contexts on fewer GPUs, FP4 serving, and big NVLink-connected groups for huge MoE models." },
];
topic({
  num: 25, title: "What are newer GPUs enabling?",
  question: "What does each generation make possible that the last one didn't?",
  render: () => `
    ${say("Each generation pushes several dimensions forward at once. What matters isn't the spec sheet; it's what those improvements <b>unlock</b>: bigger models, longer contexts, more users, lower latency.")}
    ${see("How did GPU generations change what inference can do? Click a GPU.", `
      <div class="arch-seq" id="t25-gens"></div>
      <div class="stage-panel" id="t25-detail"></div>
      <p class="c-muted" style="font-size:.82rem">${illus("Relative, qualitative levels")} Dots compare generations loosely; they are not measured specs. Memory sizes are the common configurations.</p>`)}
    ${see("How do the improvements add up?", `
      <div class="grid2" style="align-items:center">
        ${flow([{ t: "More compute", c: "compute" }, { t: "+ More memory", c: "memory" }, { t: "+ More bandwidth", c: "memory" }, { t: "+ Better precision support", c: "kv" }, { t: "+ Better interconnect" }], { vertical: true, id: "t25-in" })}
        ${flow([{ t: "Larger models" }, { t: "+ Longer context" }, { t: "+ Higher throughput" }, { t: "+ Lower latency" }, { t: "+ More concurrent users" }, { t: "+ More efficient multi-GPU serving" }], { vertical: true, id: "t25-out" })}
      </div>`, "The evolution")}
    ${ex(`<div class="calc">70B model in BF16 (140 GB of weights):<br>
      T4 / A10 → needs many cards over PCIe (impractical)<br>
      A100 / H100 80 GB → at least 2 GPUs with NVLink<br>
      H200 141 GB → weights barely fit, leaving no room for KV cache → in practice 2 GPUs<br>
      B200 192 GB → fits on one GPU, with room for KV cache<br>
      In FP8 (70 GB) → fits on a single 80 GB GPU (tight)</div>`)}
    ${tech(`<ul>
      <li>T4 and A10 use GDDR6 memory on the card rather than HBM on the chip package: less capacity and bandwidth, but cheaper and lower power.</li>
      <li>FP8 matrix maths needs Ada/Hopper-class hardware or newer; FP4 needs Blackwell-class.</li>
      <li>NVLink and NVSwitch matter once a model is split across GPUs (Part 6).</li>
    </ul>`)}
    ${inf(`<p>${big("Newer is <b>not</b> automatically better for every workload. A small model on an older, cheaper GPU may give the best cost per token. Pick hardware by the bottleneck and the price, not by the release date.", "Accuracy")}</p>`)}
    ${check({
      q: "H200 has a similar compute class to H100 but more and faster HBM. Which workload benefits most?",
      opts: ["Short-prompt prefill of a small model", "Low-batch decode of a large model with long context", "CPU tokenization", "Nothing: compute is the same"],
      a: 1, why: "More capacity holds bigger KV caches and models; more bandwidth speeds memory-bound decode. Compute-bound prefill gains little.",
    })}`,
  mount(root, ctx) {
    const lvl = (n, cls) => `<span class="lvl ${cls}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
    const names = [["Compute", "c"], ["Capacity", "m"], ["Bandwidth", "m"], ["Precision", "k"], ["Interconnect", "a"]];
    $("#t25-gens", root).innerHTML = GENS.map((g, i) => `<button type="button" class="gen-card" data-i="${i}"><span class="mini-label">${g.arch}</span><span class="gname">${g.k}</span>
      <span style="display:grid;gap:3px;font-size:.72rem">${names.map(([n, c], j) => `<span style="display:flex;justify-content:space-between;gap:6px;align-items:center"><span class="c-muted">${n}</span>${lvl(g.lv[j], c)}</span>`).join("")}</span></button>`).join("");
    const pick = (i) => {
      $$("#t25-gens .gen-card", root).forEach((c, j) => c.classList.toggle("sel", i === j));
      const g = GENS[i], prev = GENS[i - 1];
      const up = prev ? names.map(([n], j) => g.lv[j] > prev.lv[j] ? n : null).filter(Boolean) : [];
      $("#t25-detail", root).innerHTML = `<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h4 style="font-size:1.2rem">${g.k}</h4><span class="c-muted">${g.arch} · ${g.mem}</span></div>
        <div class="tokens">${g.feats.map(f => `<span class="tok">${f}</span>`).join("")}</div>
        <p><b>What it enabled:</b> ${g.enabled}</p>
        ${prev ? `<p class="c-muted" style="font-size:.88rem">Improved over ${prev.k} in: ${up.length ? up.join(", ") : "cost and efficiency more than raw capability"}</p>` : ""}`;
    };
    $("#t25-gens", root).onclick = e => { const c = e.target.closest(".gen-card"); if (c) pick(+c.dataset.i); };
    pick(4);
    let k = 0;
    ctx.every(800, () => { setFlow($("#t25-in", root), k % 6 < 5 ? k % 6 : 4); setFlow($("#t25-out", root), Math.max(-1, k % 6 - 0)); k++; });
  },
});

/* ============================================================
   PART 6 — Scaling LLM Inference (topics 26–30)
   ============================================================ */
part({
  num: 6, title: "Scaling LLM Inference",
  blurb: "When one GPU isn't enough: copy the model, split its matrices, split its layers, or spread its experts.",
  story: "<b>DP / TP / PP / EP</b> let inference scale across GPUs, each trading communication for memory, compute or throughput.",

const REQ_COLORS = ["#3559d1", "#cf6a0b", "#8e44c2", "#0a7470", "#b83280", "#2b8543", "#a8750a", "#5a67d8", "#c13535", "#2a7fa8"];

/* ---------- Topic 26 ---------- */
topic({
  num: 26, title: "Why multiple GPUs?",
  question: "When do I need more than one GPU?",
  render: () => `
    ${say("There are two different reasons to add GPUs. Either the job <b>doesn't fit</b> (the weights plus KV cache need more memory than one GPU has), or the job <b>fits but is too slow</b> (you need more compute or more throughput for more users).")}
    ${see("How many 80 GB GPUs does my deployment need?", `
      <div class="controls">
        <div class="ctl"><label>Model</label>${seg("t26-m", [["8B", "8B"], ["70B", "70B"], ["405B", "405B"]], "70B")}</div>
        <div class="ctl"><label>Precision</label>${seg("t26-p", [["2", "BF16"], ["1", "FP8"], ["0.5", "INT4"]], "2")}</div>
        ${slider("t26-u", "Concurrent users", 1, 128, 1, 16)}
        ${slider("t26-c", "Context per user (tokens)", 0, 5, 1, 2)}
      </div>
      <div class="stack" id="t26-stack"></div>
      <div id="t26-gpus" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t26-w">–</span><span class="k">weights</span></div>
        <div class="stat"><span class="v c-kv" id="t26-kv">–</span><span class="k">KV cache (all users)</span></div>

      </div>
      <p class="c-muted" style="font-size:.82rem">KV cache kept in 16-bit; 10% memory held back for activations and buffers. Throughput needs may require even more GPUs. ${illus("Approximate")}</p>`)}
    ${see("What are the four reasons?", `<div class="grid2">
      <div class="card"><h4>1. The model does not fit</h4><p>405B in BF16 is ~810 GB of weights. No single GPU holds that.</p></div>
      <div class="card"><h4>2. The KV cache does not fit</h4><p>Many users × long contexts can need more memory than the weights.</p></div>
      <div class="card"><h4>3. Need more throughput</h4><p>More users than one GPU can serve at acceptable speed.</p></div>
      <div class="card"><h4>4. Need more compute or bandwidth per token</h4><p>Splitting a model lets several GPUs share each token's work, lowering latency.</p></div></div>`, "Reasons")}
    ${inf(`<p>How you split depends on the reason: copy the whole model (<b>data parallel</b>) for throughput, split matrices (<b>tensor parallel</b>) or layers (<b>pipeline parallel</b>) when it doesn't fit, and spread experts (<b>expert parallel</b>) for MoE models.</p>`)}
    ${check({
      q: "An 8B model fits comfortably on one GPU, but you have 10× more users than it can serve. What is the simplest scaling approach?",
      opts: ["Split its layers across GPUs", "Run several full copies of the model on separate GPUs", "Quantize to 2 bits", "Use a bigger CPU"],

      $("#t26-w", root).textContent = gb(w); $("#t26-kv", root).textContent = gb(kv);
      $("#t26-n", root).innerHTML = `<span class="${n > 1 ? "c-bad" : "c-ok"}">${n}</span>`;
      const wp = w / total * 100;
      $("#t26-stack", root).innerHTML = `<span class="s-w" style="width:${wp}%">${wp > 18 ? "weights" : ""}</span><span class="s-kv" style="width:${100 - wp}%">${100 - wp > 18 ? "KV cache" : ""}</span>`;
      const shown = Math.min(n, 48);
      $("#t26-gpus", root).innerHTML = Array.from({ length: shown }, (_, i) => {

    bindSeg(root, "t26-p", k => { bpp = +k; run(); });
  },
});

/* ---------- Topic 27 ---------- */
topic({
  num: 27, title: "Data parallelism",
  question: "What if I just run more copies of the model?",
  render: () => `
    ${say("<b>Data parallelism</b> = put a <b>full copy of the model on each GPU</b> and send each request to one of the copies. The copies never need to talk to each other while generating. More copies, more requests served.")}
    ${see("What happens to the queue as I add replicas?", `
      <div class="controls">
        ${slider("t27-r", "Model replicas (GPUs)", 1, 4, 1, 1)}
        ${slider("t27-a", "Incoming requests per second", 1, 12, 1, 6)}
      </div>
      <svg class="svg-block" viewBox="0 0 720 260" id="t27-svg"></svg>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t27-cap">–</span><span class="k">capacity (requests/sec)</span></div>
        <div class="stat"><span class="v" id="t27-q">–</span><span class="k">waiting in queue</span></div>
        <div class="stat"><span class="v" id="t27-st">–</span><span class="k">status</span></div>
      </div>
      <p class="c-muted" style="font-size:.82rem">Each replica handles 3 requests/sec in this toy. ${illus()}</p>`)}
    ${ex(`<div class="calc">One GPU serves 3 requests/sec. Traffic is 9 requests/sec.<br>
      1 replica → queue grows forever · 3 replicas → keeps up · each replica still needs the <b>whole model</b> in its own memory</div>`)}
    ${tech(`<ul>
      <li>Each replica holds full weights and its own KV cache. A load balancer routes requests.</li>
      <li>Throughput scales almost linearly with replicas; <b>per-token latency does not improve</b>, because each token is still produced by one GPU.</li>
      <li>Only works if the model fits on one GPU (or one group of GPUs, when combined with other methods).</li>
    </ul>`)}
    ${inf(`<p>Useful when the model fits and you need more users served. It does nothing for a model that doesn't fit, and nothing for batch-1 latency.</p>`)}
    ${check({
      q: "What does data parallelism NOT improve?",
      opts: ["Total requests served per second", "The time to generate each token for a single request", "Ability to handle traffic spikes", "Fault tolerance"],
      a: 1, why: "Each request still runs on a single copy, so its per-token speed is unchanged. Data parallelism adds throughput, not per-request speed.",
    })}`,
  mount(root, ctx) {
    let R = 1, A = 6, queue = 0, acc = 0, dots = [], served = [];
    const svg = $("#t27-svg", root), per = 3;
    const draw = () => {
      let s = `<rect x="10" y="100" width="130" height="60" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>
        <text x="75" y="95" text-anchor="middle" font-size="12" font-weight="600">Request queue</text>`;
      const qShow = Math.min(queue, 24);
      for (let i = 0; i < qShow; i++) s += `<circle cx="${22 + (i % 8) * 15}" cy="${113 + Math.floor(i / 8) * 16}" r="5" fill="var(--accent)"/>`;
      if (queue > 24) s += `<text x="75" y="178" text-anchor="middle" font-size="11" style="fill:var(--bad)">+${Math.round(queue - 24)} more</text>`;
      s += `<rect x="170" y="110" width="80" height="40" rx="6" fill="var(--surface)" stroke="var(--ink)"/><text x="210" y="134" text-anchor="middle" font-size="11" font-weight="600">router</text>`;
      for (let i = 0; i < 4; i++) {
        const y = 20 + i * 60, on = i < R;
        s += `<line x1="250" y1="130" x2="360" y2="${y + 24}" stroke="${on ? "var(--line)" : "transparent"}" stroke-width="2"/>
          <rect x="360" y="${y}" width="230" height="48" rx="8" fill="${on ? "var(--surface)" : "transparent"}" stroke="${on ? "var(--ink)" : "var(--line)"}" stroke-dasharray="${on ? "0" : "4 4"}" stroke-width="1.5"/>
          <text x="375" y="${y + 20}" font-size="12" font-weight="700" ${on ? "" : "class='muted'"}>GPU ${i + 1}</text>
          <text x="375" y="${y + 38}" font-size="11" class="muted">${on ? "full model copy + own KV cache" : "not in use"}</text>
          ${on ? `<rect x="540" y="${y + 10}" width="40" height="28" rx="4" fill="var(--memory)" opacity=".7"/><text x="560" y="${y + 29}" text-anchor="middle" font-size="9" style="fill:#fff" font-weight="700">model</text>` : ""}`;
      }
      dots.forEach(d => s += `<circle cx="${d.x}" cy="${d.y}" r="5" fill="var(--accent)"/>`);
      s += `<text x="660" y="130" text-anchor="middle" font-size="12" font-weight="600">served</text><text x="660" y="150" text-anchor="middle" font-size="18" font-weight="700" style="fill:var(--ok)">${served.length}</text>`;
      svg.innerHTML = s;
    };
    bindSliders(root, { "t27-r": x => x, "t27-a": x => x }, v => { R = v["t27-r"]; A = v["t27-a"]; });
    let t = 0, srvAcc = 0;
    ctx.loop(dt => {
      dt = Math.min(dt, .1); t += dt;
      acc += dt * A; while (acc >= 1) { acc -= 1; queue++; }
      srvAcc += dt * R * per;
      while (srvAcc >= 1 && queue >= 1) {
        srvAcc -= 1; queue--;
        const g = Math.floor(Math.random() * R);
        dots.push({ x: 250, y: 130, tx: 590, ty: 44 + g * 60, p: 0 });
      }
      if (queue < 1) srvAcc = Math.min(srvAcc, 1);
      dots.forEach(d => { d.p += dt * 1.6; d.x = 250 + (d.tx - 250) * d.p; d.y = 130 + (d.ty - 130) * Math.min(1, d.p * 1.5); });
      dots = dots.filter(d => { if (d.p >= 1) { served.push(1); return false; } return true; });
      if (served.length > 999) served = [];
      const cap = R * per;
      $("#t27-cap", root).textContent = cap;
      $("#t27-q", root).textContent = Math.round(queue);
      $("#t27-st", root).innerHTML = cap >= A ? `<span class="pill ok">keeping up</span>` : `<span class="pill bad">falling behind</span>`;
      draw();
    });
  },
});

/* ---------- Topic 28 ---------- */
topic({
  num: 28, title: "Tensor parallelism",
  question: "How can one layer run on several GPUs at once?",
  render: () => `
    ${say(
      "<b>Tensor parallelism</b> cuts each big weight matrix into slices and puts <b>one slice on each GPU</b>. Every GPU multiplies the input by its slice at the same time, then the GPUs <b>combine their partial results</b> before the next step.",
      "The model now fits (each GPU holds only part of each matrix), and each token's maths is shared. The price: GPUs must talk to each other <b>in every layer</b>."
    )}
    ${see("What does splitting one matrix across GPUs look like?", `
      <div class="btn-row">
        ${seg("t28-n", [["2", "2 GPUs"], ["4", "4 GPUs"]], "2")}
        ${seg("t28-link", [["nvlink", "NVLink"], ["pcie", "PCIe"]], "nvlink")}
        <button type="button" class="btn primary" id="t28-play">▶ Run one layer</button>
      </div>
      <svg class="svg-block" viewBox="0 0 720 300" id="t28-svg"></svg>
      <div class="stage-panel" id="t28-cap" style="min-height:56px"></div>
      <div class="grid2">
        <div style="display:grid;gap:6px"><div class="mini-label">Time per layer</div><div class="stack" id="t28-time"></div></div>
        <div class="stat-row">
          <div class="stat"><span class="v" id="t28-mem">–</span><span class="k">70B weights per GPU (BF16)</span></div>
          <div class="stat"><span class="v" id="t28-comm">–</span><span class="k">communication share</span></div>
        </div>
      </div>
      <p class="c-muted" style="font-size:.82rem">${illus("Conceptual timing")}</p>`)}
    ${ex(`<div class="calc">70B in BF16 = 140 GB · TP = 2 → 70 GB per GPU (fits on 80 GB, tight) · TP = 4 → 35 GB per GPU<br>
      80 layers × 2 combine steps per layer = <b>160 GPU-to-GPU exchanges for every token</b></div>`)}
    ${tech(`<ul>
      <li>Typical split (Megatron-style): the first matrix in a block is split by <b>columns</b>, the second by <b>rows</b>, so only one <b>all-reduce</b> is needed per attention block and one per MLP block.</li>
      <li>Attention heads are divided among GPUs; the KV cache is sharded too.</li>
      <li>Because communication happens every layer, TP needs very fast links (NVLink/NVSwitch) and is usually kept within one server.</li>
      <li>Each GPU reads only its shard of weights, so memory bandwidth effectively adds up across GPUs, which helps memory-bound decode.</li>
    </ul>`)}
    ${inf(`<p>Tensor parallelism is the go-to way to serve a model that is too big for one GPU and to lower per-token latency. On a slow interconnect, communication can eat the gains.</p>`)}
    ${check({
      q: "Why does tensor parallelism need a fast GPU-to-GPU link?",
      opts: ["It only communicates once at the start", "GPUs must combine partial results in every layer, for every token", "It copies the whole model to each GPU", "It uses the CPU for attention"],
      a: 1, why: "Each layer's matrices are split, so partial results must be combined (all-reduce) inside every layer. That's many exchanges per token.",
    })}`,
  mount(root, ctx) {
    let N = 2, link = "nvlink", phase = -1, timer = null;
    const caps = ["Input X (the token's vector) is sent to every GPU.", "Each GPU multiplies X by <b>its own slice</b> of W, all at the same time.", "<b>All-reduce</b>: GPUs exchange and combine their partial results over the interconnect.", "The combined result Y goes on to the next layer, where it happens again."];
    const draw = () => {
      const svg = $("#t28-svg", root), gw = N === 2 ? 240 : 140, gap = N === 2 ? 60 : 30;
      const total = N * gw + (N - 1) * gap, x0 = (720 - total) / 2;
      let s = `<rect x="310" y="8" width="100" height="34" rx="6" fill="${phase === 0 ? "var(--accent)" : "var(--surface-2)"}" stroke="var(--ink)"/><text x="360" y="30" text-anchor="middle" font-size="13" font-weight="700" ${phase === 0 ? 'style="fill:#fff"' : ""}>X</text>`;
      for (let i = 0; i < N; i++) {
        const x = x0 + i * (gw + gap);
        s += `<line x1="360" y1="42" x2="${x + gw / 2}" y2="70" stroke="${phase === 0 ? "var(--accent)" : "var(--line)"}" stroke-width="2"/>
          <rect x="${x}" y="70" width="${gw}" height="130" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
          <text x="${x + 10}" y="90" font-size="12" font-weight="700">GPU ${i + 1}</text>`;
        const cols = 8 / N;
        for (let c = 0; c < 8; c++) {
          const mine = Math.floor(c / cols) === i;
          for (let r = 0; r < 4; r++) s += `<rect x="${x + gw / 2 - 48 + c * 12}" y="${100 + r * 12}" width="10" height="10" rx="1.5" fill="${mine ? (phase === 1 ? "var(--compute)" : "var(--memory)") : "var(--surface-3)"}" opacity="${mine ? 1 : .35}"/>`;
        }
        s += `<text x="${x + gw / 2}" y="170" text-anchor="middle" font-size="11" class="muted">slice ${i + 1} of W (${Math.round(100 / N)}%)</text>
          <text x="${x + gw / 2}" y="188" text-anchor="middle" font-size="11" class="muted">+ ${Math.round(100 / N)}% of KV cache</text>`;
        if (i < N - 1) s += `<line x1="${x + gw}" y1="135" x2="${x + gw + gap}" y2="135" stroke="${phase === 2 ? (link === "nvlink" ? "var(--ok)" : "var(--bad)") : "var(--line)"}" stroke-width="${phase === 2 ? 5 : 2}" stroke-dasharray="${phase === 2 ? "8 5" : "0"}"><animate attributeName="stroke-dashoffset" from="26" to="0" dur=".6s" repeatCount="indefinite"/></line>`;
        s += `<line x1="${x + gw / 2}" y1="200" x2="360" y2="250" stroke="${phase === 3 ? "var(--ok)" : "var(--line)"}" stroke-width="2"/>`;
      }
      s += `<rect x="310" y="250" width="100" height="34" rx="6" fill="${phase === 3 ? "var(--ok)" : "var(--surface-2)"}" stroke="var(--ink)"/><text x="360" y="272" text-anchor="middle" font-size="13" font-weight="700" ${phase === 3 ? 'style="fill:#fff"' : ""}>Y</text>
        <text x="360" y="232" text-anchor="middle" font-size="11" class="muted">${link === "nvlink" ? "NVLink: fast exchange" : "PCIe: slow exchange"}</text>`;
      svg.innerHTML = s;
      $("#t28-cap", root).innerHTML = phase < 0 ? `<p class="c-muted">Press “Run one layer”.</p>` : `<div class="mini-label">Step ${phase + 1} of 4</div><p>${caps[phase]}</p>`;
      const compute = 10 / N, comm = N === 1 ? 0 : (link === "nvlink" ? 1.2 : 9) * (N === 4 ? 1.3 : 1);
      const tot = compute + comm, base = 10;
      $("#t28-time", root).innerHTML = `<span class="s-act" style="width:${compute / Math.max(base, tot) * 100}%">compute</span><span class="s-kv" style="width:${comm / Math.max(base, tot) * 100}%">${comm > 1.5 ? "communicate" : ""}</span><span class="s-free" style="flex:1">${tot < base ? `${fmt(base / tot, 1)}× faster than 1 GPU` : "slower than 1 GPU!"}</span>`;
      $("#t28-mem", root).textContent = `${140 / N} GB`;
      $("#t28-comm", root).textContent = `${Math.round(comm / tot * 100)}%`;
    };
    bindSeg(root, "t28-n", k => { N = +k; draw(); });
    bindSeg(root, "t28-link", k => { link = k; draw(); });
    $("#t28-play", root).onclick = () => {
      if (timer) ctx.stop(timer); phase = 0; draw();
      timer = ctx.every(1600, () => { phase++; if (phase > 3) { ctx.stop(timer); timer = null; phase = 3; } draw(); });
    };
    draw();
  },
});

/* ---------- Topic 29 ---------- */
topic({
  num: 29, title: "Pipeline parallelism",
  question: "What if each GPU holds different layers?",
  render: () => `
    ${say(
      "<b>Pipeline parallelism</b> gives each GPU a <b>consecutive group of layers</b>, like stations on an assembly line. A token's activations flow from GPU 1 to GPU 2 to GPU 3.",
      "GPUs only talk at the <b>boundaries</b> between groups, so slower links are OK. The catch: a GPU sits idle while it waits for the previous station. Those idle gaps are <b>pipeline bubbles</b>."
    )}
    ${see("Where do the bubbles come from?", `
      ${flow([{ t: "GPU 1 · layers 1–20", c: "memory" }, { t: "GPU 2 · layers 21–40", c: "memory" }, { t: "GPU 3 · layers 41–60", c: "memory" }], { id: "t29-flow" })}
      <div class="controls">
        ${slider("t29-m", "Micro-batches sent through the pipeline", 1, 8, 1, 1)}
        ${slider("t29-p", "Pipeline stages (GPUs)", 2, 4, 1, 3)}
      </div>
      <div class="scroll-x"><div class="gantt" id="t29-gantt"></div></div>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t29-idle">–</span><span class="k">GPU time idle (bubbles)</span></div>
        <div class="stat"><span class="v" id="t29-mem">–</span><span class="k">weights per GPU (70B BF16)</span></div>
      </div>
      <p class="c-muted" style="font-size:.82rem">Each column is one time step. Hatched cells = a GPU waiting. Forward-only schedule, as in inference.</p>`)}
    ${ex(`<div class="calc">3 stages, 1 batch → each GPU works 1 of 3 time steps → <b>67% idle</b><br>
      3 stages, 8 micro-batches → idle ≈ 2 ÷ 10 = <b>20%</b>. Keep the pipeline full and bubbles shrink.</div>`)}
    ${tech(`<ul>
      <li>Only activations at stage boundaries cross GPUs: much less communication than tensor parallelism, so it works across servers.</li>
      <li>Splitting the batch into <b>micro-batches</b> keeps every stage busy; with continuous serving the pipeline stays mostly full.</li>
      <li>Pipeline parallelism adds latency per token (every stage in turn), but lets very large models span many GPUs. It's often combined with tensor parallelism inside each server.</li>
    </ul>`)}
    ${fx(["bubble fraction ≈ (stages − 1) ÷ (micro-batches + stages − 1)"])}
    ${inf(`<p>Use pipeline parallelism when a model must span servers, where the links between machines are too slow for tensor parallelism in every layer.</p>`)}
    ${check({
      q: "What is a pipeline bubble?",
      opts: ["A memory leak in the KV cache", "Time when a GPU in the pipeline is idle, waiting for work from the previous stage", "A corrupted activation", "A request that is dropped"],
      a: 1, why: "Stages depend on earlier stages, so a GPU idles until its input arrives. Feeding more micro-batches fills those gaps.",
    })}`,
  mount(root, ctx) {
    let k = 0; ctx.every(700, () => setFlow($("#t29-flow", root), k++ % 3));
    bindSliders(root, { "t29-m": x => x, "t29-p": x => x }, v => {
      const m = v["t29-m"], p = v["t29-p"], cols = m + p - 1;
      let html = `<div class="gr" style="--cols:${cols}"><span class="gl"></span>${Array.from({ length: cols }, (_, t) => `<span class="gl" style="text-align:center">t${t + 1}</span>`).join("")}</div>`;
      for (let s = 0; s < p; s++) {
        html += `<div class="gr" style="--cols:${cols}"><span class="gl">GPU ${s + 1}</span>`;
        for (let t = 0; t < cols; t++) {
          const mb = t - s;
          html += mb >= 0 && mb < m ? `<span class="gc" style="background:${REQ_COLORS[mb]}">${mb + 1}</span>` : `<span class="gc idle"></span>`;
        }
        html += `</div>`;
      }
      $("#t29-gantt", root).innerHTML = html;
      $("#t29-idle", root).textContent = `${Math.round((p - 1) / cols * 100)}%`;
      $("#t29-mem", root).textContent = `${fmt(140 / p, 1)} GB`;
    });
  },
});

/* ---------- Topic 30 ---------- */
topic({
  num: 30, title: "Expert parallelism",
  question: "How do Mixture-of-Experts models spread across GPUs?",
  render: () => `
    ${say(
      "A <b>Mixture-of-Experts (MoE)</b> model replaces one big MLP with many smaller MLPs called <b>experts</b>. A small <b>router</b> looks at each token and picks only the <b>top few experts</b> (top-k) to process it.",
      "So the model can have huge total knowledge (many experts) while each token only pays for a few. <b>Expert parallelism</b> places different experts on different GPUs and sends each token to wherever its chosen experts live."
    )}
    ${see("Where does each token go?", `
      <div class="btn-row">
        ${seg("t30-k", [["1", "top-1"], ["2", "top-2"]], "2")}
        <button type="button" class="btn primary" id="t30-go">Route next token</button>
        <button type="button" class="btn" id="t30-auto">▶ Auto</button>
      </div>
      <svg class="svg-block" viewBox="0 0 720 320" id="t30-svg"></svg>
      <div class="stat-row">
        <div class="stat"><span class="v" id="t30-active">–</span><span class="k">expert weights used per token</span></div>
        <div class="stat"><span class="v" id="t30-tok">–</span><span class="k">tokens routed</span></div>
      </div>`)}
    ${ex(`<div class="calc">Mixtral-8x7B-style model: 8 experts per layer, top-2 routing<br>
      total parameters ≈ 47B (all must be stored) · active per token ≈ 13B (what each token computes)<br>
      → memory like a ~47B model, compute per token like a ~13B model</div>`)}
    ${tech(`<ul>
      <li><b>Router (gate):</b> a small linear layer that scores every expert for a token; the top-k scores are selected and their outputs are mixed by those scores.</li>
      <li><b>Sparse activation:</b> unselected experts do no work for that token.</li>
      <li><b>Expert parallelism:</b> experts are sharded across GPUs; tokens are dispatched to the right GPUs and gathered back with <b>all-to-all</b> communication, in every MoE layer.</li>
      <li>Challenges: uneven load (popular experts), communication cost, and all experts still need memory.</li>
    </ul>`)}
    ${inf(`<p>MoE lowers <b class="c-compute">FLOPs per token</b> but not <b class="c-memory">memory</b>: all experts must sit in HBM. Decode reads only the active experts' weights for a single token, but across a batch many different experts get touched. Expert parallelism spreads that memory and work across GPUs.</p>`)}
    ${check({
      q: "In a top-2 MoE layer with 8 experts, how many experts process a given token?",
      opts: ["All 8", "2", "1", "4"],
      a: 1, why: "Top-2 routing picks the two highest-scoring experts. The other six do no work for that token (though they still take memory).",
    })}`,
  mount(root, ctx) {
    const toks = ["The", " robot", " solved", " the", " integral", " and", " wrote", " a", " poem", " about", " GPUs"];
    let ti = 0, load = new Array(8).fill(0), last = null, auto = null;
    const topK = () => +segVal(root, "t30-k");
    const draw = () => {
      const k = topK();
      let s = `<rect x="300" y="10" width="120" height="36" rx="6" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="360" y="33" text-anchor="middle" font-size="13" font-weight="700">${last ? JSON.stringify(last.tok) : "token"}</text>
        <rect x="290" y="70" width="140" height="36" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
        <text x="360" y="93" text-anchor="middle" font-size="13" font-weight="700">Router</text>
        <line x1="360" y1="46" x2="360" y2="70" stroke="var(--ink)"/>`;
      for (let g = 0; g < 4; g++) {
        const gx = 20 + g * 175;
        s += `<rect x="${gx}" y="170" width="160" height="120" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><text x="${gx + 10}" y="190" font-size="12" font-weight="700">GPU ${g + 1}</text>`;
        for (let e = 0; e < 2; e++) {
          const ei = g * 2 + e, ex = gx + 12 + e * 74, sel = last && last.top.includes(ei);
          s += `<rect x="${ex}" y="202" width="64" height="50" rx="6" fill="${sel ? "var(--compute)" : "var(--surface-2)"}" stroke="${sel ? "var(--compute)" : "var(--line)"}"/>
            <text x="${ex + 32}" y="224" text-anchor="middle" font-size="11" font-weight="700" ${sel ? 'style="fill:#fff"' : ""}>Expert ${ei + 1}</text>
            <text x="${ex + 32}" y="242" text-anchor="middle" font-size="10" ${sel ? 'style="fill:#fff"' : 'class="muted"'}>${last ? `score ${last.scores[ei].toFixed(2)}` : ""}</text>
            <rect x="${ex}" y="258" width="64" height="6" rx="3" fill="var(--surface-3)"/><rect x="${ex}" y="258" width="${Math.min(64, load[ei] * 8)}" height="6" rx="3" fill="var(--kv)"/>`;
          if (sel) s += `<line x1="360" y1="106" x2="${ex + 32}" y2="202" stroke="var(--compute)" stroke-width="2.5" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="20" to="0" dur=".5s" repeatCount="indefinite"/></line>`;
        }
      }
      s += `<text x="20" y="308" font-size="10" class="muted">purple bars = how many tokens each expert has handled (load)</text>`;
      $("#t30-svg", root).innerHTML = s;
      $("#t30-active", root).textContent = `${k} of 8 experts (${k * 100 / 8}%)`;
      $("#t30-tok", root).textContent = ti;
    };
    const route = () => {
      const tok = toks[ti % toks.length];
      let h = 0; for (const c of tok + ti) h = (h * 31 + c.charCodeAt(0)) % 9973;
      const raw = Array.from({ length: 8 }, (_, i) => Math.abs(Math.sin(h * (i + 1) * 12.9898)) * 3);
      const ex = raw.map(Math.exp), sum = ex.reduce((a, b) => a + b, 0), scores = ex.map(v => v / sum);
      const top = scores.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, topK()).map(x => x[1]);
      top.forEach(i => load[i]++);
      last = { tok, scores, top }; ti++; draw();
    };
    bindSeg(root, "t30-k", () => { if (last) { last.top = last.scores.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, topK()).map(x => x[1]); } draw(); });
    $("#t30-go", root).onclick = route;
    $("#t30-auto", root).onclick = () => {
      if (auto) { ctx.stop(auto); auto = null; $("#t30-auto", root).textContent = "▶ Auto"; return; }
      $("#t30-auto", root).textContent = "❚❚ Pause"; route(); auto = ctx.every(1200, route);
    };
    draw();
  },
});

part({

  blurb: "Serving tricks that shrink the KV cache, keep the GPU full, and avoid repeating work.",
