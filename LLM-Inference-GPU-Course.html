<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPU Inference Course</title>
<meta name="description" content="Interactive course: LLM inference and the GPU concepts behind it.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   LLM Inference & GPU Architecture — course styles
   Colour carries meaning everywhere:
     --compute (orange)  = computation, Tensor Cores, FLOPs
     --memory  (blue)    = memory, HBM, data movement, bandwidth
     --kv      (purple)  = KV cache
     --accent  (teal)    = course navigation / progress
   ============================================================ */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f6;
  --surface-3: #e1e6ed;
  --ink: #141a24;
  --muted: #5d6675;
  --line: #d9dee6;
  --accent: #27406f;
  --accent-soft: #e8edf6;
  --compute: #df7414;
  --compute-soft: #fdeedf;
  --memory: #2f6bdc;
  --memory-soft: #e4edfc;
  --kv: #8753e6;
  --kv-soft: #f0e9fd;
  --ok: #1f8a4c;
  --ok-soft: #e3f4ea;
  --bad: #cf3a3a;
  --bad-soft: #fbe5e5;
  --warn: #9a6b00;
  --warn-soft: #fbf3dd;
  --shadow: 0 1px 2px rgba(20, 26, 36, .05), 0 4px 14px rgba(20, 26, 36, .05);
  --radius: 10px;
  --radius-sm: 6px;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.c-compute { color: var(--compute); font-weight: 600; }
.c-memory { color: var(--memory); font-weight: 600; }
.c-kv { color: var(--kv); font-weight: 600; }
.c-ok { color: var(--ok); font-weight: 600; }
.c-bad { color: var(--bad); font-weight: 600; }
.c-muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------------- App shell ---------------- */
.app { display: grid; grid-template-rows: auto 1fr; min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px 0;
}
.topbar-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
.brand .sub { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.overall { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .82rem; color: var(--muted); }
.overall-bar { width: 160px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.overall-bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font-size: .8rem; }
.icon-btn:hover { border-color: var(--accent); }

.parts { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: thin; }
.part-tab {
  flex: 1 0 128px; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 6px 10px 9px; border-radius: 8px 8px 0 0; color: var(--muted); position: relative;
}
.part-tab:hover { background: var(--surface-2); color: var(--ink); }
.part-tab .pn { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
.part-tab .pt { display: block; font-size: .82rem; font-weight: 600; line-height: 1.25; margin-top: 1px; }
.part-tab .pbar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.part-tab .pbar > i { display: block; height: 100%; background: var(--accent); }
.part-tab.active { background: var(--surface); color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }
.part-tab.done .pn::after { content: " ✓"; color: var(--ok); }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; }
.sidebar {
  border-right: 1px solid var(--line); padding: 18px 12px; background: var(--surface);
  position: sticky; top: 104px; align-self: start; height: calc(100vh - 104px); overflow-y: auto;
}
.sidebar .part-head { padding: 0 8px 12px; }
.sidebar .part-head .pn { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.sidebar .part-head h2 { font-size: 1.15rem; margin-top: 2px; }
.sidebar .part-head p { font-size: .82rem; color: var(--muted); margin-top: 6px; }
.topic-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.topic-link {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start;
  text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: .86rem; line-height: 1.3; color: var(--ink);
}
.topic-link:hover { background: var(--surface-2); }
.topic-link .tn {
  font-family: var(--f-mono); font-size: .7rem; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--muted); background: var(--surface);
}
.topic-link.visited .tn { border-color: var(--accent); color: var(--accent); }
.topic-link.done .tn { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.topic-link.active { background: var(--accent-soft); font-weight: 600; }
.sidebar .story { margin: 18px 8px 0; padding-top: 14px; border-top: 1px dashed var(--line); font-size: .78rem; color: var(--muted); }
.sidebar .story .story-h { color: var(--ink); display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-family: var(--f-mono); margin-bottom: 4px; }

.main { min-width: 0; padding: 26px 20px 110px; }
.stage { max-width: 1140px; margin: 0 auto; display: grid; gap: 18px; }
.topic-head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.topic-head h2 { font-size: clamp(1.7rem, 3vw, 2.35rem); font-weight: 700; line-height: 1.12; }
.question-chip {
  justify-self: start; display: inline-flex; gap: 8px; align-items: baseline; margin-top: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: .9rem;
}
.question-chip b { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

.footer-nav {
  position: fixed; left: 270px; right: 0; bottom: 0; z-index: 15;
  padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
}
.footer-inner { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.footer-inner .where { flex: 1; text-align: center; font-size: .82rem; color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 5px; margin-top: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
.dots i.done { background: var(--accent); }
.dots i.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------------- Buttons & controls ---------------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; font-size: .9rem;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: .8rem; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: .85rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }

.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; }
.ctl { display: grid; gap: 2px; }
.ctl label { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ctl label output { font-family: var(--f-mono); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 5px 8px; }

/* ---------------- Beats (teaching progression) ---------------- */
.beat { display: grid; gap: 10px; min-width: 0; }
.beat-body { min-width: 0; display: grid; gap: 10px; }
.lede { font-size: 1.12rem; line-height: 1.6; max-width: 72ch; }
.b-intuit { gap: 8px; }
.beat p { max-width: 74ch; }
.beat ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 74ch; }
.inf { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; display: grid; gap: 6px; }
.ex-h, .quiz-h { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.viz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0; }
.viz-q { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.viz-q::before { content: "?"; font-family: var(--f-mono); font-size: .75rem; width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--bg); transform: translateY(-2px); }
.scroll-x { overflow-x: auto; }

.example { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; }
.calc { font-family: var(--f-mono); font-size: .92rem; line-height: 1.8; }
.calc .eq { color: var(--muted); }
details.tech { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.tech > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: .9rem; list-style: none; display: flex; gap: 8px; align-items: center; }
details.tech > summary::before { content: "+"; font-family: var(--f-mono); width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; background: var(--surface-2); }
details.tech[open] > summary::before { content: "−"; }
details.tech > div { padding: 0 14px 14px; display: grid; gap: 8px; }
.formula {
  font-family: var(--f-mono); font-size: 1.05rem; background: var(--surface); border: 1px dashed var(--line);
  border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 4px; overflow-x: auto;
}
.formula .fnote { font-family: var(--f-body); font-size: .82rem; color: var(--muted); }
.callout { border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: .92rem; align-items: start; }
.callout .tag { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; white-space: nowrap; margin-top: 2px; }
.callout.note { background: var(--warn-soft); }
.callout.note .tag { background: var(--warn); color: var(--surface); }
.callout.key { background: var(--accent-soft); font-size: 1.02rem; font-weight: 500; }
.callout.key .tag { background: var(--accent); color: var(--surface); }
.callout.big { background: var(--memory-soft); font-size: 1.1rem; font-weight: 600; font-family: var(--f-display); }
.callout.big .tag { background: var(--memory); color: #fff; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.card h4 { font-size: .98rem; }
.card p, .card li { font-size: .88rem; }
.card.flat { background: var(--surface-2); border-color: transparent; }
.mini-label { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.big-num { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--f-mono); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .75rem; color: var(--muted); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; font-family: var(--f-mono); }
.pill.compute { background: var(--compute-soft); color: var(--compute); }
.pill.memory { background: var(--memory-soft); color: var(--memory); }
.pill.mixed { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.illus { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 6px; justify-self: start; }

.cmp-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.cmp-table th, .cmp-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp-table th { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }

/* ---------------- Tokens ---------------- */
.tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tok {
  font-family: var(--f-mono); font-size: .88rem; padding: 3px 9px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--line); white-space: pre; transition: all .25s;
}
.tok.prompt { background: var(--accent-soft); border-color: var(--accent); }
.tok.gen { background: var(--compute-soft); border-color: var(--compute); }
.tok.new { animation: pop .45s ease-out; }
.tok.lit { background: var(--compute); color: #fff; border-color: var(--compute); }
.tok.ghost { opacity: .35; border-style: dashed; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

/* ---------------- Flow chains ---------------- */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow.vertical { flex-direction: column; align-items: stretch; }
.flow .node {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm);
  padding: 7px 12px; font-size: .88rem; font-weight: 500; transition: all .3s; text-align: center;
}
.flow .node.compute { border-color: var(--compute); }
.flow .node.memory { border-color: var(--memory); }
.flow .node.kv { border-color: var(--kv); }
.flow .node.active { background: var(--ink); color: var(--bg); border-color: var(--ink); transform: scale(1.04); }
.flow .node.active.compute { background: var(--compute); border-color: var(--compute); color: #fff; }
.flow .node.active.memory { background: var(--memory); border-color: var(--memory); color: #fff; }
.flow .node.active.kv { background: var(--kv); border-color: var(--kv); color: #fff; }
.flow .node.past { opacity: .75; }
.flow .arr { color: var(--muted); font-family: var(--f-mono); font-size: .9rem; }
.flow.vertical .arr { text-align: center; line-height: 1; }
.flow .arr.active { color: var(--ink); animation: nudge .6s infinite; }
@keyframes nudge { 50% { transform: translateX(3px); } }
.flow.vertical .arr.active { animation: nudgeY .6s infinite; }
@keyframes nudgeY { 50% { transform: translateY(3px); } }

/* ---------------- Meters & bars ---------------- */
.meter { display: grid; gap: 3px; }
.meter .mh { display: flex; justify-content: space-between; font-size: .8rem; gap: 8px; }
.meter .mh span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.meter .track { height: 12px; border-radius: 6px; background: var(--surface-3); overflow: hidden; position: relative; }
.meter .track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; transition: width .35s; }
.meter.compute .track > i { background: var(--compute); }
.meter.memory .track > i { background: var(--memory); }
.meter.kv .track > i { background: var(--kv); }
.meter.accent .track > i { background: var(--accent); }
.meter.ok .track > i { background: var(--ok); }
.meter.bad .track > i { background: var(--bad); }

.stack { display: flex; height: 34px; border-radius: 6px; overflow: hidden; background: var(--surface-3); position: relative; }
.stack > span { display: grid; place-items: center; font-size: .72rem; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; transition: width .35s; }
.stack .s-w { background: var(--memory); }
.stack .s-kv { background: var(--kv); }
.stack .s-act { background: var(--compute); }
.stack .s-free { background: transparent; color: var(--muted); }
.stack .cap-line { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bad); }

/* ---------------- Quiz ---------------- */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.quiz-q { font-weight: 600; font-size: 1.02rem; }
.quiz-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.quiz-opt {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm);
  padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; font-size: .92rem;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--kv); }
.quiz-opt:disabled { cursor: default; }
.quiz-letter { font-family: var(--f-mono); font-size: .75rem; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
.quiz-opt.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz-opt.right .quiz-letter { background: var(--ok); color: #fff; }
.quiz-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz-opt.wrong .quiz-letter { background: var(--bad); color: #fff; }
.quiz-why { font-size: .92rem; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); display: grid; gap: 6px; }
.quiz-why b.ok { color: var(--ok); }
.quiz-why b.no { color: var(--bad); }

/* ---------------- GPU diagram ---------------- */
.gpu-wrap { display: grid; grid-template-columns: minmax(150px, 190px) 50px minmax(0, 1fr); align-items: center; gap: 0; min-width: 640px; }
.host { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; }
.host .hl { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.part-box { border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 6px 8px; font-size: .78rem; font-weight: 600; cursor: pointer; background: var(--surface); transition: all .2s; text-align: center; }
.part-box:hover { border-color: var(--accent); }
.part-box.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.bus { height: 10px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); position: relative; cursor: pointer; }
.bus span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: .62rem; font-family: var(--f-mono); color: var(--muted); }
.bus.sel { background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 10px); }

/* ============================================================

   Each part file calls part({...}) then topic({...}).

const COURSE = { parts: [], topics: [] };
function part(p) { COURSE.parts.push(Object.assign({ topics: [] }, p)); }
function topic(t) {
  t.partIndex = COURSE.parts.length - 1;
  if (t.num !== null) t.num = COURSE.topics.filter(x => x.num !== null).length + 1;

  COURSE.parts[t.partIndex].topics.push(t);

  if (a >= 100) return Math.round(n).toLocaleString("en-US");
  if (a >= 10) return n.toFixed(Math.max(0, d - 0)).replace(/\.0+$/, "");
  if (a >= 1) return n.toFixed(d).replace(/\.0+$/, "");
  if (a === 0) return "0";
  return n.toPrecision(2);
}
function words(n) {
  // 1.4e11 -> "140 billion"
  const units = [[1e18, "quintillion"], [1e15, "quadrillion"], [1e12, "trillion"], [1e9, "billion"], [1e6, "million"], [1e3, "thousand"]];
  for (const [v, w] of units) if (Math.abs(n) >= v) return `${fmt(n / v, 1)} ${w}`;
  return fmt(n, 1);
}
function gb(bytes) {
  const g = bytes / 1e9;
  if (g >= 1000) return `${fmt(g / 1000, 2)} TB`;
  if (g >= 1) return `${fmt(g, 1)} GB`;
  if (bytes >= 1e6) return `${fmt(bytes / 1e6, 1)} MB`;
  if (bytes >= 1e3) return `${fmt(bytes / 1e3, 1)} KB`;
  return `${fmt(bytes, 0)} bytes`;
}
function sci(n) {
  if (n === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(n)));
  const m = n / Math.pow(10, e);
  const sup = String(e).split("").map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)] || (c === "-" ? "⁻" : c)).join("");
  return `${m.toFixed(1)}×10${sup}`;
}

const STORE_KEY = "llm-gpu-course-v1";
const state = { cur: 0, done: new Set(), visited: new Set() };
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    if (Array.isArray(s.done)) s.done.forEach(i => state.done.add(i));
    if (Array.isArray(s.visited)) s.visited.forEach(i => state.visited.add(i));
    if (Number.isInteger(s.cur)) state.cur = clamp(s.cur, 0, COURSE.topics.length - 1);
  } catch (e) { /* storage unavailable: start fresh */ }
  const m = location.hash.match(/t=(\d+)/);
  if (m) state.cur = clamp(+m[1] - 1, 0, COURSE.topics.length - 1);
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ cur: state.cur, done: [...state.done], visited: [...state.visited] })); } catch (e) { }
}

/* timers registered by a topic are cleared on navigation */
function makeCtx() {
  const timers = [], rafs = [];
  const ctx = {
    every(ms, fn) { const t = setInterval(fn, ms); timers.push(t); return t; },
    after(ms, fn) { const t = setTimeout(fn, ms); timers.push(t); return t; },
    stop(t) { clearInterval(t); clearTimeout(t); },
    loop(fn) {
      let alive = true, last = performance.now();
      const tick = (now) => { if (!alive) return; fn((now - last) / 1000, now); last = now; rafs.push(requestAnimationFrame(tick)); };
      rafs.push(requestAnimationFrame(tick));
      return () => { alive = false; };
    },
    dispose() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); rafs.forEach(cancelAnimationFrame); ctx.disposed = true; },
    go(i) { navigate(i); },
  };
  return ctx;
}
let currentCtx = null;

function renderNav() {

}

function navigate(i) {
  if (i < 0 || i >= COURSE.topics.length) return;
  if (currentCtx) currentCtx.dispose();
  state.cur = i; state.visited.add(i); saveState();
  if (location.hash !== `#t=${i + 1}`) history.replaceState(null, "", `#t=${i + 1}`);
  const t = COURSE.topics[i], p = COURSE.parts[t.partIndex];
  currentCtx = makeCtx();
  $("#stage").innerHTML = `
    <div class="topic-head">
      <div class="eyebrow">${p.num ? `Part ${p.num} · ${p.title}` : "All together"} · ${topicNumberLabel(t)}</div>

      ${t.question ? `<div class="question-chip"><b>Answers</b><span>${t.question}</span></div>` : ""}
    </div>
    ${t.render(currentCtx)}`;
  if (t.mount) t.mount($("#stage"), currentCtx);
  renderNav();
  window.scrollTo({ top: 0 });
}

/* bind range sliders: spec = { id: (value, allValues) => label } */
function bindSliders(root, spec, update) {
  const read = () => { const v = {}; for (const id in spec) v[id] = +$("#" + id, root).value; return v; };
  const run = () => {
    const v = read();
    for (const id in spec) { const o = $("#" + id + "-o", root); if (o) o.textContent = spec[id](v[id], v); }
    update(v);
  };

}

function player(id) {
  return `<div class="player" id="${id}">
    <button type="button" class="btn" data-a="restart" title="Restart">⏮ Restart</button>
    <button type="button" class="btn" data-a="back">◀ Step</button>
    <button type="button" class="btn primary" data-a="play">▶ Play</button>
    <button type="button" class="btn" data-a="fwd">Step ▶</button>

    <span class="pl-count"></span>
    <select data-a="speed" aria-label="Speed"><option value="1.7">Slow</option><option value="1" selected>Normal</option><option value="0.55">Fast</option></select>
  </div>`;
}
function bindPlayer(root, id, ctx, o) {
  const el = $("#" + id, root), q = a => $(`[data-a="${a}"]`, el);
  let i = 0, timer = null, frames = o.frames;
  const show = (k) => {
    i = clamp(k, 0, frames - 1);
    q("scrub").max = frames - 1; q("scrub").value = i;
    $(".pl-count", el).textContent = `${i + 1} / ${frames}`;
    q("back").disabled = i === 0; q("fwd").disabled = i === frames - 1;
    o.render(i);
  };
  const stop = () => { if (timer) { ctx.stop(timer); timer = null; } q("play").textContent = "▶ Play"; };
  const play = () => {
    if (i >= frames - 1) show(0);
    q("play").textContent = "❚❚ Pause";
    timer = ctx.every((o.interval || 1800) * +q("speed").value, () => { if (i >= frames - 1) stop(); else show(i + 1); });
  };
  q("play").onclick = () => timer ? stop() : play();
  q("fwd").onclick = () => { stop(); show(i + 1); };
  q("back").onclick = () => { stop(); show(i - 1); };
  q("restart").onclick = () => { stop(); show(0); };
  q("scrub").oninput = () => { stop(); show(+q("scrub").value); };
  q("speed").onchange = () => { if (timer) { stop(); play(); } };
  show(0);
  return { show, stop, get i() { return i; }, setFrames(n) { frames = n; show(Math.min(i, n - 1)); } };
}

/* ---------- Topic 1 ---------- */

  question: "What exactly happens, step by step, when a model answers?",
  render: () => `

      <div class="stage-view" id="t1-view"></div>`)}

          ${flow([{ t: "Data batch" }, { t: "Model", c: "compute" }, { t: "Loss" }, { t: "Update weights", c: "memory" }, { t: "↺ repeat" }], { id: "t1-train" })}
